<!DOCTYPE html>
<html lang="he" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS365 - Weekly View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-over {
            background-color: #f0fdf4; /* Light green highlight */
            border: 2px dashed #22c55e;
        }
        .task-card {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .task-card:active {
            cursor: grabbing;
        }
        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <nav class="bg-white border-b p-4 flex justify-between items-center">
        <div class="font-bold text-xl tracking-tight">PCS<span class="text-green-600">365</span></div>
        <button onclick="toggleLanguage()" id="langBtn" class="text-sm bg-gray-100 px-3 py-1 rounded-full hover:bg-gray-200 transition">
            English
        </button>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="mb-8">
            <h1 id="pageTitle" class="text-3xl font-bold">מבט שבועי</h1>
            <p id="pageSubtitle" class="text-gray-500 mt-2">גרור והשלך משימות כדי לארגן את השבוע שלך.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-7 gap-4" id="weeklyGrid">
            </div>
    </main>

    <script>
        // תרגומים
        const i18n = {
            he: {
                title: "מבט שבועי",
                subtitle: "גרור והשלך משימות כדי לארגן את השבוע שלך.",
                days: ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"],
                addTask: "+ הוסף משימה",
                langBtn: "English",
                dir: "rtl"
            },
            en: {
                title: "Weekly View",
                subtitle: "Drag and drop tasks to organize your week.",
                days: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
                addTask: "+ Add Task",
                langBtn: "עברית",
                dir: "ltr"
            }
        };

        let currentLang = 'he';

        // נתונים לדוגמה (במציאות יגיעו מה-DB שלך)
        let tasks = [
            { id: 1, text: "אימון בוקר", day: 0, completed: false },
            { id: 2, text: "סיכום שבועי AI", day: 0, completed: true },
            { id: 3, text: "פגישת צוות", day: 1, completed: false },
            { id: 4, text: "קניית מצרכים", day: 4, completed: false }
        ];

        function init() {
            renderGrid();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'he' ? 'en' : 'he';
            const htmlTag = document.getElementById('mainHtml');
            htmlTag.dir = i18n[currentLang].dir;
            htmlTag.lang = currentLang;
            
            document.getElementById('pageTitle').innerText = i18n[currentLang].title;
            document.getElementById('pageSubtitle').innerText = i18n[currentLang].subtitle;
            document.getElementById('langBtn').innerText = i18n[currentLang].langBtn;
            
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('weeklyGrid');
            grid.innerHTML = '';

            i18n[currentLang].days.forEach((dayName, index) => {
                const dayColumn = document.createElement('div');
                dayColumn.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-4 min-h-[300px] flex flex-col";
                dayColumn.setAttribute('onwrap', 'return false;');
                dayColumn.innerHTML = `
                    <h3 class="font-bold text-lg mb-4 text-gray-700 border-b pb-2">${dayName}</h3>
                    <div class="task-list flex-grow space-y-3" 
                         ondragover="allowDrop(event)" 
                         ondragleave="clearHighlight(event)"
                         ondrop="drop(event, ${index})">
                        ${renderTasks(index)}
                    </div>
                    <button class="mt-4 text-sm text-gray-400 hover:text-green-600 transition text-right">
                        ${i18n[currentLang].addTask}
                    </button>
                `;
                grid.appendChild(dayColumn);
            });
        }

        function renderTasks(dayIndex) {
            return tasks
                .filter(t => t.day === dayIndex)
                .map(t => `
                    <div class="task-card bg-gray-50 p-3 rounded-lg border border-gray-100 flex items-center justify-between shadow-sm"
                         draggable="true" 
                         ondragstart="drag(event, ${t.id})">
                        <span class="text-sm ${t.completed ? 'completed' : ''}">${t.text}</span>
                        <input type="checkbox" ${t.completed ? 'checked' : ''} 
                               onchange="toggleTask(${t.id})"
                               class="h-4 w-4 rounded border-gray-300 text-green-600 focus:ring-green-500">
                    </div>
                `).join('');
        }

        // פונקציות Drag & Drop
        function drag(ev, id) {
            ev.dataTransfer.setData("taskId", id);
        }

        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function clearHighlight(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drop(ev, newDay) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            const taskId = parseInt(ev.dataTransfer.getData("taskId"));
            
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.day = newDay;
                renderGrid();
            }
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                renderGrid();
            }
        }

        init();
    </script>
</body>
</html>
