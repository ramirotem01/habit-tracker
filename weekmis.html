<!DOCTYPE html>
<html lang="he" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS365 - Weekly View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .drag-over { background-color: #f0fdf4 !important; border: 2px dashed #22c55e !important; }
        .task-card { cursor: grab; transition: all 0.2s ease; user-select: none; }
        .task-card:active { cursor: grabbing; }
        .completed { text-decoration: line-through; opacity: 0.5; }
        
        /* עיצוב טקסט ארוך ופתיחה בלחיצה */
        .task-text { 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            cursor: pointer; 
            display: inline-block; 
            flex: 1; 
            transition: all 0.3s ease;
        }
        .task-text.expanded { 
            white-space: normal !important; 
            overflow: visible !important; 
            word-break: break-word;
        }

        .day-column { min-height: 450px; }
        @media (max-width: 768px) {
            .weekly-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 1rem; padding-bottom: 1rem; }
            .day-column { min-width: 85vw; scroll-snap-align: start; }
        }

        /* עיצוב כפתור תכלת אחיד */
        .btn-primary { 
            background-color: #3498db; 
            color: white; 
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <nav class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <div class="font-bold text-xl tracking-tight cursor-pointer" onclick="window.location.href='dashboard.html'">
            PCS<span class="text-green-600">365</span>
        </div>
        <div id="weekRange" class="text-sm font-medium text-gray-500"></div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 id="ui-title" class="text-3xl font-bold text-gray-800">מבט שבועי</h1>
                <p id="ui-subtitle" class="text-gray-500 mt-2">סדר את המשימות שלך השבוע (Drag & Drop)</p>
            </div>
            <button id="backBtn" onclick="window.location.href='dashboard.html'" class="btn-primary px-4 py-2 rounded-lg text-sm font-medium shadow-sm">חזרה לדשבורד</button>
        </header>

        <div class="weekly-container grid grid-cols-1 md:grid-cols-7 gap-4" id="weeklyGrid"></div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        const isEn = !navigator.language.startsWith('he');
        const daysLabels = isEn ? 
            ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"] : 
            ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

        // תרגום ממשק
        if (isEn) {
            document.getElementById("ui-title").textContent = "Weekly Overview";
            document.getElementById("ui-subtitle").textContent = "Organize your tasks for the week (Drag & Drop)";
            document.getElementById("backBtn").textContent = "Back to Dashboard";
            document.documentElement.dir = "ltr";
        }

        let userId = null;
        let weekDates = [];
        let allWeekTasks = {};

        auth.onAuthStateChanged(user => {
            if (user) {
                userId = user.uid;
                calculateWeekDates();
                loadWeekData();
            } else {
                window.location.href = "index.html";
            }
        });

        function calculateWeekDates() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - dayOfWeek);

            weekDates = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(startOfWeek);
                d.setDate(startOfWeek.getDate() + i);
                weekDates.push(d.toISOString().split('T')[0]);
            }
            document.getElementById('weekRange').textContent = `${weekDates[0]} - ${weekDates[6]}`;
        }

        async function loadWeekData() {
            const grid = document.getElementById('weeklyGrid');
            grid.innerHTML = `<p class="col-span-7 text-center py-20 text-gray-400">${isEn ? 'Loading data...' : 'טוען נתונים...'}</p>`;

            try {
                const baseSnap = await db.collection("users").doc(userId).collection("habits").get();
                const baseHabits = baseSnap.docs.map(doc => ({ text: doc.data().text, isTemp: false }));

                for (const dateId of weekDates) {
                    const tempSnap = await db.collection("users").doc(userId).collection("daily").doc(dateId).collection("tempHabits").get();
                    const temps = tempSnap.docs.map(doc => ({ id: doc.id, text: doc.data().text, isTemp: true }));
                    
                    const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(dateId).get();
                    const dayStats = statsDoc.exists ? statsDoc.data() : {};

                    allWeekTasks[dateId] = [...baseHabits, ...temps].map(task => ({
                        ...task,
                        completed: dayStats[task.text] === true
                    }));
                }
                renderGrid();
            } catch (err) { console.error("Load error:", err); }
        }

        function renderGrid() {
            const grid = document.getElementById('weeklyGrid');
            grid.innerHTML = '';

            weekDates.forEach((dateId, index) => {
                const dayColumn = document.createElement('div');
                dayColumn.className = "day-column bg-white rounded-xl shadow-sm border border-gray-200 p-3 flex flex-col";
                const isToday = dateId === new Date().toISOString().split('T')[0];
                
                dayColumn.innerHTML = `
                    <div class="text-center border-b pb-2 mb-3">
                        <div class="font-bold ${isToday ? 'text-green-600' : 'text-gray-700'}">${daysLabels[index]}</div>
                        <div class="text-xs text-gray-400">${dateId.split('-').reverse().slice(0,2).join('/')}</div>
                    </div>
                    <div class="flex-grow space-y-2 task-list" 
                         data-date="${dateId}"
                         ondragover="event.preventDefault(); this.classList.add('drag-over');" 
                         ondragleave="this.classList.remove('drag-over');"
                         ondrop="handleDrop(event, '${dateId}')">
                        ${renderTasks(dateId)}
                    </div>
                `;
                grid.appendChild(dayColumn);
            });
        }

        function renderTasks(dateId) {
            const tasks = allWeekTasks[dateId] || [];
            return tasks.map(t => `
                <div class="task-card bg-gray-50 p-2 rounded border border-gray-100 flex items-start justify-between text-sm shadow-sm"
                     draggable="${t.isTemp}" 
                     ondragstart="handleDragStart(event, '${t.id}', '${dateId}', '${t.text}')"
                     style="${!t.isTemp ? 'border-inline-start: 3px solid #3498db; cursor: default;' : ''}">
                    
                    <span class="task-text ${t.completed ? 'completed' : ''}" 
                          onclick="this.classList.toggle('expanded')">
                        ${t.text}
                    </span>

                    <input type="checkbox" ${t.completed ? 'checked' : ''} 
                           onchange="toggleTask('${dateId}', '${t.text}', this.checked)"
                           class="h-4 w-4 rounded border-gray-300 text-green-600 cursor-pointer mt-1 ml-2 mr-2">
                </div>
            `).join('');
        }

        function handleDragStart(ev, id, fromDate, text) {
            ev.dataTransfer.setData("taskId", id);
            ev.dataTransfer.setData("fromDate", fromDate);
            ev.dataTransfer.setData("taskText", text);
        }

        async function handleDrop(ev, toDate) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            const taskId = ev.dataTransfer.getData("taskId");
            const fromDate = ev.dataTransfer.getData("fromDate");
            const taskText = ev.dataTransfer.getData("taskText");
            if (fromDate === toDate || !taskId) return;
            try {
                await db.collection("users").doc(userId).collection("daily").doc(toDate).collection("tempHabits").add({ text: taskText });
                await db.collection("users").doc(userId).collection("daily").doc(fromDate).collection("tempHabits").doc(taskId).delete();
                const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(fromDate).get();
                if (statsDoc.exists) {
                    let stats = statsDoc.data();
                    if (stats[taskText] !== undefined) {
                        const isDone = stats[taskText];
                        delete stats[taskText];
                        await db.collection("users").doc(userId).collection("stats").doc(fromDate).set(stats);
                        const toStatsDoc = await db.collection("users").doc(userId).collection("stats").doc(toDate).get();
                        let toStats = toStatsDoc.exists ? toStatsDoc.data() : {};
                        toStats[taskText] = isDone;
                        await db.collection("users").doc(userId).collection("stats").doc(toDate).set(toStats);
                    }
                }
                loadWeekData();
            } catch (err) { console.error(err); }
        }

        async function toggleTask(dateId, taskText, isChecked) {
            try {
                const statsRef = db.collection("users").doc(userId).collection("stats").doc(dateId);
                const doc = await statsRef.get();
                let stats = doc.exists ? doc.data() : {};
                stats[taskText] = isChecked;
                await statsRef.set(stats);
                loadWeekData();
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
