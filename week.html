<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תכנון שבועי - Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .date-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; background: #f8f9fa; padding: 10px; border-radius: 12px; }
    .tasks-title-container { flex: 1; text-align: center; }
    .tasks-title-container h2 { margin: 0; font-size: 1.1em; color: #2c3e50; }
    .nav-btn { background: #ffffff; border: none; border-radius: 50%; width: 38px; height: 38px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #3498db; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: all 0.2s ease; }
    .summary-card { display: flex; justify-content: space-between; align-items: center; }
    .task-progress-circle { width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 5px solid #eee; }
    .task-circle-low { border-color: #f1c40f; color: #f39c12; }
    .task-circle-done { border-color: #2ecc71; color: #27ae60; background-color: #fafffa; }
    .goal-item { display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 12px; margin-bottom: 8px; border-radius: 8px; border-right: 4px solid #3498db; }
    .goal-text { flex: 1; font-size: 0.95em; }
    .goal-done { text-decoration: line-through; color: #95a5a6; }
    .ai-btn { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; cursor: pointer; }
    .ai-breakdown-area { background: #f0f7ff; border: 2px dashed #3498db; border-radius: 12px; padding: 15px; margin-top: 20px; display: none; }
    .suggested-task-item { background: white; padding: 10px; margin: 5px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; border: 1px solid #e0e0e0; }
    .add-task-btn { background: #2ecc71; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <h1>📅 תכנון שבועי</h1>
    <section class="card summary-card">
      <div class="summary-info">
        <p>טווח: <strong id="weekDatesDisplay">טוען...</strong></p>
        <p>יעדים: <span id="totalGoals">0</span> | בוצעו: <span id="completedGoals">0</span></p>
      </div>
      <div id="weekProgressCircle" class="task-progress-circle task-circle-low">0%</div>
    </section>

    <section class="card">
      <div class="date-nav">
        <button onclick="changeWeek(-1)" class="nav-btn"><span>&#10094;</span></button>
        <div class="tasks-title-container"><h2>🎯 יעדי השבוע</h2></div>
        <button onclick="changeWeek(1)" class="nav-btn"><span>&#10095;</span></button>
      </div>
      <div style="display:flex; gap:8px; margin-bottom:15px;">
        <input type="text" id="weekGoalInput" placeholder="הוסף יעד לשבוע זה..." style="flex:1; padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
        <button onclick="addWeekGoal()" style="background:#3498db; color:white; border:none; padding:0 15px; border-radius:5px; cursor:pointer;">➕</button>
      </div>
      <div id="weekGoalsList"></div>
      <button id="aiBreakdownBtn" class="ai-btn">✨ פירוק יעדים למשימות יומיות (AI)</button>
    </section>

    <div id="aiResultArea" class="ai-breakdown-area">
      <h4 style="margin:0 0 10px 0;">🤖 הצעת ה-AI לפירוק חכם:</h4>
      <div id="aiSuggestions"></div>
    </div>

    <button onclick="window.location.href='dashboard.html'" style="width:100%; margin-top:20px; padding:12px; background:#34495e; color:white; border:none; border-radius:8px; cursor:pointer;">🏠 חזרה לדשבורד</button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;
    let currentWeekStart = new Date();
    currentWeekStart.setDate(currentWeekStart.getDate() - currentWeekStart.getDay());
    currentWeekStart.setHours(0,0,0,0);

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else { userId = user.uid; loadWeekData(); }
    });

    async function loadWeekData() {
      const weekId = currentWeekStart.toISOString().split('T')[0];
      const snapshot = await db.collection("users").doc(userId).collection("weekly_goals").where("weekId", "==", weekId).get();
      const list = document.getElementById("weekGoalsList");
      list.innerHTML = "";
      let total = 0, done = 0;
      snapshot.forEach(doc => {
        total++;
        const data = doc.data();
        if (data.completed) done++;
        const div = document.createElement("div");
        div.className = "goal-item";
        div.innerHTML = `<input type="checkbox" ${data.completed ? 'checked' : ''} onchange="toggleGoal('${doc.id}', ${data.completed})"> <span class="goal-text ${data.completed ? 'goal-done' : ''}">${data.text}</span> <span onclick="deleteGoal('${doc.id}')" style="cursor:pointer;">🗑️</span>`;
        list.appendChild(div);
      });
      const percent = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById("totalGoals").textContent = total;
      document.getElementById("completedGoals").textContent = done;
      const circle = document.getElementById("weekProgressCircle");
      circle.textContent = percent + "%";
      circle.className = `task-progress-circle ${percent === 100 ? 'task-circle-done' : 'task-circle-low'}`;
      const endOfWeek = new Date(currentWeekStart); endOfWeek.setDate(endOfWeek.getDate() + 6);
      document.getElementById("weekDatesDisplay").textContent = `${currentWeekStart.getDate()}/${currentWeekStart.getMonth()+1} - ${endOfWeek.getDate()}/${endOfWeek.getMonth()+1}`;
    }

    async function addWeekGoal() {
      const val = document.getElementById("weekGoalInput").value.trim();
      if (!val) return;
      await db.collection("users").doc(userId).collection("weekly_goals").add({
        weekId: currentWeekStart.toISOString().split('T')[0], text: val, completed: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById("weekGoalInput").value = ""; loadWeekData();
    }

    async function toggleGoal(id, status) { await db.collection("users").doc(userId).collection("weekly_goals").doc(id).update({ completed: !status }); loadWeekData(); }
    async function deleteGoal(id) { if (confirm("למחוק?")) { await db.collection("users").doc(userId).collection("weekly_goals").doc(id).delete(); loadWeekData(); } }
    function changeWeek(dir) { currentWeekStart.setDate(currentWeekStart.getDate() + (dir * 7)); loadWeekData(); document.getElementById("aiResultArea").style.display = "none"; }

    // --- החלק המתוקן ל-AI ---
    document.getElementById("aiBreakdownBtn").onclick = async function() {
      const goals = Array.from(document.querySelectorAll(".goal-text")).map(el => el.textContent);
      if (goals.length === 0) return alert("אנא הוסף יעדים קודם");

      this.disabled = true;
      this.textContent = "מפרק למשימות... ⏳";

      try {
        const config = await db.collection("system_config").doc("gemini_settings").get();
        const apiKey = config.data().apiKey;

        // שינוי URL למבנה של מודל יציב יותר
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const promptText = `Return a JSON array of daily tasks for these goals: ${goals.join(", ")}. 
        Structure: [{"dayOffset": 0, "task": "task name", "explanation": "why"}]. 
        dayOffset 0-6. Hebrew language only for task and explanation. No markdown.`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await response.json();
        
        // בדיקת שגיאה ספציפית מגוגל
        if (data.error) {
            throw new Error(data.error.message || "Unknown API Error");
        }

        const rawText = data.candidates[0].content.parts[0].text;
        // ניקוי JSON אגרסיבי
        const cleanJson = rawText.replace(/```json|```/g, "").trim();
        const suggestions = JSON.parse(cleanJson);

        const container = document.getElementById("aiSuggestions");
        container.innerHTML = "";
        suggestions.forEach(item => {
          const d = new Date();
          d.setDate(d.getDate() + (item.dayOffset || 0));
          const dateStr = d.toISOString().split('T')[0];
          const displayDate = d.toLocaleDateString('he-IL', {weekday: 'short', day: 'numeric'});

          const div = document.createElement("div");
          div.className = "suggested-task-item";
          div.innerHTML = `
            <div style="flex:1"><strong>${item.task}</strong><br><small>${displayDate} | ${item.explanation}</small></div>
            <button class="add-task-btn" onclick="addToDaily('${dateStr}', '${item.task.replace(/'/g, "\\'")}', this)">➕</button>
          `;
          container.appendChild(div);
        });

        document.getElementById("aiResultArea").style.display = "block";

      } catch (e) {
        console.error("AI Error:", e);
        alert("שגיאה מה-AI: " + e.message);
      } finally {
        this.disabled = false;
        this.textContent = "✨ פירוק יעדים למשימות יומיות (AI)";
      }
    };

    async function addToDaily(dateId, task, btn) {
      await db.collection("users").doc(userId).collection("daily").doc(dateId).collection("tempHabits").add({
        text: task, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      btn.textContent = "✅"; btn.disabled = true; btn.style.background = "#bdc3c7";
    }
  </script>
</body>
</html>
