<!DOCTYPE html>
<html lang="he" dir="rtl" id="mainHtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">תנאי שימוש מחייבים - אפליקציית הרגלים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .terms-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      line-height: 1.8;
      color: #1a1a1a;
      text-align: justify;
    }
    h1 { color: #c0392b; text-align: center; border-bottom: 3px solid #f1f1f1; padding-bottom: 15px; font-size: 1.8em; }
    h2 { color: #2c3e50; font-size: 1.1em; margin-top: 25px; border-inline-start: 4px solid #c0392b; padding-inline-start: 10px; }
    p, li { font-size: 0.9em; margin-bottom: 10px; }
    
    .back-link-container {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .login-link {
      color: #7f8c8d;
      text-decoration: none;
      font-size: 0.95em;
      padding: 8px 16px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    .login-link:hover {
      background-color: #f0f0f0;
      color: #333;
    }
    .urgent-note {
      background-color: #fdf2f2;
      padding: 15px;
      border-inline-start: 5px solid #c0392b;
      font-weight: bold;
      margin-bottom: 20px;
    }

    /* התאמת כיווניות לשפות LTR */
    html[dir="ltr"] h2, html[dir="ltr"] .urgent-note {
      border-right: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="terms-container" id="termsContent">
      </div>
  </div>

  <script>

      const isEn = !navigator.language.startsWith('he');
      const htmlEl = document.getElementById("mainHtml");
      const contentDiv = document.getElementById("termsContent");

        htmlEl.lang = "en";
        document.title = "Terms of Use - Habit App";

          </section>

          <div class="back-link-container">
            <a href="index.html" class="login-link">Back to Login</a>
          </div>
        `;
      } else {
        // תוכן עברית (מה ששלחת)
        contentDiv.innerHTML = `
          <h1>תנאי שימוש ותקנון משפטי מחייב</h1>

          </section>

            <h2>4. הגנה משפטית ותביעות</h2>
            <p>כל הפרה של תנאי השימוש לעיל תחשוף את המשתמש לתביעות משפטיות, לרבות תביעות נזיקין ופיצויים ללא הוכחת נזק, ככל שהחוק מאפשר זאת. הנהלת האתר שומרת לעצמה את הזכות לחסום משתמשים ולמסור את פרטיו לרשויות החוק במקרה של חשד לשימוש לרעה.</p>

  </script>
</body>
</html>
