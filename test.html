<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת נתוני היום - Debug</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #f4f7f6; padding: 20px; }
    .debug-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .task-item { border-bottom: 1px solid #eee; padding: 15px; margin-bottom: 10px; background: #fafafa; border-radius: 8px; }
    .task-header { font-weight: bold; font-size: 1.1em; color: #2c3e50; margin-bottom: 10px; display: block; }
    .field-info { display: inline-block; background: #e9ecef; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.9em; margin: 4px; }
    .status-v { color: #2ecc71; font-weight: bold; }
    .status-x { color: #e74c3c; font-weight: bold; }
    .raw-json { background: #273e47; color: #f1f1f1; padding: 15px; border-radius: 8px; font-size: 13px; direction: ltr; text-align: left; overflow-x: auto; }
    .btn-test { background-color: #2ecc71; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; }
  </style>
</head>
<body>
  <div class="app">
    <h1>🔍 בודק משימות של היום (Debug)</h1>
    <p>דף זה מציג את המבנה המדויק של המשימות הזמניות (tempHabits) מה-Database.</p>

    <button id="runTestBtn" class="btn-test">🚀 בדוק משימות של היום</button>

    <div id="loadingStatus" style="display:none; text-align: center; margin: 20px;">שולף נתונים...</div>

    <div id="debugResult" style="display:none; margin-top: 20px;">
      <section class="debug-card">
        <h3>📅 תאריך נבדק: <span id="currentDateId"></span></h3>
        <div id="tasksList"></div>
      </section>

      <section class="debug-card">
        <h3>📄 JSON גולמי של המשימות:</h3>
        <pre id="rawJson" class="raw-json"></pre>
      </section>
    </div>

    <div class="actions" style="margin-top: 20px;">
      <button onclick="window.location.href='dashboard.html'" style="width: 100%; background-color: #34495e; color: white;">🏠 חזרה לדשבורד</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;

    auth.onAuthStateChanged(user => {
      if (!user) {
        alert("נא להתחבר!");
        window.location.href = "index.html";
      } else {
        userId = user.uid;
      }
    });

    async function checkTodayTasks() {
      const btn = document.getElementById("runTestBtn");
      const loader = document.getElementById("loadingStatus");
      const resultDiv = document.getElementById("debugResult");
      const tasksList = document.getElementById("tasksList");
      
      btn.disabled = true;
      loader.style.display = "block";
      resultDiv.style.display = "none";
      tasksList.innerHTML = "";

      try {
        const now = new Date();
        const dateId = now.toISOString().split('T')[0];
        document.getElementById("currentDateId").textContent = dateId;

        // שליפת משימות מהנתיב המדויק של האנליטיקה
        const tempSnap = await db.collection("users").doc(userId).collection("daily").doc(dateId).collection("tempHabits").get();
        
        const allTasksData = [];

        if (tempSnap.empty) {
          tasksList.innerHTML = "<p>לא נמצאו משימות זמניות להיום ב-Database.</p>";
        } else {
          tempSnap.forEach(doc => {
            const data = doc.data();
            allTasksData.push({ id: doc.id, ...data });

            // יצירת תצוגה לכל משימה
            const taskDiv = document.createElement("div");
            taskDiv.className = "task-item";
            
            let fieldsHtml = "";
            for (const [key, value] of Object.entries(data)) {
              const valDisplay = typeof value === 'boolean' 
                ? `<span class="${value ? 'status-v' : 'status-x'}">${value}</span>` 
                : value;
              fieldsHtml += `<div class="field-info"><strong>${key}:</strong> ${valDisplay}</div>`;
            }

            taskDiv.innerHTML = `
              <span class="task-header">משימה: ${data.text || 'ללא שם'}</span>
              <div>${fieldsHtml}</div>
              <p style="margin-top:10px; font-size:0.9em;">
                <strong>האם הקוד מזהה כבוצע?</strong> 
                ${(data.done === true || data.completed === true) ? '<span class="status-v">כן ✅</span>' : '<span class="status-x">לא ❌</span>'}
              </p>
            `;
            tasksList.appendChild(taskDiv);
          });
        }

        document.getElementById("rawJson").textContent = JSON.stringify(allTasksData, null, 2);
        resultDiv.style.display = "block";

      } catch (err) {
        alert("שגיאה: " + err.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }

    document.getElementById("runTestBtn").addEventListener("click", checkTodayTasks);
  </script>
</body>
</html>
