<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת הצלבת נתונים - Debug</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #f4f7f6; padding: 20px; font-family: sans-serif; }
    .debug-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .task-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    .status-v { color: #2ecc71; font-weight: bold; background: #eafff2; padding: 2px 8px; border-radius: 4px; }
    .status-x { color: #e74c3c; font-weight: bold; background: #fff2f2; padding: 2px 8px; border-radius: 4px; }
    .raw-json { background: #273e47; color: #f1f1f1; padding: 15px; border-radius: 8px; font-size: 13px; direction: ltr; text-align: left; overflow-x: auto; }
    .btn-test { background-color: #3498db; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1em; }
    h3 { border-bottom: 2px solid #3498db; padding-bottom: 5px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>🔍 בודק הצלבת נתונים 1.1(V-Check)</h1>
    <p>דף זה בודק האם המשימות מ-tempHabits מסומנות כבוצעו בתוך קולקציית stats (בדיוק כמו בדשבורד).</p>

    <button id="runTestBtn" class="btn-test">🚀 בדוק סנכרון להיום</button>

    <div id="loadingStatus" style="display:none; text-align: center; margin: 20px;">מבצע הצלבת נתונים...</div>

    <div id="debugResult" style="display:none; margin-top: 20px;">
      <section class="debug-card">
        <h3>📅 תאריך נבדק: <span id="currentDateId"></span></h3>
        
        <div id="resultsContent">
          <h4>משימות זמניות (tempHabits) והסטטוס שלהן ב-Stats:</h4>
          <div id="tasksList"></div>
        </div>
      </section>

      <section class="debug-card">
        <h3>📄 מה ה-AI יראה (JSON הגולמי):</h3>
        <pre id="rawJson" class="raw-json"></pre>
      </section>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;

    auth.onAuthStateChanged(user => {
      if (!user) {
        alert("נא להתחבר!");
        window.location.href = "index.html";
      } else {
        userId = user.uid;
      }
    });

    async function checkSync() {
      const btn = document.getElementById("runTestBtn");
      const loader = document.getElementById("loadingStatus");
      const resultDiv = document.getElementById("debugResult");
      const tasksList = document.getElementById("tasksList");
      
      btn.disabled = true;
      loader.style.display = "block";
      resultDiv.style.display = "none";
      tasksList.innerHTML = "";

      try {
        const now = new Date();
        const dateId = now.toISOString().split('T')[0];
        document.getElementById("currentDateId").textContent = dateId;

        // 1. שליפת הסטטיסטיקה של היום (שם שמור ה-V)
        const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(dateId).get();
        const dailyStats = statsDoc.exists ? statsDoc.data() : {};

        // 2. שליפת רשימת המשימות הזמניות
        const tempSnap = await db.collection("users").doc(userId).collection("daily").doc(dateId).collection("tempHabits").get();
        
        const outputForAi = [];

        if (tempSnap.empty) {
          tasksList.innerHTML = "<p>לא נמצאו משימות זמניות להיום.</p>";
        } else {
          tempSnap.forEach(doc => {
            const taskText = doc.data().text;
            // ההצלבה הקריטית: האם הטקסט של המשימה מופיע כ-true ב-stats
            const isDone = dailyStats[taskText] === true;

            outputForAi.push({
              text: taskText,
              statusInStats: isDone ? "בוצע ✅" : "לא בוצע ❌"
            });

            const row = document.createElement("div");
            row.className = "task-row";
            row.innerHTML = `
              <span>${taskText}</span>
              <span class="${isDone ? 'status-v' : 'status-x'}">${isDone ? 'בוצע (V)' : 'לא בוצע'}</span>
            `;
            tasksList.appendChild(row);
          });
        }

        // הצגת ה-JSON שה-AI יקבל בסוף
        document.getElementById("rawJson").textContent = JSON.stringify({
          date: dateId,
          dataSentToAi: outputForAi,
          fullStatsObject: dailyStats // מציג גם את כל האובייקט ליתר ביטחון
        }, null, 2);

        resultDiv.style.display = "block";

      } catch (err) {
        console.error(err);
        alert("שגיאה: " + err.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }

    document.getElementById("runTestBtn").addEventListener("click", checkSync);
  </script>
</body>
</html>
