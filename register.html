<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker – רישום משתמש</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .register-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .register-card {
      padding: 30px !important;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8em;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .action-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s;
      margin-top: 10px;
    }
    .action-btn:hover {
      background-color: #27ae60;
    }
    
    /* הכפתור עם הכיתוב הכהה והרקע העדין */
    .back-btn {
      background: none;
      border: none;
      color: #34495e; /* כיתוב כהה */
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      margin: 15px auto 0 auto;
      font-size: 0.9em;
      font-weight: bold;
      transition: all 0.3s ease;
      display: inline-block;
      width: fit-content;
    }

    .back-btn:hover {
      background-color: #f5f6f7; /* רקע אפור בהיר ועדין מאוד */
      color: #000; /* הכיתוב מתחזק לשחור */
    }

    #regMessage {
      min-height: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>📝 יצירת חשבון חדש</h1>
    <div class="card login-card register-card">
      <p style="text-align: center; color: #666; margin-bottom: 20px;">הצטרף אלינו והתחל לעקוב אחר ההרגלים שלך</p>
      <div class="register-container">
        <input type="email" id="regEmail" placeholder="כתובת אימייל" />
        <input type="password" id="regPassword" placeholder="בחר סיסמה (6+ תווים)" />
        <input type="password" id="confirmPassword" placeholder="הקלד שוב את הסיסמה" />
        <button id="executeRegisterBtn" class="action-btn">צור חשבון והתחל</button>
        <p id="regMessage" style="color:red;"></p>
        <div style="text-align: center;">
          <button class="back-btn" onclick="window.location.href='index.html'">כבר יש לי חשבון? חזרה להתחברות</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="register.js"></script>
</body>
</html>
