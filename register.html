<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker – הרשמה</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app login-app">
    <h1>📝 הרשמה למערכת</h1>
    <div class="card login-card">
      <input type="email" id="regEmail" placeholder="כתובת אימייל" />
      <input type="password" id="regPassword" placeholder="בחר סיסמה" />
      <input type="password" id="confirmPassword" placeholder="הזן סיסמה שוב" />

      <button id="executeRegisterBtn">צור חשבון</button>
      <button class="info-toggle-btn" onclick="window.location.href='index.html'">חזרה להתחברות</button>

      <p id="regMessage" style="color:red; margin-top:10px;"></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="register.js"></script>
</body>
</html>
