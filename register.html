<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Habit Tracker – רישום משתמש</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .register-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .register-card {
      padding: 30px !important;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8em;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      text-align: start;
    }
    .action-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s;
      margin-top: 10px;
      width: 100%;
    }
    .action-btn:hover {
      background-color: #27ae60;
    }
    
    .back-btn {
      background: none !important;
      border: none !important;
      color: #34495e !important;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      margin: 15px auto 0 auto;
      font-size: 0.9em;
      font-weight: normal !important;
      transition: all 0.3s ease;
      display: inline-block;
      width: fit-content !important;
      text-decoration: none;
    }

    .back-btn:hover {
      background-color: #f5f6f7 !important;
      color: #000 !important;
    }

    #regMessage {
      min-height: 20px;
      text-align: center;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1 id="ui-reg-title">📝 יצירת חשבון חדש</h1>
    <div class="card login-card register-card">
      <p id="ui-reg-desc" style="text-align: center; color: #666; margin-bottom: 20px;">הצטרף אלינו והתחל לעקוב אחר ההרגלים שלך</p>
      <div class="register-container">
        <input type="email" id="regEmail" placeholder="כתובת אימייל" />
        <input type="password" id="regPassword" placeholder="בחר סיסמה (6+ תווים)" />
        <input type="password" id="confirmPassword" placeholder="הקלד שוב את הסיסמה" />
        <button id="executeRegisterBtn" class="action-btn">צור חשבון והתחל</button>
        <p id="regMessage" style="color:red;"></p>
        <div style="text-align: center;">
          <button class="back-btn" id="ui-back-login" onclick="window.location.href='index.html'">כבר יש לי חשבון? חזרה להתחברות</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  
  <script src="firebase.js"></script>
  
  <script>
    // תרגום ממשק הרישום
    const regUiTranslations = {
      he: {
        dir: "rtl",
        title: "📝 יצירת חשבון חדש",
        desc: "הצטרף אלינו והתחל לעקוב אחר ההרגלים שלך",
        email: "כתובת אימייל",
        pass: "בחר סיסמה (6+ תווים)",
        confirm: "הקלד שוב את הסיסמה",
        btn: "צור חשבון והתחל",
        back: "כבר יש לי חשבון? חזרה להתחברות"
      },
      en: {
        dir: "ltr",
        title: "📝 Create New Account",
        desc: "Join us and start tracking your habits",
        email: "Email Address",
        pass: "Choose Password (6+ chars)",
        confirm: "Confirm Password",
        btn: "Create Account & Start",
        back: "Already have an account? Back to Login"
      }
    };

    const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
    const lang = regUiTranslations[userLang];

    document.documentElement.lang = userLang;
    document.documentElement.dir = lang.dir;
    document.getElementById('ui-reg-title').innerText = lang.title;
    document.getElementById('ui-reg-desc').innerText = lang.desc;
    document.getElementById('regEmail').placeholder = lang.email;
    document.getElementById('regPassword').placeholder = lang.pass;
    document.getElementById('confirmPassword').placeholder = lang.confirm;
    document.getElementById('executeRegisterBtn').innerText = lang.btn;
    document.getElementById('ui-back-login').innerText = lang.back;
  </script>

  <script src="register.js"></script>
</body>
</html>
