<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ניהול תוכן - Habit Tracker</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 20px; direction: rtl; }
        .admin-container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #2c3e50; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        textarea { height: 200px; font-family: monospace; }
        .config-bar { background: #ebf5fb; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #d6eaf8; }
        .btn-submit { background: #27ae60; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-submit:hover { background: #219150; }
        #status { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; white-space: pre-line; font-weight: bold; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>ניהול תוכן - הוספת מאמר לבלוג 🚀</h1>

    <div class="config-bar">
        <label>GitHub Personal Token:</label>
        <input type="password" id="gh-token" placeholder="הדבק כאן את הטוקן ghp_...">
    </div>

    <div class="section">
        <div>
            <label>קטגוריה (עברית):</label>
            <input type="text" id="cat-he" placeholder="למשל: פרודוקטיביות, תזונה...">
        </div>
        <div>
            <label>Category (English):</label>
            <input type="text" id="cat-en" placeholder="e.g: Productivity, Health...">
        </div>
    </div>

    <div class="section">
        <div>
            <label>כותרת המאמר (עברית):</label>
            <input type="text" id="title-he">
        </div>
        <div>
            <label>Article Title (English):</label>
            <input type="text" id="title-en">
        </div>
    </div>

    <div class="section">
        <div>
            <label>תקציר קצר (עברית):</label>
            <input type="text" id="excerpt-he">
        </div>
        <div>
            <label>Short Excerpt (English):</label>
            <input type="text" id="excerpt-en">
        </div>
    </div>

    <div class="section">
        <div>
            <label>תוכן ב-HTML (עברית):</label>
            <textarea id="body-he"></textarea>
        </div>
        <div>
            <label>Article Body (HTML - English):</label>
            <textarea id="body-en"></textarea>
        </div>
    </div>

    <button class="btn-submit" onclick="startPublishing()">פרסם מאמר עכשיו ✨</button>
    <div id="status"></div>
</div>

<script>
    const CONFIG = {
        repo: 'ramirotem01/habit-tracker',
        branch: 'main',
        blogFilePath: 'blog.html'
    };

    function escapeJS(str) {
        if (!str) return "";
        return str.replace(/"/g, '\\"').replace(/\n/g, ' ');
    }

    async function startPublishing() {
        const status = document.getElementById('status');
        const token = document.getElementById('gh-token').value;
        const titleEn = document.getElementById('title-en').value;
        
        if(!token) return alert("נא להזין את ה-GitHub Token");
        if(!titleEn) return alert("חובה כותרת באנגלית עבור שם הקובץ");

        status.style.display = "block";
        status.style.backgroundColor = "#fff3cd";
        status.innerText = "1. מייצר דף מאמר חדש...";

        const fileName = titleEn.toLowerCase().trim().replace(/\s+/g, '-').replace(/[^\w-]/g, '') + ".html";
        const articlePath = `articles/${fileName}`;

        try {
            const articleHtml = generateArticleTemplate();
            await uploadToGithub(articlePath, `Add article: ${titleEn}`, articleHtml, token);
            status.innerText += "\n✅ קובץ המאמר נוצר.";

            status.innerText += "\n2. מעדכן את רשימת המאמרים ב-blog.html...";
            await updateBlogMainPage(token, fileName);
            
            status.style.backgroundColor = "#d4edda";
            status.innerText += "\n✅ המאמר פורסם בהצלחה ונוסף לרשימה בבלוג!";
        } catch (e) {
            status.style.backgroundColor = "#f8d7da";
            status.innerText += "\n❌ שגיאה: " + e.message;
        }
    }

    async function updateBlogMainPage(token, fileName) {
        const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${CONFIG.blogFilePath}`);
        const data = await res.json();
        let content = decodeURIComponent(escape(atob(data.content)));

        const dateHe = new Date().toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'});
        const dateEn = new Date().toLocaleDateString('en-US', {day:'numeric', month:'long', year:'numeric'});

        const catHe = escapeJS(document.getElementById('cat-he').value) || "מאמר";
        const catEn = escapeJS(document.getElementById('cat-en').value) || "Article";
        const titleHe = escapeJS(document.getElementById('title-he').value);
        const excerptHe = escapeJS(document.getElementById('excerpt-he').value);
        const titleEn = escapeJS(document.getElementById('title-en').value);
        const excerptEn = escapeJS(document.getElementById('excerpt-en').value);

        const entryHe = `          {
            "cat": "${catHe}",
            "title": "${titleHe}",
            "excerpt": "${excerptHe}",
            "date": "${dateHe}",
            "link": "articles/${fileName}"
          },`;

        const entryEn = `          {
            "cat": "${catEn}",
            "title": "${titleEn}",
            "excerpt": "${excerptEn}",
            "date": "${dateEn}",
            "link": "articles/${fileName}"
          },`;

        // הזרקה חכמה לפי שפה
        content = content.replace(/(he:\s*{[\s\S]*?articles:\s*\[)/, `$1\n${entryHe}`);
        
        const parts = content.split('en:');
        if (parts.length > 1) {
            parts[1] = parts[1].replace(/(articles:\s*\[)/, `$1\n${entryEn}`);
            content = parts.join('en:');
        }

        await uploadToGithub(CONFIG.blogFilePath, "Auto-update blog articles list", content, token, data.sha);
    }

    async function uploadToGithub(path, message, content, token, sha = null) {
        const body = {
            message: message,
            content: btoa(unescape(encodeURIComponent(content))),
            branch: CONFIG.branch
        };
        if (sha) body.sha = sha;

        const res = await fetch(`https://api.github.com/repos/${CONFIG.repo}/contents/${path}`, {
            method: 'PUT',
            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error((await res.json()).message);
    }

 function generateArticleTemplate() {
    const tHe = { title: document.getElementById('title-he').value, body: document.getElementById('body-he').value };
    const tEn = { title: document.getElementById('title-en').value, body: document.getElementById('body-en').value };
    const dateHe = new Date().toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'});
    const dateEn = new Date().toLocaleDateString('en-US', {day:'numeric', month:'long', year:'numeric'});

    return `<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>\${tHe.title}</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root { --primary-color: #3498db; --secondary-color: #2c3e50; --text-color: #333; }
        body { background-color: #f9f9f9; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; line-height: 1.8; color: var(--text-color); }
        .article-page-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; background: white; box-shadow: 0 0 20px rgba(0,0,0,0.05); min-height: 100vh; }
        .back-to-blog { display: inline-block; margin-bottom: 30px; color: var(--primary-color); text-decoration: none; font-weight: bold; }
        .article-header { border-bottom: 2px solid #f0f0f0; padding-bottom: 20px; margin-bottom: 30px; }
        .article-header h1 { font-size: 2.2em; color: var(--secondary-color); margin: 10px 0; }
        .meta-info { color: #95a5a6; font-size: 0.9em; display: flex; gap: 15px; }
        .article-body { font-size: 1.15em; }
        .footer-cta { margin-top: 60px; padding: 30px; background: #f8f9fa; border-radius: 10px; text-align: center; }
        .btn-main { display: inline-block; background: var(--primary-color); color: white; padding: 12px 25px; border-radius: 5px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="article-page-container">
        <a href="../blog.html" class="back-to-blog" id="back-link"></a>
        <article>
            <header class="article-header">
                <div class="meta-info">
                    <span id="meta-date"></span>
                    <span id="meta-read-time"></span>
                </div>
                <h1 id="main-h1"></h1>
            </header>
            <div class="article-body" id="article-body-content"></div>
            <div class="footer-cta">
                <h3 id="footer-h3"></h3>
                <a href="../index.html" class="btn-main" id="footer-btn"></a>
            </div>
        </article>
    </div>
    <script>
        const translations = {
            he: { 
                back: "← חזרה לבלוג", 
                date: "${dateHe}", 
                readTime: "⏱️ 5 דקות קריאה",
                h1: \`${tHe.title}\`, 
                body: \`${tHe.body}\`, 
                footerH3: "מוכנים להתחיל?", 
                footerBtn: "חזרה לאפליקציה" 
            },
            en: { 
                back: "Back to Blog →", 
                date: "${dateEn}", 
                readTime: "⏱️ 5 min read",
                h1: \`${tEn.title}\`, 
                body: \`${tEn.body}\`, 
                footerH3: "Ready to Start?", 
                footerBtn: "Back to App" 
            }
        };
        const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
        const t = translations[userLang];
        document.documentElement.lang = userLang;
        document.documentElement.dir = (userLang === 'he') ? 'rtl' : 'ltr';
        
        document.getElementById('back-link').innerText = t.back;
        document.getElementById('meta-date').innerText = t.date;
        document.getElementById('meta-read-time').innerText = t.readTime;
        document.getElementById('main-h1').innerText = t.h1;
        document.getElementById('article-body-content').innerHTML = t.body;
        document.getElementById('footer-h3').innerText = t.footerH3;
        document.getElementById('footer-btn').innerText = t.footerBtn;
    <\/script>
</body>
</html>`;
}
</script>
</body>
</html>
