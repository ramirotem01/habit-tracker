<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">הבלוג של Habit Tracker - טיפים להצלחה</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2c3e50;
      --text-muted: #7f8c8d;
      --bg-light: #f4f7f6;
    }

    body {
      background-color: var(--bg-light);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      text-align: inherit;
    }

    .blog-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 40px 0;
    }

    header h1 {
      color: var(--secondary-color);
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1em;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }

    .articles-list {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .article-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .article-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }

    .article-content {
      padding: 25px;
    }

    .article-category {
      color: var(--primary-color);
      font-size: 0.85em;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    .article-card h2 {
      margin: 0 0 12px 0;
      color: var(--secondary-color);
      font-size: 1.6em;
    }

    .article-excerpt {
      color: #555;
      margin-bottom: 20px;
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9em;
      color: var(--text-muted);
      border-top: 1px solid #eee;
      padding-top: 15px;
    }

    .read-more {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }

    .newsletter {
      background: var(--secondary-color);
      color: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      margin-top: 50px;
    }

    .newsletter input {
      padding: 10px;
      border-radius: 5px;
      border: none;
      width: 60%;
      margin: 10px 0;
    }

    .newsletter button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="blog-container">
    <a href="index.html" class="back-link" id="back-link"></a>
    
    <header>
      <h1 id="header-title"></h1>
      <p id="header-subtitle"></p>
    </header>

    <div class="articles-list" id="articles-container">
      </div>

    <section class="newsletter">
      <h3 id="news-title"></h3>
      <p id="news-subtitle"></p>
      <input type="email" id="news-input">
      <br>
      <button id="news-btn"></button>
    </section>

    <footer style="text-align: center; margin-top: 40px; color: var(--text-muted); font-size: 0.9em;" id="blog-footer">
    </footer>
  </div>

    };

    const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
    const t = translations[userLang];

    document.documentElement.lang = userLang;
    document.documentElement.dir = (userLang === 'he') ? 'rtl' : 'ltr';

    // הזרקת טקסטים
    document.getElementById('page-title').innerText = t.title;
    document.getElementById('back-link').innerText = t.back;
    document.getElementById('header-title').innerText = t.headerTitle;
    document.getElementById('header-subtitle').innerText = t.headerSubtitle;
    document.getElementById('news-title').innerText = t.newsTitle;
    document.getElementById('news-subtitle').innerText = t.newsSubtitle;
    document.getElementById('news-input').placeholder = t.newsPlaceholder;
    document.getElementById('news-btn').innerText = t.newsBtn;
    document.getElementById('blog-footer').innerHTML = t.footer;

    // הזרקת מאמרים
    const container = document.getElementById('articles-container');
    t.articles.forEach(art => {
      container.innerHTML += `
        <article class="article-card">
          <div class="article-content">
            <span class="article-category">${art.cat}</span>
            <h2>${art.title}</h2>
            <p class="article-excerpt">${art.excerpt}</p>
            <div class="article-meta">
              <span>📅 ${art.date}</span>
              <a href="${art.link}" class="read-more">${t.readMore}</a>
            </div>
          </div>
        </article>
      `;
    });
  </script>
</body>
</html>
