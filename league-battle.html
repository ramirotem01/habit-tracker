<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS365 - League Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background: #f8fafc; }
        .leaderboard-card { transition: all 0.3s ease; }
        .user-row { transition: background 0.2s; }
        .user-row:hover { background: #f1f5f9; }
        .rank-1 { background: #fef3c7; border: 1px solid #fbbf24; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        
        /* LTR Fixes */
        html[dir="ltr"] .back-icon { transform: rotate(180deg); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="glass sticky top-0 z-50 border-b p-4">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <a href="league.html" class="text-slate-500 font-bold flex items-center gap-1 hover:text-slate-800 transition-colors">
                <svg id="back-icon" class="back-icon h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span id="ui-back">חזרה ללובי</span>
            </a>
            <div class="font-black text-xl italic tracking-tighter">PCS<span class="text-green-600">365</span></div>
            <button onclick="leaveLeague()" id="ui-leave-btn" class="text-xs font-black text-red-500 bg-red-50 px-3 py-1.5 rounded-full hover:bg-red-100 transition-all uppercase tracking-wider"></button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-4">
        <div id="habitStatusAlert" class="hidden mb-6 bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl">
            <p id="ui-habit-deleted-msg" class="text-amber-800 font-bold text-sm mb-3"></p>
            <button onclick="restoreHabitAndJoin()" id="ui-restore-btn" class="w-full bg-amber-500 text-white font-black py-3 rounded-xl shadow-lg hover:bg-amber-600 transition-all"></button>
        </div>

        <header class="mb-8 text-center pt-6">
            <h1 id="leagueName" class="text-4xl font-black text-slate-800 mb-2">---</h1>
            <p id="habitTask" class="text-slate-500 text-lg font-bold">🎯 ---</p>
        </header>

        <section class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                    <span id="ui-leaderboard-title">טבלת מובילים</span> 🏆
                </h2>
                <span id="memberCount" class="text-xs font-bold text-slate-400 bg-white px-3 py-1 rounded-full shadow-sm">0 משתתפים</span>
            </div>

            <div id="leaderboardList" class="divide-y divide-slate-50">
                </div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const leagueId = urlParams.get('id');
        let currentUser = null;

        const translations = {
            he: {
                dir: "rtl", back: "חזרה ללובי", leave: "צא מהליגה",
                leaderboard: "טבלת מובילים", members: "משתתפים",
                habitDeleted: "נראה שההרגל נמחק מהרשימה האישית שלך...",
                restoreBtn: "שחזר הרגל והצטרף לקרב",
                leaveConfirm: "בטוח שאתה רוצה לעזוב את הליגה?",
                scoreSuffix: "נק'", loading: "טוען..."
            },
            en: {
                dir: "ltr", back: "Back to Lobby", leave: "Leave League",
                leaderboard: "Leaderboard", members: "Participants",
                habitDeleted: "It seems the habit was deleted from your list...",
                restoreBtn: "Restore Habit & Join Battle",
                leaveConfirm: "Are you sure you want to leave this league?",
                scoreSuffix: "pts", loading: "Loading..."
            }
        };

        const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
        const t = translations[userLang];
        document.documentElement.lang = userLang;
        document.documentElement.dir = t.dir;

        // Apply UI translations
        document.getElementById('ui-back').innerText = t.back;
        document.getElementById('ui-leave-btn').innerText = t.leave;
        document.getElementById('ui-leaderboard-title').innerText = t.leaderboard;
        document.getElementById('ui-habit-deleted-msg').innerText = t.habitDeleted;
        document.getElementById('ui-restore-btn').innerText = t.restoreBtn;

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "index.html"; return; }
            currentUser = user;
            loadLeagueData();
            checkUserHabitStatus();
        });

        async function loadLeagueData() {
            if (!leagueId) return;
            db.collection("leagues").doc(leagueId).onSnapshot(doc => {
                if (!doc.exists) return;
                const data = doc.data();
                document.getElementById('leagueName').innerText = data.name;
                document.getElementById('habitTask').innerText = `🎯 ${data.habitTask}`;
                document.getElementById('memberCount').innerText = `${data.members?.length || 0} ${t.members}`;
                renderLeaderboard(data.members || []);
            });
        }

        function renderLeaderboard(members) {
            const list = document.getElementById('leaderboardList');
            // סדר יורד לפי נקודות
            const sorted = members.sort((a, b) => (b.score || 0) - (a.score || 0));
            
            list.innerHTML = sorted.map((m, index) => `
                <div class="user-row p-5 flex items-center justify-between ${index === 0 ? 'rank-1' : ''} ${m.uid === currentUser.uid ? 'border-r-4 border-green-500' : ''}">
                    <div class="flex items-center gap-4">
                        <span class="w-6 text-center font-black text-slate-400">${index + 1}</span>
                        <div class="w-10 h-10 bg-slate-200 rounded-full flex items-center justify-center font-bold text-slate-600 uppercase">
                            ${m.displayName?.charAt(0) || 'U'}
                        </div>
                        <div>
                            <div class="font-bold text-slate-800">${m.displayName || 'User'} ${m.uid === currentUser.uid ? '(You)' : ''}</div>
                            <div class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic">${index === 0 ? '👑 Legend' : 'Challenger'}</div>
                        </div>
                    </div>
                    <div class="text-left">
                        <div class="text-xl font-black text-slate-900">${m.score || 0}</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase">${t.scoreSuffix}</div>
                    </div>
                </div>
            `).join('');
        }

        async function checkUserHabitStatus() {
            if (!leagueId) return;
            // כאן בודקים אם למשתמש יש את ההרגל של הליגה ברשימה האישית שלו
            const leagueDoc = await db.collection("leagues").doc(leagueId).get();
            const taskName = leagueDoc.data().habitTask;
            
            const userHabits = await db.collection("users").doc(currentUser.uid).collection("habits")
                                 .where("text", "==", taskName).get();
            
            if (userHabits.empty) {
                document.getElementById('habitStatusAlert').classList.remove('hidden');
            } else {
                document.getElementById('habitStatusAlert').classList.add('hidden');
            }
        }

        async function restoreHabitAndJoin() {
            const leagueDoc = await db.collection("leagues").doc(leagueId).get();
            const taskName = leagueDoc.data().habitTask;

            await db.collection("users").doc(currentUser.uid).collection("habits").add({
                text: taskName,
                completed: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                streak: 0
            });
            
            location.reload();
        }

        async function leaveLeague() {
            if (!confirm(t.leaveConfirm)) return;
            const leagueRef = db.collection("leagues").doc(leagueId);
            const doc = await leagueRef.get();
            const members = doc.data().members || [];
            const updatedMembers = members.filter(m => m.uid !== currentUser.uid);
            
            await leagueRef.update({ members: updatedMembers });
            window.location.href = "league.html";
        }
    </script>
</body>
</html>
