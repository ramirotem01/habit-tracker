<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("PWA Ready"))
        .catch(err => console.log("PWA Error", err));
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker – התחברות</title>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* עיצוב כפתור המידע */
    .info-toggle-btn {
      background: none;
      border: 1px solid #3498db;
      color: #3498db;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      margin: 20px auto 10px auto;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      outline: none;
    }

    .info-toggle-btn:hover {
      background-color: #f0f0f0;
      transform: scale(1.05);
      border-color: #2980b9;
    }

    .app-info-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
      text-align: right;
      font-size: 0.9em;
      line-height: 1.6;
      color: #333;
    }

    .app-info-content.open {
      max-height: 1000px;
      margin-top: 15px;
      padding: 15px;
      border-top: 1px solid #eee;
    }

    .app-info-content ul {
      padding-right: 20px;
      list-style: none;
      margin: 10px 0;
    }
    
    .tagline {
      text-align: center;
      display: block;
      margin-top: 10px;
      color: #2c3e50;
    }

    /* עיצוב קונטיינר הקפצ'ה */
    #captcha-container {
      display: none; /* מוסתר כברירת מחדל */
      margin: 15px 0;
      transform: scale(0.9); /* התאמה קלה לגודל המובייל */
    }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>🔐 התחברות / רישום</h1>

    <div class="card login-card">
      <input type="email" id="email" placeholder="כתובת אימייל" />
      <input type="password" id="password" placeholder="סיסמה" />

      <div id="captcha-container">
        <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY_HERE"></div>
      </div>

      <button id="loginBtn">התחבר</button>
      <button id="registerBtn">רשום משתמש חדש</button>

      <p id="message" style="color:red; margin-top:10px;"></p>

      <button class="info-toggle-btn" id="infoBtn" onclick="toggleInfo()">
        <span>ℹ️</span>
        <span id="btnText">למידע על האפליקציה</span>
      </button>

      <div id="infoContent" class="app-info-content">
        <h3>עקביות קטנה. שינוי גדול.</h3>
        <p><strong>Habit Tracker</strong> אפליקציה חינמית שעוזרת לך להתקדם צעד־צעד, בלי עומס ובלי רעש.</p>
        <p><strong>מה עושים בה?</strong></p>
        <ul>
          <li>✔ מגדירים הרגלים אישיים</li>
          <li>✔ מסמנים ביצוע יומי בקליק</li>
          <li>✔ עוקבים אחרי ההתקדמות</li>
        </ul>
        <span class="tagline"><strong>כי שינוי גדול מתחיל בהרגל קטן.</strong></span>
      </div>
    </div>
  </div>

  <script>
    function toggleInfo() {
      const content = document.getElementById('infoContent');
      const btnText = document.getElementById('btnText');
      content.classList.toggle('open');
      btnText.innerText = content.classList.contains('open') ? 'סגור מידע' : 'למידע על האפליקציה';
    }

    // משתנה לספירת נסיונות
    let loginAttempts = 0;

    // פונקציית העזר שתשלב בתוך ה-login.js שלך (או כאן)
    function handleFailedLogin() {
      loginAttempts++;
      if (loginAttempts >= 5) {
        document.getElementById('captcha-container').style.display = 'block';
      }
    }

    function checkCaptcha() {
      if (loginAttempts >= 5) {
        const response = grecaptcha.getResponse();
        if (response.length === 0) {
          document.getElementById('message').innerText = "אנא אמת שאינך רובוט";
          return false;
        }
      }
      return true;
    }
  </script>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>
  <script src="login.js"></script>
</body>
</html>
