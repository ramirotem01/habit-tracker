<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker – התחברות</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    .info-toggle-btn { background: none; border: 1px solid #3498db; color: #3498db; padding: 8px 18px; border-radius: 20px; cursor: pointer; margin: 20px auto 10px auto; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease; }
    .app-info-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; text-align: right; font-size: 0.9em; line-height: 1.6; color: #333; }
    .app-info-content.open { max-height: 1000px; margin-top: 15px; padding: 15px; border-top: 1px solid #eee; }
    #captcha-container { display: none; margin: 15px 0; transform: scale(0.9); }
    .forgot-link { display: block; margin-top: 15px; color: #3498db; text-decoration: none; font-size: 0.9em; cursor: pointer; }
    .forgot-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>🔐 התחברות</h1>

    <div class="card login-card">
      <input type="email" id="email" placeholder="כתובת אימייל" />
      <input type="password" id="password" placeholder="סיסמה" />

      <div id="captcha-container">
        <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY_HERE"></div>
      </div>

      <button id="loginBtn">התחבר</button>
      <button id="goToRegister" onclick="window.location.href='register.html'">ליצירת משתמש חדש</button>

      <a class="forgot-link" id="forgotPasswordLink">שכחתי סיסמה...</a>

      <p id="message" style="color:red; margin-top:10px;"></p>

      <button class="info-toggle-btn" id="infoBtn" onclick="toggleInfo()">
        <span>ℹ️</span>
        <span id="btnText">למידע על האפליקציה</span>
      </button>

      <div id="infoContent" class="app-info-content">
        <h3>עקביות קטנה. שינוי גדול.</h3>
        <p><strong>Habit Tracker</strong> עוזרת לך להתקדם צעד־צעד.</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="login.js"></script>
  <script>
    function toggleInfo() {
      const content = document.getElementById('infoContent');
      const btnText = document.getElementById('btnText');
      content.classList.toggle('open');
      btnText.innerText = content.classList.contains('open') ? 'סגור מידע' : 'למידע על האפליקציה';
    }
  </script>
</body>
</html>
