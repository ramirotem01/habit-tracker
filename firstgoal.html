<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">הגדרת מטרה אישית - Habit Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ai-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .ai-card {
      padding: 30px !important;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8em;
      text-align: center;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      resize: none;
      font-size: 1.1em;
      outline: none;
      min-height: 120px;
    }
    textarea:focus {
      border-color: #2ecc71;
    }

    .action-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s;
      margin-top: 10px;
      width: 100%;
    }
    .action-btn:hover {
      background-color: #27ae60;
    }
    .action-btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .back-btn {
      background: none;
      border: none;
      color: #34495e;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      margin: 15px auto 0 auto;
      font-size: 0.9em;
      font-weight: normal;
      transition: all 0.3s ease;
      display: inline-block;
      width: fit-content;
      text-decoration: none;
    }
    .back-btn:hover {
      background-color: #f5f6f7;
      color: #000;
    }

    #statusMsg {
        text-align: center;
        font-size: 0.9em;
        margin-top: 10px;
        color: #27ae60;
        display: none;
    }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1 id="ui-title">🎯 המטרה הגדולה שלי</h1>
    <div class="card login-card ai-card">
      <p id="ui-description" style="text-align: center; color: #666; margin-bottom: 20px;">
        כאן תוכל להגדיר או לעדכן את היעד המרכזי שלך. המטרה הזו תעזור ל-AI לנתח את הביצועים השבועיים שלך בצורה מדויקת יותר.
      </p>
      
      <div class="ai-container">
        <textarea id="goalInput" rows="3"></textarea>
        
        <button id="saveGoalBtn" class="action-btn"></button>
        
        <div id="statusMsg"></div>

        <div style="text-align: center;">
          <button id="skipBtn" class="back-btn" onclick="window.location.href='dashboard.html'"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    const translations = {
      he: {
        pageTitle: "הגדרת מטרה אישית - Habit Tracker",
        title: "🎯 המטרה הגדולה שלי",
        desc: "כאן תוכל להגדיר או לעדכן את היעד המרכזי שלך. המטרה הזו תעזור ל-AI לנתח את הביצועים השבועיים שלך בצורה מדויקת יותר.",
        placeholder: "למשל: לרדת 5 קילו ב-3 חודשים הקרובים...",
        saveBtn: "💾 שמור עדכון מטרה",
        saving: "שומר...",
        skipBtn: "דלג",
        success: "המטרה עודכנה בהצלחה! ✨",
        emptyError: "בבקשה רשום מטרה לפני השמירה",
        generalError: "הייתה בעיה בשמירת המטרה."
      },
      en: {
        pageTitle: "Set Personal Goal - Habit Tracker",
        title: "🎯 My Big Goal",
        desc: "Define or update your primary objective here. This goal helps the AI analyze your weekly performance more accurately.",
        placeholder: "e.g., Lose 5kg in the next 3 months...",
        saveBtn: "💾 Save Goal Update",
        saving: "Saving...",
        skipBtn: "Skip",
        success: "Goal updated successfully! ✨",
        emptyError: "Please write a goal before saving",
        generalError: "There was a problem saving your goal."
      }
    };

    const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
    const t = translations[userLang];

    // החלת שפה
    document.documentElement.lang = userLang;
    document.documentElement.dir = (userLang === 'he') ? 'rtl' : 'ltr';
    document.getElementById('page-title').innerText = t.pageTitle;
    document.getElementById('ui-title').innerText = t.title;
    document.getElementById('ui-description').innerText = t.desc;
    document.getElementById('goalInput').placeholder = t.placeholder;
    document.getElementById('saveGoalBtn').innerText = t.saveBtn;
    document.getElementById('skipBtn').innerText = t.skipBtn;
    document.getElementById('statusMsg').innerText = t.success;

    let userId = null;
    const goalInput = document.getElementById("goalInput");
    const saveBtn = document.getElementById("saveGoalBtn");
    const statusMsg = document.getElementById("statusMsg");

    auth.onAuthStateChanged(user => { 
      if (!user) {
        window.location.href = "index.html"; 
      } else {
        userId = user.uid;
        loadCurrentGoal();
      }
    });

    async function loadCurrentGoal() {
      try {
        const goalSnap = await db.collection("users").doc(userId)
                                 .collection("goals")
                                 .orderBy("createdAt", "desc")
                                 .limit(1)
                                 .get();
        
        if (!goalSnap.empty) {
          goalInput.value = goalSnap.docs[0].data().text;
        }
      } catch (e) {
        console.error("Error loading goal:", e);
      }
    }

    saveBtn.addEventListener("click", async () => {
      const goalText = goalInput.value.trim();
      if (!goalText) {
          alert(t.emptyError);
          return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = t.saving;

      try {
        await db.collection("users").doc(userId).collection("goals").add({
          text: goalText,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        statusMsg.style.display = "block";
        setTimeout(() => {
            statusMsg.style.display = "none";
        }, 3000);

      } catch (e) {
        console.error("Error saving:", e);
        alert(t.generalError);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = t.saveBtn;
      }
    });
  </script>
</body>
</html>
