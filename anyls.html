<script>
    let userId = null;

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else userId = user.uid;
    });

    // 1. שליפת מפתח ה-API
    async function getApiKey() {
      try {
        const doc = await db.collection("system_config").doc("gemini_settings").get();
        if (!doc.exists) throw new Error("מפתח API לא הוגדר במסד הנתונים");
        return doc.data().apiKey;
      } catch (e) {
        console.error("שגיאה בשליפת המפתח:", e);
        return null;
      }
    }

    // 2. איסוף כל המידע מה-DB
    async function collectUserData() {
      const todayDocId = new Date().toISOString().split('T')[0];
      
      // שליפת מטרה
      const goalSnap = await db.collection("users").doc(userId).collection("goals")
        .orderBy("createdAt", "desc").limit(1).get();
      const goal = goalSnap.empty ? "שיפור איכות החיים" : goalSnap.docs[0].data().text;

      // שליפת הרגלים קבועים
      const habitSnap = await db.collection("users").doc(userId).collection("habits").get();
      const habits = habitSnap.docs.map(d => d.data().text);

      // שליפת סטטיסטיקה של היום
      const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(todayDocId).get();
      const stats = statsDoc.exists ? statsDoc.data() : {};

      return { goal, habits, stats };
    }

    // 3. יצירת דוח מה-AI
    async function generateAnalytics() {
      const btn = document.getElementById("analyzeBtn");
      const loader = document.getElementById("loadingArea");
      const resultArea = document.getElementById("resultArea");

      btn.disabled = true;
      loader.style.display = "block";
      resultArea.style.display = "none";

      try {
        const apiKey = await getApiKey();
        if (!apiKey) throw new Error("לא נמצא מפתח API תקין");

        const data = await collectUserData();
        
        // הכנת פירוט הביצועים
        const performance = data.habits.length > 0 
          ? data.habits.map(h => `${h}: ${data.stats[h] ? 'בוצע ✅' : 'לא בוצע ❌'}`).join('\n')
          : "אין עדיין הרגלים מוגדרים.";

        const prompt = `
          אתה מאמן אישי מומחה לשינוי הרגלים. 
          נתוני המשתמש:
          - המטרה הגדולה שלו: "${data.goal}"
          - רשימת ההרגלים שלו וביצועיהם היום: 
          ${performance}

          משימה:
          1. תן חיזוק חיובי קצר על סמך הביצועים.
          2. נתח האם ההרגלים האלו באמת מקדמים אותו למטרה הגדולה שלו.
          3. המלץ על שיפור אחד או דיוק אחד.
          4. המלץ על הרגל חדש או משימה קטנה אחת למחר שתעזור לו להגיע למטרה.
          
          כתוב בעברית מעודדת, בגובה העיניים ובצורה תמציתית (עד 150 מילים).
        `;

        // שימוש בשם המודל המלא
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();

        // בדיקה אם ה-API החזיר שגיאה (כמו מפתח לא תקין)
        if (resData.error) {
           throw new Error(resData.error.message);
        }

        // בדיקה אם יש תשובה תקינה ב-candidates
        if (resData.candidates && resData.candidates[0] && resData.candidates[0].content) {
          const aiText = resData.candidates[0].content.parts[0].text;
          resultArea.innerHTML = `<h3>דוח התקדמות אישי:</h3><div class="insight-card">${aiText}</div>`;
          resultArea.style.display = "block";
        } else {
          throw new Error("ה-AI לא הצליח לגבש תשובה. נסה שוב.");
        }

      } catch (err) {
        console.error("Full Error:", err);
        alert("שגיאה: " + err.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }

    document.getElementById("analyzeBtn").addEventListener("click", generateAnalytics);
  </script>
