<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אנליטיקה AI - Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .analytics-container { display: flex; flex-direction: column; gap: 20px; }
    .ai-response {
      background: white; padding: 25px; border-radius: 12px;
      line-height: 1.6; border-right: 6px solid #2ecc71;
      display: none; white-space: pre-wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 1.1em;
    }
    .loading-container { text-align: center; padding: 40px; display: none; }
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71;
      border-radius: 50%; width: 45px; height: 45px;
      animation: spin 1s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .action-btn-ai {
      background-color: #2ecc71; color: white; border: none; padding: 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2em;
      width: 100%; transition: all 0.3s ease;
    }
    .action-btn-ai:hover { background-color: #27ae60; transform: translateY(-2px); }
    .action-btn-ai:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    h3 { color: #2c3e50; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>🧠 תובנות AI חכמות</h1>
    <div class="analytics-container">
      <section class="card">
        <h3 style="text-align: center;">ניתוח התקדמות אישי</h3>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">ה-AI ינתח את המטרה, ההרגלים והביצועים שלך מהיום כדי לתת לך משוב מדויק.</p>
        <button id="analyzeBtn" class="action-btn-ai">✨ צור דוח תובנות עכשיו</button>
      </section>

      <div id="loadingArea" class="loading-container">
        <div class="loader"></div>
        <p>מעבד נתונים מה-Database... ⚡</p>
      </div>

      <div id="resultArea" class="ai-response"></div>

      <div class="actions">
        <button onclick="window.location.href='dashboard.html'" style="width: 100%; background-color: #34495e;">🏠 חזרה לדשבורד</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else userId = user.uid;
    });

    // שיטות ה-API המוכחות שלך
    async function fetchApiKey() {
      const doc = await db.collection("system_config").doc("gemini_settings").get();
      if (doc.exists) return doc.data().apiKey;
      throw new Error("מפתח API חסר ב-system_config");
    }

    async function getAvailableModel(apiKey) {
      try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await resp.json();
        const model = data.models.find(m => m.supportedGenerationMethods.includes("generateContent"));
        return model ? model.name : "models/gemini-1.5-flash"; 
      } catch (e) {
        return "models/gemini-1.5-flash";
      }
    }

    // איסוף נתונים בטוח מ-4 הקולקציות שלך
    async function collectUserData() {
      const todayDocId = new Date().toISOString().split('T')[0];
      
      // 1. שליפת מטרה (מתוך קולקציית goals)
      let goal = "התפתחות אישית";
      try {
        const goalSnap = await db.collection("users").doc(userId).collection("goals").limit(5).get();
        if (!goalSnap.empty) {
          // לוקח את המטרה האחרונה ברשימה ללא צורך במיון מורכב
          goal = goalSnap.docs[goalSnap.docs.length - 1].data().text || goal;
        }
      } catch(e) { console.log("No goals found"); }

      // 2. שליפת הרגלים (מתוך קולקציית habits)
      let habitsList = [];
      const habitSnap = await db.collection("users").doc(userId).collection("habits").get();
      habitSnap.forEach(doc => {
        if (doc.data().text) habitsList.push(doc.data().text);
      });

      // 3. שליפת ביצועים של היום (מתוך קולקציית stats)
      const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(todayDocId).get();
      const statsData = statsDoc.exists ? statsDoc.data() : {};

      return { goal, habitsList, statsData };
    }

    async function generateAnalytics() {
      const btn = document.getElementById("analyzeBtn");
      const loader = document.getElementById("loadingArea");
      const resultArea = document.getElementById("resultArea");

      btn.disabled = true;
      loader.style.display = "block";
      resultArea.style.display = "none";

      try {
        const apiKey = await fetchApiKey();
        const modelName = await getAvailableModel(apiKey);
        const data = await collectUserData();
        
        // בניית דוח ביצועים למנוע ה-AI
        let performanceSummary = "";
        if (data.habitsList.length > 0) {
          performanceSummary = data.habitsList.map(h => {
            const status = data.statsData[h] ? "בוצע ✅" : "לא בוצע ❌";
            return `${h}: ${status}`;
          }).join("\n");
        } else {
          performanceSummary = "לא הוגדרו הרגלים עדיין.";
        }

        const prompt = `אתה מאמן אישי חכם. 
          המטרה הגדולה של המשתמש: "${data.goal}"
          ביצועי ההרגלים שלו היום:
          ${performanceSummary}
          
          תפקידך:
          1. תן חיזוק חיובי קצר.
          2. הסבר בקצרה איך ההרגלים האלו עוזרים למטרה הגדולה.
          3. תן עצה פרקטית אחת לשיפור למחר.
          כתוב בעברית מעודדת וקצרה.`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();
        
        if (resData.candidates && resData.candidates[0].content) {
          const aiText = resData.candidates[0].content.parts[0].text;
          resultArea.innerHTML = `<h3>התובנות שלי עבורך:</h3><div>${aiText}</div>`;
          resultArea.style.display = "block";
        } else {
          throw new Error("ה-AI לא הצליח לגבש תשובה כרגע.");
        }

      } catch (err) {
        console.error(err);
        alert("שגיאה: " + err.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }

    document.getElementById("analyzeBtn").addEventListener("click", generateAnalytics);
  </script>
</body>
</html>
