<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אנליטיקה שבועית AI - Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .analytics-container { display: flex; flex-direction: column; gap: 20px; }
    .ai-response {
      background: white; padding: 25px; border-radius: 12px;
      line-height: 1.6; border-right: 6px solid #2ecc71;
      display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 1.1em;
    }
    .loading-container { text-align: center; padding: 40px; display: none; }
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71;
      border-radius: 50%; width: 45px; height: 45px;
      animation: spin 1s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .action-btn-ai {
      background-color: #2ecc71; color: white; border: none; padding: 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2em;
      width: 100%; transition: all 0.3s ease;
    }
    .action-btn-ai:hover { background-color: #27ae60; transform: translateY(-2px); }
    
    .recommendation-box {
      margin-top: 20px; padding: 15px; background: #f0f9ff;
      border-radius: 8px; border: 1px dashed #3498db; text-align: center; display: none;
    }
    .add-task-btn {
      background-color: #3498db; color: white; border: none; padding: 10px 20px;
      border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🧠 ניתוח שבועי חכם</h1>
    <div class="analytics-container">
      <section class="card">
        <h3 style="text-align: center;">תובנות על השבוע האחרון</h3>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">ה-AI ינתח את המגמות שלך ב-7 הימים האחרונים וימליץ על צעדים להמשך.</p>
        <button id="analyzeBtn" class="action-btn-ai">✨ נתח את השבוע שלי</button>
      </section>

      <div id="loadingArea" class="loading-container">
        <div class="loader"></div>
        <p>אוסף נתונים מ-7 הימים האחרונים... 📊</p>
      </div>

      <div id="resultArea" class="ai-response">
        <div id="aiTextContent"></div>
        <div id="recommendationBox" class="recommendation-box">
          <p>💡 <strong>משימה מומלצת למחר:</strong></p>
          <p id="suggestedTaskText" style="font-weight: bold; color: #2c3e50;"></p>
          <button id="addTaskBtn" class="add-task-btn">➕ הוסף למשימות למחר</button>
        </div>
      </div>

      <div class="actions">
        <button onclick="window.location.href='dashboard.html'" style="width: 100%; background-color: #34495e;">🏠 חזרה לדשבורד</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;
    let currentRecommendedTask = "";

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else userId = user.uid;
    });

    async function fetchApiKey() {
      const doc = await db.collection("system_config").doc("gemini_settings").get();
      return doc.exists ? doc.data().apiKey : null;
    }

    async function getAvailableModel(apiKey) {
      try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await resp.json();
        const model = data.models.find(m => m.supportedGenerationMethods.includes("generateContent"));
        return model ? model.name : "models/gemini-1.5-flash"; 
      } catch (e) { return "models/gemini-1.5-flash"; }
    }

    // פונקציה חדשה לאיסוף נתונים שבועיים
    async function collectWeeklyData() {
      const weeklyHistory = [];
      const now = new Date();
      
      // איסוף מטרות (האחרונה)
      let goal = "התפתחות אישית";
      const goalSnap = await db.collection("users").doc(userId).collection("goals").limit(5).get();
      if (!goalSnap.empty) goal = goalSnap.docs[goalSnap.docs.length - 1].data().text || goal;

      // איסוף ביצועים מ-7 הימים האחרונים
      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(now.getDate() - i);
        const dateId = d.toISOString().split('T')[0];
        
        const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(dateId).get();
        if (statsDoc.exists) {
          const dayData = statsDoc.data();
          const completed = Object.values(dayData).filter(v => v === true).length;
          const total = Object.keys(dayData).length;
          weeklyHistory.push(`${dateId}: בוצעו ${completed} מתוך ${total} משימות.`);
        }
      }

      return { goal, weeklyHistory: weeklyHistory.reverse().join('\n') };
    }

    async function generateAnalytics() {
      const btn = document.getElementById("analyzeBtn");
      const loader = document.getElementById("loadingArea");
      const resultArea = document.getElementById("resultArea");
      const recBox = document.getElementById("recommendationBox");

      btn.disabled = true;
      loader.style.display = "block";
      resultArea.style.display = "none";

      try {
        const apiKey = await fetchApiKey();
        const modelName = await getAvailableModel(apiKey);
        const data = await collectWeeklyData();
        
        const prompt = `אתה מאמן אישי. המטרה הגדולה של המשתמש: "${data.goal}". 
          להלן היסטוריית הביצועים שלו ב-7 הימים האחרונים:
          ${data.weeklyHistory || "אין מספיק נתונים לשבוע האחרון."}
          
          תפקידך:
          1. נתח את העקביות שלו לאורך השבוע. האם יש ימים חלשים?
          2. תן חיזוק חיובי מבוסס נתונים.
          3. המלץ על משימה יומית אחת למחר שתעזור לו לשמור על המומנטום.
          חשוב: את המשימה בלבד כתוב בשורה האחרונה אחרי המילה "TASK:".`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();
        
        if (resData.candidates && resData.candidates[0].content) {
          let fullText = resData.candidates[0].content.parts[0].text;
          const parts = fullText.split("TASK:");
          const feedback = parts[0].trim();
          currentRecommendedTask = parts[1] ? parts[1].trim() : "";

          document.getElementById("aiTextContent").innerHTML = `<h3>סיכום שבועי AI:</h3><p>${feedback}</p>`;
          
          if (currentRecommendedTask) {
            document.getElementById("suggestedTaskText").textContent = currentRecommendedTask;
            recBox.style.display = "block";
          }
          resultArea.style.display = "block";
        }
      } catch (err) { alert("שגיאה: " + err.message); }
      finally { loader.style.display = "none"; btn.disabled = false; }
    }

    async function addSuggestedTask() {
      if (!currentRecommendedTask || !userId) return;
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowId = tomorrow.toISOString().split('T')[0];

      const btn = document.getElementById("addTaskBtn");
      btn.textContent = "שומר...";
      
      try {
        await db.collection("users").doc(userId).collection("daily").doc(tomorrowId).collection("tempHabits").add({
          text: currentRecommendedTask,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("המשימה נוספה למחר!");
        btn.textContent = "✅ נוסף!";
        btn.disabled = true;
      } catch (e) { alert("שגיאה בשמירה"); }
    }

    document.getElementById("analyzeBtn").addEventListener("click", generateAnalytics);
    document.getElementById("addTaskBtn").addEventListener("click", addSuggestedTask);
  </script>
</body>
</html>
