<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אנליטיקה שבועית AI - Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .analytics-container { display: flex; flex-direction: column; gap: 20px; }
    .ai-response {
      background: white; padding: 25px; border-radius: 12px;
      line-height: 1.8; border-right: 6px solid #2ecc71;
      display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 1.1em; color: #2c3e50;
    }
    .loading-container { text-align: center; padding: 40px; display: none; }
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71;
      border-radius: 50%; width: 45px; height: 45px;
      animation: spin 1s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .action-btn-ai {
      background-color: #2ecc71; color: white; border: none; padding: 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2em;
      width: 100%; transition: all 0.3s ease;
    }
    .action-btn-ai:hover { background-color: #27ae60; transform: translateY(-2px); }
    .recommendation-box {
      margin-top: 25px; padding: 20px; background: #f9fdfa;
      border-radius: 10px; border: 2px dashed #2ecc71; text-align: center; display: none;
    }
    .suggested-task-title { color: #27ae60; font-weight: bold; margin-bottom: 5px; font-size: 1.2em; }
    .add-task-btn {
      background-color: #3498db; color: white; border: none; padding: 12px 25px;
      border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🧠 ניתוח שבועי חכם</h1>
    <div class="analytics-container">
      <section class="card">
        <h3 style="text-align: center;">תובנות על השבוע האחרון</h3>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">ה-AI ינתח את 7 הימים האחרונים (לא כולל היום) ויבדוק את עקביות הביצועים שלך.</p>
        <button id="analyzeBtn" class="action-btn-ai">✨ נתח את השבוע שלי</button>
      </section>

      <div id="loadingArea" class="loading-container">
        <div class="loader"></div>
        <p>מצליב נתוני ביצוע מארכיון המשימות... 📊</p>
      </div>

      <div id="resultArea" class="ai-response">
        <div id="aiTextContent"></div>
        <div id="recommendationBox" class="recommendation-box">
          <div class="suggested-task-title">🎯 המשימה המדויקת עבורך למחר:</div>
          <p id="suggestedTaskText" style="font-weight: bold; font-size: 1.2em; color: #2c3e50;"></p>
          <button id="addTaskBtn" class="add-task-btn">➕ הוסף לרשימה היומית</button>
        </div>
      </div>

      <div class="actions">
        <button onclick="window.location.href='dashboard.html'" style="width: 100%; background-color: #34495e;">🏠 חזרה לדשבורד</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;
    let currentRecommendedTask = "";

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else userId = user.uid;
    });

    async function fetchApiKey() {
      const doc = await db.collection("system_config").doc("gemini_settings").get();
      return doc.exists ? doc.data().apiKey : null;
    }

    async function collectWeeklyData() {
      const now = new Date();
      let goal = "שיפור עצמי";
      
      const goalSnap = await db.collection("users").doc(userId).collection("goals").orderBy("createdAt", "desc").limit(1).get();
      if (!goalSnap.empty) goal = goalSnap.docs[0].data().text;

      const dailyDetails = [];

      // רשימת הרגלים קבועה (בסיס)
      const baseSnap = await db.collection("users").doc(userId).collection("habits").get();
      const baseHabitNames = baseSnap.docs.map(doc => doc.data().text);

      // לולאת 7 ימים אחורה (לא כולל היום)
      for (let i = 1; i <= 7; i++) {
        const d = new Date();
        d.setDate(now.getDate() - i);
        const dateId = d.toISOString().split('T')[0];
        
        // שליפת הסטטיסטיקה של אותו יום (כאן נמצא ה-V האמיתי)
        const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(dateId).get();
        const dailyStats = statsDoc.exists ? statsDoc.data() : {};
        
        // שליפת המשימות הזמניות של אותו יום
        const tempSnap = await db.collection("users").doc(userId).collection("daily").doc(dateId).collection("tempHabits").get();
        
        const dayTasks = [];

        // 1. הוספת הרגלים קבועים ובדיקה אם בוצעו
        baseHabitNames.forEach(name => {
           const done = dailyStats[name] === true;
           dayTasks.push(`${name} (קבוע) - ${done ? 'בוצע ✅' : 'לא בוצע ❌'}`);
        });

        // 2. הוספת משימות זמניות ובדיקה אם בוצעו
        tempSnap.forEach(t => {
          const taskText = t.data().text;
          const done = dailyStats[taskText] === true;
          dayTasks.push(`${taskText} (זמני) - ${done ? 'בוצע ✅' : 'לא בוצע ❌'}`);
        });

        dailyDetails.push({
          date: dateId,
          tasks: dayTasks
        });
      }
      return { goal, dailyDetails };
    }

    async function generateAnalytics() {
      const btn = document.getElementById("analyzeBtn");
      const loader = document.getElementById("loadingArea");
      const resultArea = document.getElementById("resultArea");
      const recBox = document.getElementById("recommendationBox");

      btn.disabled = true;
      loader.style.display = "block";
      resultArea.style.display = "none";

      try {
        const apiKey = await fetchApiKey();
        const data = await collectWeeklyData();
        
        const prompt = `אתה מאמן ביצועים. 
          המטרה של המשתמש: "${data.goal}". 
          להלן נתוני 7 הימים האחרונים שהסתיימו (לא כולל היום):
          ${JSON.stringify(data.dailyDetails)}

          המשימה שלך:
          1. נתח את הקשר בין המשימות שבוצעו בפועל לבין המטרה הגדולה.
          2. תן "שיקוף" למשתמש על משהו שהוא כנראה לא יודע על עצמו מתוך הנתונים. חפש דפוסים נסתרים.
          3. תן חיזוקים על הצלחות קטנות וציין מקומות ספציפיים לשיפור.
          4. אל תשתמש ברשימות ממוספרות. כתוב פסקאות זורמות, חכמות ומעוררות השראה.
          5. בסוף, צור משימה אחת פרקטית ומדויקת למחר שתקדם אותו למטרה.
          
          חשוב מאוד: את המשימה בלבד כתוב בסוף התשובה אחרי המילה "TASK:".`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();
        
        if (resData.candidates && resData.candidates[0].content) {
          let fullText = resData.candidates[0].content.parts[0].text;
          const parts = fullText.split("TASK:");
          const feedback = parts[0].replace(/\*/g, '').trim();
          currentRecommendedTask = parts[1] ? parts[1].trim() : "";

          document.getElementById("aiTextContent").innerHTML = feedback.split('\n').map(p => `<p>${p}</p>`).join('');
          
          if (currentRecommendedTask) {
            document.getElementById("suggestedTaskText").textContent = currentRecommendedTask;
            recBox.style.display = "block";
          }
          resultArea.style.display = "block";
        }
      } catch (err) { alert("שגיאה בניתוח: " + err.message); }
      finally { loader.style.display = "none"; btn.disabled = false; }
    }

    async function addSuggestedTask() {
      if (!currentRecommendedTask || !userId) return;
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const tomorrowId = tomorrow.toISOString().split('T')[0];
      
      try {
        await db.collection("users").doc(userId).collection("daily").doc(tomorrowId).collection("tempHabits").add({
          text: currentRecommendedTask,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("המשימה נוספה למחר!");
        document.getElementById("addTaskBtn").disabled = true;
      } catch (e) { alert("שגיאה בשמירה"); }
    }

    document.getElementById("analyzeBtn").addEventListener("click", generateAnalytics);
    document.getElementById("addTaskBtn").addEventListener("click", addSuggestedTask);
  </script>
</body>
</html>
