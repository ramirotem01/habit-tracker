<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול הרגלים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .manage-card { padding: 30px !important; }
    h1 { margin-bottom: 10px; font-size: 1.8em; text-align: center; }

    /* כפתור AI ירוק ועדין */
    .ai-btn {
      background-color: transparent;
      color: #2ecc71;
      border: 1px solid #2ecc71;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      transition: all 0.3s;
      font-size: 0.9em;
    }
    .ai-btn:hover { background-color: #f0fff4; }

    /* רשימת ההרגלים */
    #habitList { list-style: none; padding: 0; margin: 20px 0; }
    
    .habit-item {
      background: #f8f9fa;
      margin-bottom: 8px;
      border-right: 4px solid #3498db;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .habit-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
    }

    .habit-text {
      flex-grow: 1;
      font-size: 0.95em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 10px;
    }

    /* כשהפריט פתוח */
    .habit-item.open .habit-text {
      white-space: normal;
      overflow: visible;
    }

    .habit-actions {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    /* אייקונים במקום כפתורים גדולים */
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1em;
      padding: 4px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .icon-btn:hover { opacity: 1; }

    .footer-links { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 20px; }
    .link-btn { background: none; border: none; color: #34495e; padding: 8px; cursor: pointer; font-size: 0.85em; text-decoration: none; }
    .logout-link { color: #e74c3c !important; }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>📝 ניהול הרגלים</h1>
    <div class="card login-card manage-card">
      <button class="ai-btn" onclick="window.location.href='aihabit.html'">✨ עוזר AI ליצירת הרגלים</button>
      
      <div class="input-group" style="display: flex; gap: 8px; margin-bottom: 15px;">
        <input type="text" id="newHabit" placeholder="הוסף הרגל חדש..." style="flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" />
        <button id="addHabitBtn" style="background: #2ecc71; color: white; border: none; border-radius: 8px; width: 45px; cursor: pointer;">➕</button>
      </div>

      <ul id="habitList"></ul>

      <div class="footer-links">
        <button class="link-btn" onclick="window.location.href='dashboard.html'">חזרה לדשבורד</button>
        <button id="logoutBtn" class="link-btn logout-link">התנתקות</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="manage.js"></script>
</body>
</html>
