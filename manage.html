<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("PWA Ready"))
        .catch(err => console.log("PWA Error", err));
    }
  </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול הרגלים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* התאמה לעיצוב הקארד שאתה אוהב */
    .manage-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .manage-card {
      padding: 30px !important;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8em;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1em;
      outline: none;
    }
    input:focus {
      border-color: #3498db;
    }

    /* כפתור הוספה רגיל */
    .action-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s;
      width: 100%;
    }
    .action-btn:hover {
      background-color: #27ae60;
    }

    /* כפתור ה-AI הסגול */
    .ai-btn {
      background-color: #9b59b6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
      transition: opacity 0.3s;
    }
    .ai-btn:hover {
      opacity: 0.9;
    }

    /* עיצוב כפתורי הקישור בתחתית (כמו שביקשת) */
    .footer-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .link-btn {
      background: none;
      border: none;
      color: #34495e;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: normal;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    .link-btn:hover {
      background-color: #f5f6f7;
      color: #000;
    }
    .logout-link {
      color: #e74c3c !important;
    }
    .logout-link:hover {
      background-color: #fdf2f2 !important;
    }

    /* רשימת ההרגלים */
    #habitList {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }
    #habitList li {
      background: #f8f9fa;
      padding: 12px;
      margin-bottom: 8px;
      border-right: 4px solid #3498db;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
        background: none;
        border: none;
        color: #e74c3c;
        cursor: pointer;
        font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>📝 ניהול הרגלים</h1>
    
    <div class="card login-card manage-card">
      
      <button class="ai-btn" onclick="window.location.href='aihabit.html'">🤖 יצירת הרגלים עם AI</button>
      
      <div class="manage-container">
        <div class="input-group" style="display: flex; gap: 8px;">
          <input type="text" id="newHabit" placeholder="הוסף הרגל חדש..." />
          <button id="addHabitBtn" class="action-btn" style="width: auto; padding: 10px 20px;">➕</button>
        </div>

        <ul id="habitList">
          </ul>

        <div class="footer-links">
          <button class="link-btn" onclick="window.location.href='dashboard.html'">🔙 חזרה לדשבורד</button>
          <button id="logoutBtn" class="link-btn logout-link">🔓 התנתק מהמערכת</button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>
  <script src="manage.js"></script>
  <script>
    // הוספת לוגיקת התנתקות מהירה ישירות מהדף
    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
