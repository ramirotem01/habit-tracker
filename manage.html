<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול הרגלים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .manage-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .manage-card { padding: 30px !important; }
    h1 { margin-bottom: 10px; font-size: 1.8em; text-align: center; }
    
    /* כפתור AI - ירוק מלא, טקסט לבן, בולט ומעוצב */
    .ai-btn {
      background-color: #2ecc71; 
      color: white; 
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      transition: background 0.3s ease;
      font-size: 1.1em;
      font-family: inherit;
      box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
    }
    .ai-btn:hover {
      background-color: #27ae60;
      box-shadow: 0 6px 8px rgba(39, 174, 96, 0.3);
    }

    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

    #addHabitBtn {
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 15px;
      cursor: pointer;
      transition: background 0.3s;
    }
    #addHabitBtn:hover {
      background: #27ae60;
    }

    /* רשימת הרגלים חכמה */
    #habitList { list-style: none; padding: 0; margin: 20px 0; }
    
    .habit-item {
      background: #f8f9fa;
      margin-bottom: 10px;
      border-right: 4px solid #3498db;
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .habit-header {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .habit-text {
      flex-grow: 1;
      margin-left: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.95em;
    }

    .habit-item.open .habit-text {
      white-space: normal;
      overflow: visible;
    }

    .habit-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2em;
      padding: 5px;
      transition: transform 0.2s;
    }
    .icon-btn:hover { transform: scale(1.2); }

    .footer-links { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px; }
    .link-btn { background: none; border: none; color: #34495e; padding: 8px 15px; cursor: pointer; font-size: 0.9em; transition: all 0.3s; }
    .link-btn:hover { background-color: #f5f6f7; border-radius: 20px; }
    .logout-link { color: #e74c3c !important; }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>📝 ניהול הרגלים</h1>
    
    <div class="card login-card manage-card">
      <button class="ai-btn" onclick="window.location.href='aihabit.html'">✨ בניית תוכנית עם עוזר AI</button>
      
      <div class="manage-container">
        <div class="input-group" style="display: flex; gap: 8px;">
          <input type="text" id="newHabit" placeholder="הוסף הרגל חדש..." />
          <button id="addHabitBtn">➕</button>
        </div>

        <ul id="habitList">
        </ul>

        <div class="footer-links">
          <button class="link-btn" onclick="window.location.href='dashboard.html'">🔙 חזרה לדשבורד</button>
          <button id="logoutBtn" class="link-btn logout-link">🔓 התנתק</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  
  <script src="manage.js"></script>
  <script>
    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = 'index.html');
    });
  </script>
</body>
</html>
