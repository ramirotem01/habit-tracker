<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Habit Tracker – AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ai-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .ai-card {
      padding: 30px !important;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8em;
      text-align: center;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      resize: none;
      font-size: 1em;
      outline: none;
      min-height: 100px;
    }
    textarea:focus {
      border-color: #2ecc71;
    }

    .action-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s;
      margin-top: 10px;
      width: 100%;
    }
    .action-btn:hover {
      background-color: #27ae60;
    }
    .action-btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .back-btn {
      background: none;
      border: none;
      color: #34495e;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      margin: 15px auto 0 auto;
      font-size: 0.9em;
      font-weight: normal;
      transition: all 0.3s ease;
      display: inline-block;
      width: fit-content;
      text-decoration: none;
      text-align: center;
    }
    .back-btn:hover {
      background-color: #f5f6f7;
      color: #000;
    }

    .suggestions-list {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }
    .suggestions-list li {
      background: #f8f9fa;
      padding: 12px;
      margin-bottom: 8px;
      /* שימוש ב-inline-start לתמיכה בכיווניות הפס */
      border-inline-start: 4px solid #2ecc71;
      border-radius: 4px;
      font-size: 0.95em;
    }

    .loading-spinner {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.9em;
      margin: 10px 0;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1 id="ui-main-title"></h1>
    <div class="card login-card ai-card">
      <p id="ui-description" style="text-align: center; color: #666; margin-bottom: 20px;"></p>
      
      <div class="ai-container">
        <textarea id="goalInput" rows="3"></textarea>
        <button id="generateBtn" class="action-btn"></button>
        
        <div id="loadingMsg" class="loading-spinner"></div>

        <div id="previewArea" style="display: none;">
          <h3 id="ui-preview-title" style="font-size: 1.1em; margin-bottom: 10px;"></h3>
          <ul id="suggestedList" class="suggestions-list"></ul>
          <button id="approveBtn" class="action-btn" style="background-color: #3498db;"></button>
        </div>

        <div style="text-align: center;">
          <a href="manage.html" class="back-btn" id="ui-back-btn"></a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    const translations = {
      he: {
        title: "Habit Tracker – עוזר AI",
        mainTitle: "עוזר AI אישי",
        description: "רשום את המטרה שלך, והמערכת תבנה עבורך 5 הרגלים מנצחים",
        placeholder: "למשל: אני רוצה להיכנס לכושר השנה...",
        generateBtn: "✨ צור תוכנית הרגלים",
        loading: "מתחבר ל-AI... ⚡",
        previewTitle: "ההרגלים החדשים שלך:",
        approveBtn: "✅ אשר והוסף הכל למערכת",
        backBtn: "חזרה לניהול הרגלים",
        limitAlert: "כבר יצרת תוכנית הרגלים היום. ניתן להשתמש בעוזר ה-AI פעם ביום.",
        errorMsg: "שגיאה ביצירת הרגלים: ",
        saveError: "הייתה בעיה בשמירת המטרה והרגלים.",
        prompt: (goal) => `המטרה שלי: "${goal}". תחזיר רשימת JSON של 5 הרגלים יומיים קצרים בשפה העברית: ["הרגל 1", "הרגל 2", "הרגל 3", "הרגל 4", "הרגל 5"]. בלי שום טקסט נוסף.`
      },
      en: {
        title: "Habit Tracker – AI Assistant",
        mainTitle: "Personal AI Assistant",
        description: "Write your goal, and the system will build 5 winning habits for you",
        placeholder: "e.g., I want to get in shape this year...",
        generateBtn: "✨ Create Habit Plan",
        loading: "Connecting to AI... ⚡",
        previewTitle: "Your New Habits:",
        approveBtn: "✅ Approve & Add All to System",
        backBtn: "Back to Habit Management",
        limitAlert: "You have already created a habit plan today. AI assistant can be used once a day.",
        errorMsg: "Error creating habits: ",
        saveError: "There was a problem saving your goal and habits.",
        prompt: (goal) => `My goal: "${goal}". Return a JSON list of 5 short daily habits in English: ["Habit 1", "Habit 2", "Habit 3", "Habit 4", "Habit 5"]. No additional text.`
      }
    };

    const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
    const t = translations[userLang];
    let userId = null;

    // הגדרת UI ראשונית
    document.documentElement.lang = userLang;
    document.documentElement.dir = (userLang === 'he') ? 'rtl' : 'ltr';
    document.getElementById('page-title').innerText = t.title;
    document.getElementById('ui-main-title').innerText = t.mainTitle;
    document.getElementById('ui-description').innerText = t.description;
    document.getElementById('goalInput').placeholder = t.placeholder;
    document.getElementById('generateBtn').innerText = t.generateBtn;
    document.getElementById('loadingMsg').innerText = t.loading;
    document.getElementById('ui-preview-title').innerText = t.previewTitle;
    document.getElementById('approveBtn').innerText = t.approveBtn;
    document.getElementById('ui-back-btn').innerText = t.backBtn;

    auth.onAuthStateChanged(user => { 
      if (!user) window.location.href = "index.html"; 
      else userId = user.uid; 
    });

    async function fetchApiKey() {
      const doc = await db.collection("system_config").doc("gemini_settings").get();
      if (doc.exists) return doc.data().apiKey;
      throw new Error("API Key not found");
    }

    async function generateWithAI(goal) {
      const apiKey = await fetchApiKey();
      const promptText = t.prompt(goal);
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error.message);

      let text = data.candidates[0].content.parts[0].text;
      const cleanJson = text.replace(/```json/g, "").replace(/```/g, "").trim();
      return JSON.parse(cleanJson);
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      const goal = document.getElementById("goalInput").value.trim();
      if (!goal) return;

      const today = new Date().toISOString().split('T')[0];
      const userDoc = await db.collection("users").doc(userId).get();
      if (userDoc.exists && userDoc.data().lastHabitGenerationDate === today) {
        alert(t.limitAlert);
        return;
      }

      const btn = document.getElementById("generateBtn");
      const loader = document.getElementById("loadingMsg");
      const preview = document.getElementById("previewArea");

      btn.disabled = true;
      loader.style.display = "block";
      preview.style.display = "none";

      try {
        const habits = await generateWithAI(goal);
        await db.collection("users").doc(userId).set({ lastHabitGenerationDate: today }, { merge: true });

        const list = document.getElementById("suggestedList");
        list.innerHTML = "";
        habits.forEach(h => {
          const li = document.createElement("li");
          li.textContent = h;
          list.appendChild(li);
        });
        preview.style.display = "block";
        window.currentHabits = habits;
      } catch (error) {
        alert(t.errorMsg + error.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    });

    document.getElementById("approveBtn").addEventListener("click", async () => {
      if (!window.currentHabits || !userId) return;
      const goalText = document.getElementById("goalInput").value.trim();
      const batch = db.batch();

      const goalRef = db.collection("users").doc(userId).collection("goals").doc();
      batch.set(goalRef, { text: goalText, createdAt: firebase.firestore.FieldValue.serverTimestamp() });

      window.currentHabits.forEach(text => {
        const ref = db.collection("users").doc(userId).collection("habits").doc();
        batch.set(ref, { text, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });

      try {
        await batch.commit();
        window.location.href = "manage.html";
      } catch (e) {
        alert(t.saveError);
      }
    });
  </script>
</body>
</html>
