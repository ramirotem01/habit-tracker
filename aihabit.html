<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker – עוזר AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ai-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .ai-card { padding: 30px !important; }
    h1 { margin-bottom: 10px; font-size: 1.8em; text-align: center; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; resize: none; font-size: 1em; outline: none; min-height: 100px; }
    textarea:focus { border-color: #2ecc71; }
    .action-btn { background-color: #2ecc71; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em; transition: background 0.3s; margin-top: 10px; width: 100%; }
    .action-btn:hover { background-color: #27ae60; }
    .action-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    .back-btn { background: none; border: none; color: #34495e; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin: 15px auto 0 auto; font-size: 0.9em; transition: all 0.3s ease; display: inline-block; width: fit-content; text-decoration: none; }
    .back-btn:hover { background-color: #f5f6f7; color: #000; }
    .suggestions-list { list-style: none; padding: 0; margin: 20px 0; }
    .suggestions-list li { background: #f8f9fa; padding: 12px; margin-bottom: 8px; border-right: 4px solid #2ecc71; border-radius: 4px; font-size: 0.95em; text-align: right; }
    .loading-spinner { text-align: center; color: #7f8c8d; font-size: 0.9em; margin: 10px 0; display: none; }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1> עוזר AI אישי</h1>
    <div class="card login-card ai-card">
      <p style="text-align: center; color: #666; margin-bottom: 20px;">רשום את המטרה שלך, והמערכת תבנה עבורך 5 הרגלים מנצחים</p>
      
      <div class="ai-container">
        <textarea id="goalInput" placeholder="למשל: אני רוצה להיכנס לכושר השנה..." rows="3"></textarea>
        <button id="generateBtn" class="action-btn">✨ צור תוכנית הרגלים</button>
        
        <div id="loadingMsg" class="loading-spinner">מתחבר ל-AI... ⚡</div>

        <div id="previewArea" style="display: none;">
          <h3 style="font-size: 1.1em; margin-bottom: 10px;">ההרגלים החדשים שלך:</h3>
          <ul id="suggestedList" class="suggestions-list"></ul>
          <button id="approveBtn" class="action-btn" style="background-color: #3498db;">✅ אשר והוסף הכל למערכת</button>
        </div>

        <div style="text-align: center;">
          <button class="back-btn" onclick="window.location.href='manage.html'">חזרה לניהול הרגלים</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    const GEMINI_API_KEY = "AIzaSyAhOzuUV7gWvI86y_UDQbAS7WAU5IgnPSY";
    let userId = null;

    auth.onAuthStateChanged(user => { 
      if (!user) window.location.href = "index.html"; 
      else userId = user.uid; 
    });

    async function generateWithAI(goal) {
      // ניסיון עם המודל הכי חזק ויציב בגרסה v1
      const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-pro:generateContent?key=${GEMINI_API_KEY}`;

      const prompt = `המטרה שלי: "${goal}". תחזיר רשימת JSON של 5 הרגלים יומיים קצרים: ["הרגל 1", "הרגל 2", "הרגל 3", "הרגל 4", "הרגל 5"]. תחזיר אך ורק את הרשימה, בלי הסברים ובלי מילים נוספות.`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          console.error("Gemini Error Detail:", data);
          throw new Error(data.error ? data.error.message : "שגיאת API כללית");
        }

        return extractJson(data);
      } catch (err) {
        // אם gemini-1.5-pro נכשל, ננסה את flash בגרסת v1 המדויקת
        return await retryWithFlash(goal);
      }
    }

    async function retryWithFlash(goal) {
        const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
        const prompt = `המטרה שלי: "${goal}". תחזיר רשימת JSON של 5 הרגלים יומיים: ["1", "2", "3", "4", "5"]. רק JSON.`;
        
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error ? data.error.message : "חיבור נכשל");
        return extractJson(data);
    }

    function extractJson(data) {
        try {
            let rawText = data.candidates[0].content.parts[0].text;
            const jsonMatch = rawText.match(/\[[\s\S]*\]/);
            if (!jsonMatch) throw new Error();
            return JSON.parse(jsonMatch[0]);
        } catch (e) {
            throw new Error("ה-AI החזיר תשובה בפורמט לא תקין, נסה שנית");
        }
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      const goal = document.getElementById("goalInput").value.trim();
      if (!goal) return;

      const btn = document.getElementById("generateBtn");
      const loader = document.getElementById("loadingMsg");
      const preview = document.getElementById("previewArea");

      btn.disabled = true;
      loader.style.display = "block";
      preview.style.display = "none";

      try {
        const habits = await generateWithAI(goal);
        const list = document.getElementById("suggestedList");
        list.innerHTML = "";
        habits.forEach(h => {
          const li = document.createElement("li");
          li.textContent = h;
          list.appendChild(li);
        });
        preview.style.display = "block";
        window.currentHabits = habits;
      } catch (error) {
        alert("שגיאה: " + error.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    });

    document.getElementById("approveBtn").addEventListener("click", async () => {
      if (!window.currentHabits || !userId) return;
      try {
        const batch = db.batch();
        window.currentHabits.forEach(text => {
          const ref = db.collection("users").doc(userId).collection("habits").doc();
          batch.set(ref, { text: text, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        });
        await batch.commit();
        window.location.href = "manage.html";
      } catch (e) {
        alert("שגיאה בשמירה: " + e.message);
      }
    });
  </script>
</body>
</html>
