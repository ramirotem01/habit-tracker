<script>
    const GEMINI_API_KEY = "AIzaSyAhOzuUV7gWvI86y_UDQbAS7WAU5IgnPSY";
    let userId = null;

    auth.onAuthStateChanged(user => { 
      if (!user) window.location.href = "index.html"; 
      else userId = user.uid; 
    });

    // פונקציה משופרת שמבטיחה פורמט שם נקי
    async function getAvailableModel() {
        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${GEMINI_API_KEY}`);
            if (!resp.ok) throw new Error();
            const data = await resp.json();
            // מחפש את פלאש ברשימה
            const model = data.models.find(m => m.name.includes("gemini-1.5-flash"));
            // מחזיר רק את השם (למשל models/gemini-1.5-flash) בלי תוספות
            return model ? model.name : "models/gemini-1.5-flash"; 
        } catch (e) {
            // אם נכשל, חוזר לברירת המחדל היציבה
            return "models/gemini-1.5-flash";
        }
    }

    async function generateWithAI(goal) {
      const modelName = await getAvailableModel();
      const prompt = `המטרה שלי: "${goal}". תחזיר רשימת JSON של 5 הרגלים יומיים קצרים: ["הרגל 1", "הרגל 2", "הרגל 3", "הרגל 4", "הרגל 5"]. בלי שום טקסט נוסף.`;
      
      // שימוש בגרסה v1 היציבה במקום v1beta
      const url = `https://generativelanguage.googleapis.com/v1/${modelName}:generateContent?key=${GEMINI_API_KEY}`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (!response.ok) {
          // אם v1 נכשל, ננסה פעם אחרונה עם v1beta כגיבוי
          if (response.status === 404) {
              const retryUrl = url.replace("/v1/", "/v1beta/");
              const retryResp = await fetch(retryUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
              });
              const retryData = await retryResp.json();
              if (!retryResp.ok) throw new Error(retryData.error.message);
              return parseGeminiResponse(retryData);
          }
          throw new Error(data.error.message);
      }

      return parseGeminiResponse(data);
    }

    // פונקציית עזר לחילוץ הטקסט מה-JSON של גוגל
    function parseGeminiResponse(data) {
        let text = data.candidates[0].content.parts[0].text;
        const cleanJson = text.replace(/```json/g, "").replace(/```/g, "").trim();
        return JSON.parse(cleanJson);
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      const goal = document.getElementById("goalInput").value.trim();
      if (!goal) return;

      const btn = document.getElementById("generateBtn");
      const loader = document.getElementById("loadingMsg");
      const preview = document.getElementById("previewArea");

      btn.disabled = true;
      loader.style.display = "block";
      preview.style.display = "none";

      try {
        const habits = await generateWithAI(goal);
        const list = document.getElementById("suggestedList");
        list.innerHTML = "";
        habits.forEach(h => {
          const li = document.createElement("li");
          li.textContent = h;
          list.appendChild(li);
        });
        preview.style.display = "block";
        window.currentHabits = habits;
      } catch (error) {
        console.error(error);
        alert("שגיאה ביצירת הרגלים. וודא שהמטרה ברורה ונסה שוב.");
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    });

    document.getElementById("approveBtn").addEventListener("click", async () => {
      if (!window.currentHabits) return;
      const batch = db.batch();
      window.currentHabits.forEach(text => {
        const ref = db.collection("users").doc(userId).collection("habits").doc();
        batch.set(ref, { text, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
      await batch.commit();
      window.location.href = "manage.html";
    });
  </script>
