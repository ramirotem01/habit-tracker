<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker – עוזר AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ai-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    .ai-card {
      padding: 30px !important;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 1.8em;
      text-align: center;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-family: inherit;
      resize: none;
      font-size: 1em;
      outline: none;
      min-height: 100px;
    }
    textarea:focus {
      border-color: #2ecc71;
    }
    .action-btn {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.1em;
      transition: background 0.3s;
      margin-top: 10px;
      width: 100%;
    }
    .action-btn:hover {
      background-color: #27ae60;
    }
    .action-btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    
    .back-btn {
      background: none;
      border: none;
      color: #34495e;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      margin: 15px auto 0 auto;
      font-size: 0.9em;
      transition: all 0.3s ease;
      display: inline-block;
      width: fit-content;
      text-decoration: none;
    }
    .back-btn:hover {
      background-color: #f5f6f7;
      color: #000;
    }

    .suggestions-list {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }
    .suggestions-list li {
      background: #f8f9fa;
      padding: 12px;
      margin-bottom: 8px;
      border-right: 4px solid #2ecc71;
      border-radius: 4px;
      font-size: 0.95em;
      text-align: right;
    }

    .loading-spinner {
      text-align: center;
      color: #7f8c8d;
      font-size: 0.9em;
      margin: 10px 0;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>🤖 עוזר AI אישי</h1>
    <div class="card login-card ai-card">
      <p style="text-align: center; color: #666; margin-bottom: 20px;">מה המטרה השנתית שלך? אני אפרק אותה ל-5 הרגלים יומיים</p>
      
      <div class="ai-container">
        <textarea id="goalInput" placeholder="למשל: אני רוצה ללמוד תכנות מאפס..." rows="3"></textarea>
        <button id="generateBtn" class="action-btn">✨ צור תוכנית הרגלים</button>
        
        <div id="loadingMsg" class="loading-spinner">ה-AI מנתח את המטרה ומייצר הרגלים... ⚡</div>

        <div id="previewArea" style="display: none;">
          <h3 style="font-size: 1.1em; margin-bottom: 10px;">התוכנית שהכנתי עבורך:</h3>
          <ul id="suggestedList" class="suggestions-list"></ul>
          <button id="approveBtn" class="action-btn" style="background-color: #3498db;">✅ אשר והוסף הכל לרשימה שלי</button>
        </div>

        <div style="text-align: center;">
          <button class="back-btn" onclick="window.location.href='manage.html'">🔙 חזרה לניהול הרגלים</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  
  <script src="firebase.js"></script>

  <script>
    // המפתח ששלחת לי
    const GEMINI_API_KEY = "AIzaSyAhOzuUV7gWvI86y_UDQbAS7WAU5IgnPSY";

    const goalInput = document.getElementById("goalInput");
    const generateBtn = document.getElementById("generateBtn");
    const loadingMsg = document.getElementById("loadingMsg");
    const previewArea = document.getElementById("previewArea");
    const suggestedList = document.getElementById("suggestedList");
    const approveBtn = document.getElementById("approveBtn");

    let currentSuggestions = [];
    let userId = null;

    // 1. בדיקת חיבור משתמש (חובה כדי לשמור ב-Firebase)
    auth.onAuthStateChanged(user => {
      if (!user) {
        console.log("משתמש לא מחובר, מפנה לדף כניסה");
        window.location.href = "index.html";
      } else {
        userId = user.uid;
        console.log("משתמש מחובר ב-AI Page:", userId);
      }
    });

    // 2. פונקציית הקריאה ל-Gemini
    async function getHabitsFromGemini(goal) {
      console.log("שולח בקשה לגוגל...");
      const prompt = `המטרה שלי היא: "${goal}". תחזיר בדיוק 5 הרגלים יומיים קצרים וספציפיים. החזר אך ורק פורמט JSON של מערך מחרוזות. דוגמה: ["הרגל 1", "הרגל 2"]. בלי שום טקסט נוסף.`;
      
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error.message || "שגיאה בתקשורת עם השרת");
      }

      const data = await response.json();
      let textResponse = data.candidates[0].content.parts[0].text;
      console.log("תשובה גולמית מה-AI:", textResponse);
      
      // ניקוי תגיות של JSON אם ה-AI הוסיף אותן
      const cleanJson = textResponse.replace(/```json/g, "").replace(/```/g, "").trim();
      return JSON.parse(cleanJson);
    }

    // 3. אירוע לחיצה על כפתור יצירה
    generateBtn.addEventListener("click", async () => {
      const goal = goalInput.value.trim();
      if (!goal) {
        alert("בבקשה רשום מטרה קודם.");
        return;
      }

      console.log("מתחיל תהליך יצירה...");
      loadingMsg.style.display = "block";
      generateBtn.disabled = true;
      previewArea.style.display = "none";

      try {
        currentSuggestions = await getHabitsFromGemini(goal);
        console.log("הרגלים שהתקבלו:", currentSuggestions);
        
        suggestedList.innerHTML = "";
        currentSuggestions.forEach(habit => {
          const li = document.createElement("li");
          li.textContent = habit;
          suggestedList.appendChild(li);
        });

        previewArea.style.display = "block";
      } catch (error) {
        console.error("שגיאה:", error);
        alert("אופס! קרתה שגיאה: " + error.message);
      } finally {
        loadingMsg.style.display = "none";
        generateBtn.disabled = false;
      }
    });

    // 4. שמירה ל-Firebase
    approveBtn.addEventListener("click", async () => {
      if (!userId || currentSuggestions.length === 0) return;

      console.log("מתחיל שמירה ל-Firebase...");
      const batch = db.batch();
      
      currentSuggestions.forEach(text => {
        const docRef = db.collection("users").doc(userId).collection("habits").doc();
        batch.set(docRef, {
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });

      try {
        await batch.commit();
        console.log("השמירה הצליחה!");
        alert("כל ההרגלים נוספו בהצלחה!");
        window.location.href = "manage.html";
      } catch (error) {
        console.error("שגיאת שמירה:", error);
        alert("שגיאה בשמירת הנתונים.");
      }
    });
  </script>
</body>
</html>
