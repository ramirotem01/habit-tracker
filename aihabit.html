<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker – עוזר AI</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ai-container { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .ai-card { padding: 30px !important; }
    h1 { margin-bottom: 10px; font-size: 1.8em; text-align: center; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: inherit; resize: none; font-size: 1em; outline: none; min-height: 100px; }
    .action-btn { background-color: #2ecc71; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em; transition: background 0.3s; margin-top: 10px; width: 100%; }
    .action-btn:hover { background-color: #27ae60; }
    .action-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    .back-btn { background: none; border: none; color: #34495e; padding: 8px 15px; border-radius: 20px; cursor: pointer; margin: 15px auto 0 auto; font-size: 0.9em; transition: all 0.3s ease; display: inline-block; width: fit-content; text-decoration: none; }
    .suggestions-list { list-style: none; padding: 0; margin: 20px 0; }
    .suggestions-list li { background: #f8f9fa; padding: 12px; margin-bottom: 8px; border-right: 4px solid #2ecc71; border-radius: 4px; font-size: 0.95em; text-align: right; }
    .loading-spinner { text-align: center; color: #7f8c8d; font-size: 0.9em; margin: 10px 0; display: none; }
  </style>
</head>
<body>
  <div class="app login-app">
    <h1>🤖 עוזר AI אישי</h1>
    <div class="card login-card ai-card">
      <p style="text-align: center; color: #666; margin-bottom: 20px;">רשום מטרה, ואני אמצא עבורך את המודל הנכון ואייצר הרגלים</p>
      
      <div class="ai-container">
        <textarea id="goalInput" placeholder="למשל: אני רוצה לרוץ 5 קילומטר..." rows="3"></textarea>
        <button id="generateBtn" class="action-btn">✨ צור תוכנית הרגלים</button>
        <div id="loadingMsg" class="loading-spinner">מתקשר עם גוגל... ⚡</div>
        <div id="previewArea" style="display: none;">
          <ul id="suggestedList" class="suggestions-list"></ul>
          <button id="approveBtn" class="action-btn" style="background-color: #3498db;">✅ אשר והוסף הכל</button>
        </div>
        <div style="text-align: center;">
          <button class="back-btn" onclick="window.location.href='manage.html'">🔙 חזרה</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    const GEMINI_API_KEY = "AIzaSyAhOzuUV7gWvI86y_UDQbAS7WAU5IgnPSY";
    let userId = null;

    auth.onAuthStateChanged(user => { if (!user) window.location.href = "index.html"; else userId = user.uid; });

    // פונקציה למציאת המודל הזמין הראשון
    async function getAvailableModel() {
        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}`);
            const data = await resp.json();
            // מחפש מודל שתומך ביצירת תוכן
            const model = data.models.find(m => m.supportedGenerationMethods.includes("generateContent"));
            return model ? model.name : "models/gemini-1.5-flash"; 
        } catch (e) {
            return "models/gemini-1.5-flash";
        }
    }

    async function generateWithAI(goal) {
      const modelName = await getAvailableModel();
      console.log("Using model:", modelName);

      const prompt = `המטרה שלי: "${goal}". תחזיר רשימת JSON של 5 הרגלים קצרים: ["הרגל 1", "הרגל 2", "הרגל 3", "הרגל 4", "הרגל 5"]. בלי הסברים.`;
      const url = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${GEMINI_API_KEY}`;

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error.message);

      let text = data.candidates[0].content.parts[0].text;
      return JSON.parse(text.replace(/```json/g, "").replace(/```/g, "").trim());
    }

    document.getElementById("generateBtn").addEventListener("click", async () => {
      const goal = document.getElementById("goalInput").value.trim();
      if (!goal) return;

      const btn = document.getElementById("generateBtn");
      const loader = document.getElementById("loadingMsg");
      const preview = document.getElementById("previewArea");

      btn.disabled = true;
      loader.style.display = "block";
      preview.style.display = "none";

      try {
        const habits = await generateWithAI(goal);
        const list = document.getElementById("suggestedList");
        list.innerHTML = "";
        habits.forEach(h => {
          const li = document.createElement("li");
          li.textContent = h;
          list.appendChild(li);
        });
        preview.style.display = "block";
        window.currentHabits = habits;
      } catch (error) {
        alert("שגיאה סופית: " + error.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    });

    document.getElementById("approveBtn").addEventListener("click", async () => {
      const batch = db.batch();
      window.currentHabits.forEach(text => {
        const ref = db.collection("users").doc(userId).collection("habits").doc();
        batch.set(ref, { text, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
      await batch.commit();
      window.location.href = "manage.html";
    });
  </script>
</body>
</html>
