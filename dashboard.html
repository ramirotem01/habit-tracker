<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד הרגלים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .goal-card { background: linear-gradient(135deg, #f1f9ff 0%, #ffffff 100%); border-right: 5px solid #3498db; text-align: center; padding: 20px !important; }
    #userGoalText { font-size: 1.3em; color: #2c3e50; font-weight: bold; font-style: italic; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    /* עיצוב רכיב הכרת תודה */
    .gratitude-card { background: #fffdf2; border-right: 5px solid #f1c40f; padding: 15px; }
    .gratitude-header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .gratitude-progress { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
    .gratitude-progress svg { transform: rotate(-90deg); width: 60px; height: 60px; }
    .gratitude-progress circle { fill: none; stroke-width: 6; stroke-linecap: round; }
    .bg-circle { stroke: #eee; }
    .fg-circle { stroke: #f1c40f; transition: stroke-dasharray 0.5s ease; stroke-dasharray: 0 157; }
    .count-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; font-size: 0.9em; color: #d4ac0d; }
    
    #gratitudeList { list-style: none; padding: 0; margin-top: 10px; border-top: 1px solid #f9e79f; }
    #gratitudeList li { padding: 5px 0; font-size: 0.95em; color: #7d6608; border-bottom: 1px dashed #fcf3cf; }
    #addGratitudeBtn { background: #f1c40f; color: white; border: none; border-radius: 5px; padding: 0 15px; cursor: pointer; font-weight: bold; font-size: 1.2em; }
    #addGratitudeBtn:disabled { background: #ccc; }
  </style>
</head>
<body>
  <div class="app">
    <h1>📊 דשבורד יומי</h1>
    
    <section class="card goal-card" id="goalSection" style="display: none;">
      <p id="userGoalText">טוען מטרה...</p>
    </section>

    <section class="card summary-card">
      <p>תאריך: <strong id="todayDate"></strong></p>
      <p>סה"כ משימות: <span id="totalHabits">0</span></p>
      <p>בוצעו היום: <span id="doneToday">0</span></p>
      <p>התקדמות: <span id="progressToday">0/0</span></p>
    </section>

    <section class="card">
      <h2>🗓 המשימות שלי להיום</h2>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <input type="text" id="tempHabitInput" placeholder="הוסף משימה להיום..." />
        <div style="display: flex; gap: 8px;">
          <button id="addTempHabitBtn" style="flex:1; background:#3498db; color:white; border:none; padding:10px; border-radius:5px;">➕ היום</button>
          <button id="addTomorrowHabitBtn" style="flex:1; background:#34495e; color:white; border:none; padding:10px; border-radius:5px;">🕒 מחר</button>
        </div>
      </div>
      <ul id="habitList"></ul>
    </section>

    <section class="card gratitude-card">
      <div class="gratitude-header">
        <div class="gratitude-progress">
          <svg><circle class="bg-circle" cx="30" cy="30" r="25"></circle><circle id="fgCircle" class="fg-circle" cx="30" cy="30" r="25"></circle></svg>
          <div id="gratitudeCount" class="count-text">0/3</div>
        </div>
        <div style="flex-grow: 1;">
          <h2 style="margin: 0; font-size: 1.1em;">רגע של הודיה ✨</h2>
          <div style="display: flex; gap: 5px; margin-top: 5px;">
            <input type="text" id="gratitudeInput" placeholder="על מה את/ה מודה?" style="flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 5px;" />
            <button id="addGratitudeBtn" type="button">+</button>
          </div>
        </div>
      </div>
      <ul id="gratitudeList"></ul> </section>

    <section class="card">
      <canvas id="habitsChart" width="400" height="200"></canvas>
    </section>

    <div class="actions">
      <button onclick="window.location.href='manage.html'">📝 ניהול</button>
      <button onclick="window.location.href='aihabit.html'" style="background: #2ecc71; color: white;">✨ AI</button>
      <button id="logoutBtn" style="background: #ff4b2b; color: white;">🚪 יציאה</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="firebase.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
