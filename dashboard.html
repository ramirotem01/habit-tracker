<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("PWA Ready"))
        .catch(err => console.log("PWA Error", err));
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד הרגלים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* --- עיצוב כותרת דשבורד חדשנית --- */
    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: flex-start; /* יישור לימין */
      gap: 12px;
      margin-bottom: 25px;
      padding-right: 5px;
    }
    
    .chart-icon-box {
      width: 42px;
      height: 42px;
      background: #3498db;
      border-radius: 10px; /* פינות מעוגלות קלות למראה מודרני */
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
      flex-shrink: 0; /* מונע מהריבוע להתעוות */
    }

    .chart-icon-box svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    h1 {
      margin: 0;
      font-size: 1.6em;
      color: #2c3e50;
    }

    /* תיקון עיגולים שיוצאים אליפסה */
    .task-progress-circle, .gratitude-circle {
      width: 65px !important;
      height: 65px !important;
      min-width: 65px;
      min-height: 65px;
      border-radius: 50% !important; /* עיגול מושלם */
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .gratitude-circle {
      width: 55px !important;
      height: 55px !important;
      min-width: 55px;
      min-height: 55px;
    }

    /* --- שאר העיצוב --- */
    .goal-card {
      background: linear-gradient(135deg, #f1f9ff 0%, #ffffff 100%);
      border-right: 5px solid #3498db;
      text-align: center;
      padding: 20px !important;
    }
    .summary-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 12px;
    }
    .nav-btn {
      background: #ffffff;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3498db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .button-row { display: flex; gap: 8px; }
    .button-row button { flex: 1; padding: 10px 5px; border-radius: 5px; border: none; color: white; cursor: pointer; }
    #addTempHabitBtn { background-color: #3498db; }
    #addTomorrowHabitBtn { background-color: #34495e; }
    .gratitude-list { list-style: none; padding: 0; }
    .gratitude-list li { background: #f9f9f9; margin-bottom: 5px; padding: 8px 12px; border-radius: 8px; border-right: 3px solid #f1c40f; }
  </style>
</head>
<body>
  <div class="app">
    
    <header class="dashboard-header">
      <div class="chart-icon-box">
        <svg viewBox="0 0 24 24">
          <path d="M5 19h14V5H5v14zm2-12h2v10H7V7zm4 4h2v6h-2v-6zm4-2h2v8h-2V9z"/>
        </svg>
      </div>
      <h1>דשבורד יומי</h1>
    </header>
    
    <section class="card goal-card" id="goalSection" style="display: none;">
      <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
        <h2 style="font-size: 0.9em; color: #7f8c8d; margin: 0;">היעד הגדול שלי:</h2>
        <a href="mygoal.html" style="text-decoration:none; font-size:1.2em;">✏️</a>
      </div>
      <p id="userGoalText" style="font-size: 1.3em; font-weight: bold; font-style: italic;">טוען מטרה...</p>
    </section>

    <section class="card summary-card">
      <div class="summary-info">
        <p>תאריך: <strong id="todayDate"></strong></p>
        <p>סה"כ משימות: <span id="totalHabits">0</span></p>
        <p>בוצעו היום: <span id="doneToday">0</span></p>
      </div>
      <div class="progress-circle-container">
        <div id="taskProgressCircle" class="task-progress-circle" style="border: 5px solid #eee; font-weight: bold; color: #3498db;">0%</div>
      </div>
    </section>

    <section class="card">
      <div class="date-nav">
        <button id="prevDayBtn" class="nav-btn"><span>&#10094;</span></button>
        <div style="flex: 1; text-align: center;">
            <h2 id="tasksTitle" style="margin: 0; font-size: 1.1em;">🗓 המשימות שלי להיום</h2>
        </div>
        <button id="nextDayBtn" class="nav-btn"><span>&#10095;</span></button>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px;">
        <input type="text" id="tempHabitInput" placeholder="הוסף משימה חד פעמית..." style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;" />
        <div class="button-row">
          <button id="addTempHabitBtn">➕ הוסף להיום</button>
          <button id="addTomorrowHabitBtn">🕒 למחר</button>
        </div>
      </div>
      <ul id="habitList" style="list-style: none; padding: 0;"></ul>
    </section>

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 style="margin: 0; font-size: 1.1em;">רגע של הודיה ✨</h2>
        <div id="gratitudeCircle" class="gratitude-circle" style="border: 4px solid #eee; font-weight: bold; font-size: 0.9em;">0/3</div>
      </div>
      <div style="display: flex; gap: 8px; margin-bottom: 10px;">
        <input type="text" id="gratitudeInput" placeholder="על מה אתה מודה?" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" />
        <button id="addGratitudeBtn" style="background: #f1c40f; color: white; border: none; border-radius: 8px; padding: 0 15px; cursor: pointer;">➕</button>
      </div>
      <ul id="gratitudeList" class="gratitude-list"></ul>
    </section>

    <section class="card">
      <h2>📈 התקדמות שבועית</h2>
      <canvas id="habitsChart" width="400" height="200"></canvas>
    </section>

    <div class="actions">
      <button onclick="window.location.href='manage.html'">📝 ניהול</button>
      <button onclick="window.location.href='aihabit.html'" style="background: #2ecc71; color: white;">✨ AI</button>
      <button onclick="window.location.href='anyls.html'" style="background: #9b59b6; color: white;">🧠 תובנות</button>
      <button id="logoutBtn" style="background: #ff4b2b; color: white;">🚪 התנתק</button>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="firebase.js"></script>

  <script>
    auth.onAuthStateChanged(user => {
      if (user) { loadUserGoal(user.uid); }
    });

    async function loadUserGoal(uid) {
      try {
        const snapshot = await db.collection("users").doc(uid).collection("goals")
          .orderBy("createdAt", "desc").limit(1).get();
        if (!snapshot.empty) {
          document.getElementById("userGoalText").textContent = `"${snapshot.docs[0].data().text}"`;
          document.getElementById("goalSection").style.display = "block";
        }
      } catch (e) { console.error(e); }
    }
  </script>
  <script src="dashboard.js"></script>
</body>
</html>
