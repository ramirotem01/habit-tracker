<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("PWA Ready"))
        .catch(err => console.log("PWA Error", err));
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">pcs365 - דשבורד</title>
  <link rel="stylesheet" href="style.css"> <style>
    body { 
        background: #f4f7f6; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; padding: 0; 
    }
    .app { max-width: 600px; margin: 0 auto; padding: 12px; box-sizing: border-box; }
    
    /* כותרות אחידות ומונעות ירידת שורה */
    h1, h2 { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        color: #2c3e50;
        white-space: nowrap;
    }

    h1 { text-align: center; margin-bottom: 15px; font-weight: 800; font-size: 1.9em; }

    /* כרטיסיות עם רווחים מצומצמים */
    .card {
      background: #ffffff;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px; /* הרווח המצומצם שביקשת */
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }

    /* כותרת היעד הגדול - מוגדלת */
    #ui-goal-label { 
        font-size: 1.15em !important; 
        color: #7f8c8d; 
        font-weight: 800;
        display: block;
        margin-bottom: 5px;
    }

    /* עיגול התקדמות ירוק מודרני */
    .task-progress-circle {
      width: 70px; height: 70px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.1em; background-color: #fff;
      border: 6px solid #2ecc71; /* ירוק במקום צהוב */
      color: #27ae60;
      flex-shrink: 0;
    }

    .date-nav { 
      display: flex; align-items: center; justify-content: space-between; 
      margin-bottom: 15px; background: #ffffff; padding: 8px 15px; border-radius: 50px;
    }

    .nav-btn {
      background: #ffffff; border: 1px solid #eee; border-radius: 50%;
      width: 38px; height: 38px; color: #3498db; display: flex; align-items: center; justify-content: center;
    }

    /* אופטימיזציה למובייל */
    @media (max-width: 400px) {
        h1 { font-size: 1.6em; }
        h2 { font-size: 1em !important; }
        .task-progress-circle { width: 60px; height: 60px; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 id="ui-dashboard-title"></h1>
    
    <section class="card goal-card" id="goalSection" style="display: none;">
      <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
        <span id="ui-goal-label"></span>
        <a href="mygoal.html" style="text-decoration:none;">✏️</a>
      </div>
      <p id="userGoalText"></p>
    </section>

    <section class="card summary-card" style="display: flex; justify-content: space-between; align-items: center;">
      <div class="summary-info">
        <p><span id="ui-date-label"></span> <strong id="todayDate"></strong></p>
        <p><span id="ui-total-label"></span> <strong id="totalHabits">0</strong></p>
        <p><span id="ui-done-label"></span> <strong id="doneToday">0</strong></p>
        <p><span id="ui-progress-label"></span> <strong id="progressToday">0/0</strong></p>
      </div>
      <div id="taskProgressCircle" class="task-progress-circle">0%</div>
    </section>

    <section class="card">
      <div class="date-nav">
        <button id="prevDayBtn" class="nav-btn">❮</button>
        <h2 id="tasksTitle" style="margin:0; font-weight: 800;"></h2>
        <button id="nextDayBtn" class="nav-btn">❯</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="tempHabitInput" style="padding: 14px; border-radius: 10px; border: 1px solid #ddd;" />
        <div style="display: flex; gap: 8px;">
          <button id="addTempHabitBtn" style="flex:1.2; background:#3498db; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;"></button>
          <button id="addTomorrowHabitBtn" style="flex:1; background:#34495e; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;"></button>
        </div>
      </div>
      <ul id="habitList" style="list-style: none; padding: 0; margin-top: 15px;"></ul>
    </section>

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="ui-gratitude-title" style="margin:0; font-weight: 800;"></h2>
        <div id="gratitudeCircle" class="gratitude-circle" style="width:50px; height:50px; border:4px solid #f1c40f; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">0/3</div>
      </div>
      <div id="gratitudeInputGroup" style="display: flex; gap: 8px;">
          <input type="text" id="gratitudeInput" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd;" />
          <button id="addGratitudeBtn" style="background: #f1c40f; color: white; border: none; border-radius: 8px; padding: 0 18px;">➕</button>
      </div>
      <ul id="gratitudeList" style="padding:0; list-style:none; margin-top:15px;"></ul>
    </section>

    <section class="card">
      <h2 id="ui-chart-title" style="margin-bottom: 10px; font-weight: 800;"></h2>
      <canvas id="habitsChart" width="400" height="200"></canvas>
    </section>

    <div class="actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px;">
      <button onclick="window.location.href='manage.html'" id="ui-btn-manage" style="padding:15px; border-radius:12px; border:none; color:white; background:#34495e; font-weight:bold;"></button>
      <button onclick="window.location.href='aihabit.html'" id="ui-btn-ai" style="padding:15px; border-radius:12px; border:none; color:white; background:#2ecc71; font-weight:bold;"></button>
      <button onclick="window.location.href='anyls.html'" id="ui-btn-stats" style="padding:15px; border-radius:12px; border:none; color:white; background:#9b59b6; font-weight:bold;"></button>
      <button id="logoutBtn" style="padding:15px; border-radius:12px; border:none; color:white; background:#e74c3c; font-weight:bold;"></button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="firebase.js"></script>
  <script>
    const translations = {
      he: {
        dashboardTitle: "📊 דשבורד יומי",
        goalLabel: "היעד הגדול שלי",
        dateLabel: "תאריך:",
        totalLabel: "סה\"כ משימות:",
        doneLabel: "בוצעו היום:",
        progressLabel: "התקדמות:",
        tasksTitleToday: "🗓 המשימות שלי להיום",
        tasksTitleTomorrow: "🕒 המשימות שלי למחר",
        addBtn: "➕ הוסף להיום",
        tomorrowBtn: "🕒 הוסף למחר",
        gratitudeTitle: "רגע של הודיה ✨",
        chartTitle: "📈 התקדמות שבועית",
        btnManage: "📝 ניהול הרגלים",
        btnAI: "✨ עוזר AI אישי",
        btnStats: "🧠 תובנות שבועיות",
        btnLogout: "🚪 התנתק"
      },
      en: {
        dashboardTitle: "📊 Daily Dashboard",
        goalLabel: "MY BIG GOAL",
        dateLabel: "Date:",
        totalLabel: "Total Tasks:",
        doneLabel: "Done Today:",
        progressLabel: "Progress:",
        tasksTitleToday: "🗓 Tasks for Today",
        tasksTitleTomorrow: "🕒 Tasks for Tomorrow",
        addBtn: "➕ Add Today",
        tomorrowBtn: "🕒 Add Tomorrow",
        gratitudeTitle: "Gratitude ✨",
        chartTitle: "📈 Weekly Progress",
        btnManage: "📝 Manage Habits",
        btnAI: "✨ Personal AI",
        btnStats: "🧠 Weekly Insights",
        btnLogout: "🚪 Logout"
      }
    };
    const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
    const t = translations[userLang];
    document.getElementById('ui-dashboard-title').innerText = t.dashboardTitle;
    document.getElementById('ui-goal-label').innerText = t.goalLabel;
    document.getElementById('ui-date-label').innerText = t.dateLabel;
    document.getElementById('ui-total-label').innerText = t.totalLabel;
    document.getElementById('ui-done-label').innerText = t.doneLabel;
    document.getElementById('ui-progress-label').innerText = t.progressLabel;
    document.getElementById('tasksTitle').innerText = t.tasksTitleToday;
    document.getElementById('addTempHabitBtn').innerText = t.addBtn;
    document.getElementById('addTomorrowHabitBtn').innerText = t.tomorrowBtn;
    document.getElementById('ui-gratitude-title').innerText = t.gratitudeTitle;
    document.getElementById('ui-chart-title').innerText = t.chartTitle;
    document.getElementById('ui-btn-manage').innerText = t.btnManage;
    document.getElementById('ui-btn-ai').innerText = t.btnAI;
    document.getElementById('ui-btn-stats').innerText = t.btnStats;
    document.getElementById('logoutBtn').innerText = t.btnLogout;
  </script>
  <script src="dashboard.js"></script>
</body>
</html>
