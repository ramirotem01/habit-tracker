<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3498db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("PWA Ready"))
        .catch(err => console.log("PWA Error", err));
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">דשבורד הרגלים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* עיצוב ייעודי לכרטיס המטרה */
    .goal-card {
      background: linear-gradient(135deg, #f1f9ff 0%, #ffffff 100%);
      border-inline-start: 5px solid #3498db; /* הופך ל-right בעברית ו-left באנגלית */
      text-align: center;
      padding: 20px !important;
      position: relative;
    }
    .goal-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .goal-card h2 {
      font-size: 0.9em;
      color: #7f8c8d;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .edit-goal-btn {
      text-decoration: none;
      font-size: 1.2em;
      color: #3498db;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .edit-goal-btn:hover {
      opacity: 0.7;
    }
    #userGoalText {
      font-size: 1.3em;
      color: #2c3e50;
      font-weight: bold;
      font-style: italic;
    }

    /* עיצוב כרטיס סיכום עם עיגול התקדמות */
    .summary-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-info {
      flex: 1;
    }
    .progress-circle-container {
      margin-inline-start: 15px;
    }
    .task-progress-circle {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1em;
      background-color: #fff;
      border: 5px solid #eee;
      transition: all 0.4s ease;
    }
    .task-circle-low { border-color: #f1c40f; color: #f39c12; }
    .task-circle-done { border-color: #2ecc71; color: #27ae60; background-color: #fafffa; }

    /* ניווט בין ימים */
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 12px;
    }
    .tasks-title-container {
      flex: 1;
      text-align: center;
    }
    .tasks-title-container h2 {
      margin: 0;
      font-size: 1.1em;
      color: #2c3e50;
    }
    .nav-btn {
      background: #ffffff;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      color: #3498db;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background: #3498db;
      color: #fff;
      transform: translateY(-2px);
    }
    .nav-btn:disabled {
      opacity: 0;
      cursor: not-allowed;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .input-group {
      display: flex;
      flex-direction: column; 
      gap: 8px;
    }
    .input-group input {
      width: 100%;
      box-sizing: border-box;
    }
    .button-row {
      display: flex;
      gap: 8px;
    }
    .button-row button {
      flex: 1;
      white-space: nowrap;
      padding: 10px 5px;
      font-size: 0.9em;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      color: white;
    }
    #addTempHabitBtn { background-color: #3498db; }
    #addTomorrowHabitBtn { background-color: #34495e; }

    /* הודיה */
    .gratitude-section {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
    }
    .gratitude-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .gratitude-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9em;
      background-color: #ffffff;
      border: 4px solid #eee;
    }
    .circle-low { border-color: #f1c40f; color: #f39c12; }
    .circle-full { border-color: #2ecc71; color: #27ae60; }
    
    .gratitude-list {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }
    .gratitude-list li {
      background: #f9f9f9;
      margin-bottom: 5px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95em;
      border-inline-start: 3px solid #f1c40f;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-text-span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 id="ui-dashboard-title"></h1>
    
    <section class="card goal-card" id="goalSection" style="display: none;">
      <div class="goal-header">
        <h2 id="ui-goal-label"></h2>
        <a href="mygoal.html" class="edit-goal-btn" id="ui-edit-goal-link">✏️</a>
      </div>
      <p id="userGoalText"></p>
    </section>

    <section class="card summary-card">
      <div class="summary-info">
        <p><span id="ui-date-label"></span> <strong id="todayDate"></strong></p>
        <p><span id="ui-total-label"></span> <span id="totalHabits">0</span></p>
        <p><span id="ui-done-label"></span> <span id="doneToday">0</span></p>
        <p><span id="ui-progress-label"></span> <span id="progressToday">0/0</span></p>
      </div>
      <div class="progress-circle-container">
        <div id="taskProgressCircle" class="task-progress-circle task-circle-low">0%</div>
      </div>
    </section>

    <section class="card">
      <div class="date-nav">
        <button id="prevDayBtn" class="nav-btn"><span>&#10094;</span></button>
        <div class="tasks-title-container">
            <h2 id="tasksTitle"></h2>
        </div>
        <button id="nextDayBtn" class="nav-btn"><span>&#10095;</span></button>
      </div>
      
      <div class="input-group">
        <input type="text" id="tempHabitInput" />
        <div class="button-row">
          <button id="addTempHabitBtn"></button>
          <button id="addTomorrowHabitBtn"></button>
        </div>
      </div>
      <ul id="habitList"></ul>
    </section>

    <section class="card gratitude-section">
      <div class="gratitude-header">
        <h2 id="ui-gratitude-title"></h2>
        <div id="gratitudeCircle" class="gratitude-circle circle-low">0/3</div>
      </div>
      <div id="gratitudeInputGroup" class="input-group">
        <div style="display: flex; gap: 8px;">
          <input type="text" id="gratitudeInput" style="flex: 1;" />
          <button id="addGratitudeBtn" style="background: #f1c40f; color: white; border: none; border-radius: 5px; padding: 0 15px; cursor: pointer;">➕</button>
        </div>
      </div>
      <ul id="gratitudeList" class="gratitude-list"></ul>
    </section>

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 id="ui-chart-title"></h2>
      </div>
      <canvas id="habitsChart" width="400" height="200"></canvas>
    </section>

    <div class="actions">
      <button onclick="window.location.href='manage.html'" id="ui-btn-manage"></button>
      <button onclick="window.location.href='aihabit.html'" style="background: #2ecc71; color: white;" id="ui-btn-ai"></button>
      <button onclick="window.location.href='anyls.html'" style="background: #9b59b6; color: white;" id="ui-btn-stats"></button>
      <button id="logoutBtn" style="background: #ff4b2b; color: white;"></button>
    </div>

    <div id="logBox" style="font-size: 12px; color: gray; margin-top: 20px;"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="firebase.js"></script>

  <script>
    const translations = {
      he: {
        pageTitle: "דשבורד הרגלים",
        dashboardTitle: "📊 דשבורד יומי",
        goalLabel: "היעד הגדול שלי:",
        goalLoading: "טוען מטרה...",
        dateLabel: "תאריך:",
        totalLabel: "סה\"כ משימות:",
        doneLabel: "בוצעו היום:",
        progressLabel: "התקדמות:",
        tasksTitleToday: "🗓 המשימות שלי להיום",
        tasksTitleTomorrow: "🕒 המשימות שלי למחר",
        tempInputPlaceholder: "הוסף משימה חד פעמית...",
        addBtn: "➕ הוסף לרשימה",
        tomorrowBtn: "🕒 תזמן למחר",
        gratitudeTitle: "רגע של הודיה ✨",
        gratitudePlaceholder: "על מה אתה מודה היום?",
        chartTitle: "📈 התקדמות שבועית",
        btnManage: "📝 ניהול הרגלים",
        btnAI: "✨ עוזר AI",
        btnStats: "🧠 תובנות שבועיות",
        btnLogout: "🚪 התנתק",
        editTooltip: "עדכן מטרה",
        navPrev: "חזור להיום",
        navNext: "עבור למחר"
      },
      en: {
        pageTitle: "Habit Dashboard",
        dashboardTitle: "📊 Daily Dashboard",
        goalLabel: "MY BIG GOAL:",
        goalLoading: "Loading goal...",
        dateLabel: "Date:",
        totalLabel: "Total Tasks:",
        doneLabel: "Done Today:",
        progressLabel: "Progress:",
        tasksTitleToday: "🗓 My Tasks for Today",
        tasksTitleTomorrow: "🕒 My Tasks for Tomorrow",
        tempInputPlaceholder: "Add a one-time task...",
        addBtn: "➕ Add to List",
        tomorrowBtn: "🕒 Schedule Tomorrow",
        gratitudeTitle: "Gratitude Moment ✨",
        gratitudePlaceholder: "What are you grateful for today?",
        chartTitle: "📈 Weekly Progress",
        btnManage: "📝 Manage Habits",
        btnAI: "✨ AI Assistant",
        btnStats: "🧠 Weekly Insights",
        btnLogout: "🚪 Logout",
        editTooltip: "Update Goal",
        navPrev: "Back to Today",
        navNext: "Go to Tomorrow"
      }
    };

    const userLang = navigator.language.startsWith('he') ? 'he' : 'en';
    const t = translations[userLang];

    document.documentElement.lang = userLang;
    document.documentElement.dir = (userLang === 'he') ? 'rtl' : 'ltr';

    // הזרקת טקסטים
    document.getElementById('page-title').innerText = t.pageTitle;
    document.getElementById('ui-dashboard-title').innerText = t.dashboardTitle;
    document.getElementById('ui-goal-label').innerText = t.goalLabel;
    document.getElementById('userGoalText').innerText = t.goalLoading;
    document.getElementById('ui-date-label').innerText = t.dateLabel;
    document.getElementById('ui-total-label').innerText = t.totalLabel;
    document.getElementById('ui-done-label').innerText = t.doneLabel;
    document.getElementById('ui-progress-label').innerText = t.progressLabel;
    document.getElementById('tasksTitle').innerText = t.tasksTitleToday;
    document.getElementById('tempHabitInput').placeholder = t.tempInputPlaceholder;
    document.getElementById('addTempHabitBtn').innerText = t.addBtn;
    document.getElementById('addTomorrowHabitBtn').innerText = t.tomorrowBtn;
    document.getElementById('ui-gratitude-title').innerText = t.gratitudeTitle;
    document.getElementById('gratitudeInput').placeholder = t.gratitudePlaceholder;
    document.getElementById('ui-chart-title').innerText = t.chartTitle;
    document.getElementById('ui-btn-manage').innerText = t.btnManage;
    document.getElementById('ui-btn-ai').innerText = t.btnAI;
    document.getElementById('ui-btn-stats').innerText = t.btnStats;
    document.getElementById('logoutBtn').innerText = t.btnLogout;
    document.getElementById('ui-edit-goal-link').title = t.editTooltip;
    document.getElementById('prevDayBtn').title = t.navPrev;
    document.getElementById('nextDayBtn').title = t.navNext;

    auth.onAuthStateChanged(user => {
      if (user) {
        loadUserGoal(user.uid);
      } else {
          window.location.href = "index.html";
      }
    });

    async function loadUserGoal(uid) {
      try {
        const snapshot = await db.collection("users").doc(uid)
          .collection("goals")
          .orderBy("createdAt", "desc")
          .limit(1)
          .get();

        if (!snapshot.empty) {
          const goalData = snapshot.docs[0].data();
          document.getElementById("userGoalText").textContent = `"${goalData.text}"`;
          document.getElementById("goalSection").style.display = "block";
        }
      } catch (e) {
        console.error("Error loading goal:", e);
      }
    }
  </script>
  <script src="dashboard.js"></script>
</body>
</html>
