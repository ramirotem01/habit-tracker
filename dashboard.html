<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4345/4345517.png">

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("PWA Ready"))
        .catch(err => console.log("PWA Error", err));
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="page-title">pcs365 - דשבורד</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { 
        background: #f8fafc; 
        font-family: system-ui, -apple-system, sans-serif; 
        margin: 0; padding: 0; 
        color: #1e293b;
    }
    .app { max-width: 600px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
    
    h1, h2 { 
        color: #0f172a;
        white-space: nowrap;
    }

    h1 { 
        text-align: center; 
        margin-bottom: 20px; 
        font-weight: 800; 
        font-size: 1.8em; 
        letter-spacing: -0.5px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
      box-sizing: border-box;
    }

    .goal-card {
      background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
      border-inline-start: 5px solid #3b82f6;
      text-align: center;
    }
    
    #ui-goal-label { 
        font-size: 0.9em; 
        color: #64748b; 
        text-transform: uppercase; 
        font-weight: 700;
        display: block;
        margin-bottom: 5px;
    }

    #userGoalText { font-size: 1.2em; color: #1e293b; font-weight: 700; margin-top: 5px; }

    .summary-card { display: flex; justify-content: space-between; align-items: center; }
    .summary-info p { margin: 4px 0; color: #475569; font-size: 0.95em; }

    /* עיגולי התקדמות - גרסה יציבה ומודרנית */
    .task-progress-circle, .gratitude-circle {
      width: 75px; height: 75px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.1em; background-color: #fff;
      /* אפקט טבעת מודרני בלי צהוב */
      border: 6px solid #e2e8f0; 
      transition: all 0.4s ease;
      flex-shrink: 0;
      color: #3b82f6;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.1);
    }

    /* כשהמשימה הושלמה או בתהליך - הצבע משתנה לכחול/אינדיגו עמוק */
    .task-progress-circle { border-color: #3b82f6; }
    .gratitude-circle { border-color: #8b5cf6; color: #8b5cf6; }

    .date-nav { 
      display: flex; align-items: center; justify-content: space-between; 
      margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 50px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .nav-btn {
      background: #f1f5f9; border: none; border-radius: 50%;
      width: 36px; height: 36px; cursor: pointer;
      color: #3b82f6; display: flex; align-items: center; justify-content: center;
    }

    #habitList { list-style: none; padding: 0; margin-top: 15px; }
    #habitList li {
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; padding: 14px; border-radius: 12px;
      margin-bottom: 8px; border: 1px solid #f1f5f9;
    }
    
    .custom-cb {
      width: 24px; height: 24px; border: 2px solid #cbd5e1; border-radius: 6px;
      margin-inline-end: 12px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all 0.2s; flex-shrink: 0;
    }
    .custom-cb.checked { background: #10b981; border-color: #10b981; }
    .custom-cb.checked::after { content: '✓'; color: white; font-weight: bold; }

    .task-text-span { flex: 1; color: #334155; font-weight: 500; }
    .task-text-span.done { text-decoration: line-through; color: #94a3b8; }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .actions button {
      padding: 15px 5px; border-radius: 12px; border: none; color: white;
      font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 0.9em;
    }
    
    #ui-btn-manage { background-color: #1e293b; }
    #ui-btn-ai { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    #ui-btn-stats { background-color: #64748b; }
    #logoutBtn { background-color: #fee2e2; color: #ef4444; }

    .gratitude-list li {
        background: #fafaf9; margin-bottom: 6px; padding: 10px;
        border-radius: 8px; border-inline-start: 4px solid #8b5cf6;
    }

    @media (max-width: 400px) {
        h1 { font-size: 1.5em; }
        h2 { font-size: 1em !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 id="ui-dashboard-title"></h1>
    
    <section class="card goal-card" id="goalSection" style="display: none;">
      <div style="display: flex; justify-content: center; align-items: center; gap: 10px;">
        <span id="ui-goal-label"></span>
        <a href="mygoal.html" style="text-decoration:none;">✏️</a>
      </div>
      <p id="userGoalText"></p>
    </section>

    <section class="card summary-card">
      <div class="summary-info">
        <p><span id="ui-date-label"></span> <strong id="todayDate"></strong></p>
        <p><span id="ui-total-label"></span> <strong id="totalHabits">0</strong></p>
        <p><span id="ui-done-label"></span> <strong id="doneToday">0</strong></p>
        <p><span id="ui-progress-label"></span> <strong id="progressToday">0/0</strong></p>
      </div>
      <div id="taskProgressCircle" class="task-progress-circle">0%</div>
    </section>

    <section class="card">
      <div class="date-nav">
        <button id="prevDayBtn" class="nav-btn">❮</button>
        <h2 id="tasksTitle" style="margin:0; font-weight: 700;"></h2>
        <button id="nextDayBtn" class="nav-btn">❯</button>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="tempHabitInput" style="padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 16px; outline: none;" />
        <div style="display: flex; gap: 8px;">
          <button id="addTempHabitBtn" style="flex:1.2; background:#3b82f6; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;"></button>
          <button id="addTomorrowHabitBtn" style="flex:1; background:#1e293b; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold;"></button>
        </div>
      </div>
      <ul id="habitList"></ul>
    </section>

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2 id="ui-gratitude-title" style="margin:0; font-weight: 700;"></h2>
        <div id="gratitudeCircle" class="gratitude-circle">0/3</div>
      </div>
      <div id="gratitudeInputGroup" style="display: flex; gap: 8px;">
          <input type="text" id="gratitudeInput" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 16px;" />
          <button id="addGratitudeBtn" style="background: #8b5cf6; color: white; border: none; border-radius: 10px; padding: 0 18px; cursor: pointer;">➕</button>
      </div>
      <ul id="gratitudeList" class="gratitude-list" style="padding:0; list-style:none; margin-top:15px;"></ul>
    </section>

    <div class="actions">
      <button onclick="window.location.href='manage.html'" id="ui-btn-manage"></button>
      <button onclick="window.location.href='aihabit.html'" id="ui-btn-ai"></button>
      <button onclick="window.location.href='anyls.html'" id="ui-btn-stats"></button>
      <button id="logoutBtn"></button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="firebase.js"></script>
  <script>
    const translations = {
      he: {
        pageTitle: "pcs365 - דשבורד",
        dashboardTitle: "📊 דשבורד יומי",
        goalLabel: "היעד הגדול שלי",
        dateLabel: "תאריך:",
        totalLabel: "סה\"כ משימות:",
        doneLabel: "בוצעו היום:",
        progressLabel: "התקדמות:",
        tasksTitleToday: "🗓 המשימות שלי להיום",
        tasksTitleTomorrow: "🕒 המשימות שלי למחר",
        tempInputPlaceholder: "הוסף משימה...",
        addBtn: "➕ להיום",
        tomorrowBtn: "🕒 למחר",
        gratitudeTitle: "רגע של הודיה ✨",
        gratitudePlaceholder: "על מה את/ה מודה היום?",
        chartTitle: "📈 התקדמות שבועית",
        btnManage: "📝 ניהול",
        btnAI: "✨ AI",
        btnStats: "🧠 תובנות",
        btnLogout: "התנתק"
      }
    };
    const t = translations.he;
    document.getElementById('page-title').innerText = t.pageTitle;
    document.getElementById('ui-dashboard-title').innerText = t.dashboardTitle;
    document.getElementById('ui-goal-label').innerText = t.goalLabel;
    document.getElementById('ui-date-label').innerText = t.dateLabel;
    document.getElementById('ui-total-label').innerText = t.totalLabel;
    document.getElementById('ui-done-label').innerText = t.doneLabel;
    document.getElementById('ui-progress-label').innerText = t.progressLabel;
    document.getElementById('tasksTitle').innerText = t.tasksTitleToday;
    document.getElementById('tempHabitInput').placeholder = t.tempInputPlaceholder;
    document.getElementById('addTempHabitBtn').innerText = t.addBtn;
    document.getElementById('addTomorrowHabitBtn').innerText = t.tomorrowBtn;
    document.getElementById('ui-gratitude-title').innerText = t.gratitudeTitle;
    document.getElementById('gratitudeInput').placeholder = t.gratitudePlaceholder;
    document.getElementById('ui-btn-manage').innerText = t.btnManage;
    document.getElementById('ui-btn-ai').innerText = t.btnAI;
    document.getElementById('ui-btn-stats').innerText = t.btnStats;
    document.getElementById('logoutBtn').innerText = t.btnLogout;
  </script>
  <script src="dashboard.js"></script>
</body>
</html>
