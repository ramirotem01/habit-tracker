<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אנליטיקה PRO - Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .analytics-container { display: flex; flex-direction: column; gap: 20px; }
    .ai-response {
      background: white; padding: 25px; border-radius: 12px;
      line-height: 1.8; border-right: 6px solid #9b59b6;
      display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 1.1em; color: #2c3e50;
    }
    .loading-container { text-align: center; padding: 40px; display: none; }
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #9b59b6;
      border-radius: 50%; width: 45px; height: 45px;
      animation: spin 1s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .action-btn-ai {
      background-color: #9b59b6; color: white; border: none; padding: 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2em;
      width: 100%; transition: all 0.3s ease;
    }
    .action-btn-ai:hover { background-color: #8e44ad; transform: translateY(-2px); }
    .recommendation-box {
      margin-top: 25px; padding: 20px; background: #fbf9ff;
      border-radius: 10px; border: 2px dashed #9b59b6; text-align: center; display: none;
    }
    .suggested-habit-title { color: #8e44ad; font-weight: bold; margin-bottom: 5px; font-size: 1.2em; }
    .add-habit-btn {
      background-color: #2ecc71; color: white; border: none; padding: 12px 25px;
      border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>🧠 ניתוח עומק PRO</h1>
    <div class="analytics-container">
      <section class="card">
        <h3 style="text-align: center;">ניתוח כלל המידע הקיים</h3>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">המערכת תסרוק את כל ההיסטוריה שלך עד ליום הראשון ותוציא תובנות עומק והרגל לשיפור.</p>
        <button id="analyzeBtn" class="action-btn-ai">✨ בצע אנליזה כוללת</button>
      </section>

      <div id="loadingArea" class="loading-container">
        <div class="loader"></div>
        <p id="loadingStatus">אוסף נתונים היסטוריים... 📊</p>
      </div>

      <div id="resultArea" class="ai-response">
        <div id="aiTextContent"></div>
        <div id="recommendationBox" class="recommendation-box">
          <div class="suggested-habit-title">🎯 ההרגל הממוקד שמומלץ לך לאמץ:</div>
          <p id="suggestedHabitText" style="font-weight: bold; font-size: 1.2em; color: #2c3e50;"></p>
          <button id="addHabitBtn" class="add-habit-btn">➕ הוסף כהרגל קבוע</button>
        </div>
      </div>

      <div class="actions">
        <button onclick="window.location.href='dashboard.html'" style="width: 100%; background-color: #34495e;">🏠 חזרה לדשבורד</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;
    let currentRecommendedHabit = "";

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else userId = user.uid;
    });

    async function fetchApiKey() {
      const doc = await db.collection("system_config").doc("gemini_settings").get();
      return doc.exists ? doc.data().apiKey : null;
    }

    async function getAvailableModel(apiKey) {
      try {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await resp.json();
        const model = data.models.find(m => m.supportedGenerationMethods.includes("generateContent"));
        return model ? model.name : "models/gemini-1.5-flash"; 
      } catch (e) { return "models/gemini-1.5-flash"; }
    }

    async function collectAllTimeData() {
      const now = new Date();
      let goal = "שיפור עצמי";
      
      const goalSnap = await db.collection("users").doc(userId).collection("goals").orderBy("createdAt", "desc").limit(1).get();
      if (!goalSnap.empty) goal = goalSnap.docs[0].data().text;

      const dailyDetails = [];
      const baseSnap = await db.collection("users").doc(userId).collection("habits").get();
      const baseHabitNames = baseSnap.docs.map(doc => doc.data().text);

      let dayOffset = 1;
      let keepGoing = true;
      const maxDays = 100; // בטיחות כדי שלא יכנס ללולאה אינסופית

      while (keepGoing && dayOffset <= maxDays) {
        const d = new Date();
        d.setDate(now.getDate() - dayOffset);
        const dateId = d.toISOString().split('T')[0];
        
        const statsDoc = await db.collection("users").doc(userId).collection("stats").doc(dateId).get();
        const tempSnap = await db.collection("users").doc(userId).collection("daily").doc(dateId).collection("tempHabits").get();

        // אם אין סטטיסטיקה ואין משימות זמניות - סימן שהגענו לסוף המידע
        if (!statsDoc.exists && tempSnap.empty) {
          keepGoing = false;
          break;
        }

        const dailyStats = statsDoc.exists ? statsDoc.data() : {};
        const dayTasks = [];
        
        baseHabitNames.forEach(name => {
           const done = dailyStats[name] === true;
           dayTasks.push(`${name} (קבוע) - ${done ? 'בוצע ✅' : 'לא בוצע ❌'}`);
        });

        tempSnap.forEach(t => {
          const taskText = t.data().text;
          const done = dailyStats[taskText] === true;
          dayTasks.push(`${taskText} (זמני) - ${done ? 'בוצע ✅' : 'לא בוצע ❌'}`);
        });

        dailyDetails.push({ date: dateId, tasks: dayTasks });
        dayOffset++;
      }
      
      return { goal, dailyDetails };
    }

    async function generateAnalytics() {
      const btn = document.getElementById("analyzeBtn");
      const loader = document.getElementById("loadingArea");
      const resultArea = document.getElementById("resultArea");
      const recBox = document.getElementById("recommendationBox");
      const textContent = document.getElementById("aiTextContent");

      btn.disabled = true;
      loader.style.display = "block";
      resultArea.style.display = "none";

      try {
        const apiKey = await fetchApiKey();
        const data = await collectAllTimeData();

        if (data.dailyDetails.length < 3) {
          textContent.innerHTML = `<p>אין מספיק מידע היסטורי כדי לבצע ניתוח עומק. המשך להשתמש באפליקציה וחזור לכאן כשיצטברו לפחות 3 ימי פעילות.</p>`;
          resultArea.style.display = "block";
          loader.style.display = "none";
          btn.disabled = false;
          return;
        }

        const modelName = await getAvailableModel(apiKey);
        
        const prompt = `אתה מאמן ביצועים ואנליסט נתונים. 
          המטרה של המשתמש: "${data.goal}". 
          להלן כל המידע הקיים במערכת על הביצועים שלו (משימות והרגלים):
          ${JSON.stringify(data.dailyDetails)}

          המשימה שלך:
          1. בצע ניתוח עומק על בסיס כל המידע. זהה מגמות ארוכות טווח ודפוסים שחוזרים על עצמם.
          2. תן "שיקוף" חכם למשתמש על היכולות שלו ועל המקומות שבהם הוא מאבד ריכוז או עקביות.
          3. אל תשתמש ברשימות. כתוב פסקאות זורמות ומניעות לפעולה.
          4. על בסיס כל התובנות הללו, הוצא המלצה להרגל אחד חדש (לא משימה חד פעמית, אלא הרגל) שישפר משמעותית את היכולות של המשתמש ביחס למטרה שלו.
          5. ההרגל חייב להיות ממוקד, קצר ופרקטי.
          
          חשוב מאוד: את ההרגל בלבד כתוב בסוף התשובה אחרי המילה "HABIT:".`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();
        
        if (resData.error) {
          throw new Error(`שגיאת API: ${resData.error.message}`);
        }

        if (resData.candidates && resData.candidates[0].content) {
          let fullText = resData.candidates[0].content.parts[0].text;
          const parts = fullText.split("HABIT:");
          const feedback = parts[0].replace(/\*/g, '').trim();
          currentRecommendedHabit = parts[1] ? parts[1].trim() : "";

          textContent.innerHTML = feedback.split('\n').map(p => `<p>${p}</p>`).join('');
          
          if (currentRecommendedHabit) {
            document.getElementById("suggestedHabitText").textContent = currentRecommendedHabit;
            recBox.style.display = "block";
          }
          resultArea.style.display = "block";
        }
      } catch (err) { 
        alert("שגיאה בניתוח: " + err.message); 
      } finally { 
        loader.style.display = "none"; 
        btn.disabled = false; 
      }
    }

    async function addSuggestedHabit() {
      if (!currentRecommendedHabit || !userId) return;
      
      try {
        await db.collection("users").doc(userId).collection("habits").add({
          text: currentRecommendedHabit,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("ההרגל התווסף בהצלחה לרשימה הקבועה שלך!");
        document.getElementById("addHabitBtn").disabled = true;
      } catch (e) { 
        alert("שגיאה בשמירה"); 
      }
    }

    document.getElementById("analyzeBtn").addEventListener("click", generateAnalytics);
    document.getElementById("addHabitBtn").addEventListener("click", addSuggestedHabit);
  </script>
</body>
</html>
