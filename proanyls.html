<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אנליטיקת עומק PRO - Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .analytics-container { display: flex; flex-direction: column; gap: 20px; }
    .ai-response {
      background: white; padding: 25px; border-radius: 12px;
      line-height: 1.8; border-right: 6px solid #9b59b6;
      display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 1.1em; color: #2c3e50;
    }
    .error-box {
      background: #fee; border: 1px solid #f88; padding: 15px;
      border-radius: 8px; color: #a00; display: none; margin: 10px 0;
    }
    .loading-container { text-align: center; padding: 40px; display: none; }
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #9b59b6;
      border-radius: 50%; width: 45px; height: 45px;
      animation: spin 1s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .action-btn-pro {
      background-color: #9b59b6; color: white; border: none; padding: 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2em;
      width: 100%; transition: all 0.3s ease;
    }
    .action-btn-pro:hover { background-color: #8e44ad; transform: translateY(-2px); }
    .recommendation-box {
      margin-top: 25px; padding: 20px; background: #fbf9ff;
      border-radius: 10px; border: 2px dashed #9b59b6; text-align: center; display: none;
    }
    .suggested-habit-title { color: #8e44ad; font-weight: bold; margin-bottom: 5px; font-size: 1.2em; }
    .add-habit-btn {
      background-color: #2ecc71; color: white; border: none; padding: 12px 25px;
      border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>💎 ניתוח עומק PRO</h1>
    <div class="analytics-container">
      <section class="card">
        <h3 style="text-align: center;">תובנות היסטוריות כוללות</h3>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">המערכת תסרוק את כל נתוני המעקב שלך כדי לזהות דפוסים והרגלי מפתח.</p>
        <button id="analyzeBtn" class="action-btn-pro">🔍 בצע ניתוח עומק</button>
      </section>

      <div id="errorArea" class="error-box"></div>

      <div id="loadingArea" class="loading-container">
        <div class="loader"></div>
        <p id="loadingStatus">אוסף נתונים מההיסטוריה... 🧬</p>
      </div>

      <div id="resultArea" class="ai-response">
        <div id="aiTextContent"></div>
        <div id="recommendationBox" class="recommendation-box">
          <div class="suggested-habit-title">🎯 ההרגל החדש שמומלץ לאמץ:</div>
          <p id="suggestedHabitText" style="font-weight: bold; font-size: 1.2em; color: #2c3e50;"></p>
          <button id="addHabitBtn" class="add-habit-btn">✅ אמץ כהרגל קבוע</button>
        </div>
      </div>

      <div class="actions">
        <button onclick="window.location.href='dashboard.html'" style="width: 100%; background-color: #34495e;">🏠 חזרה לדשבורד</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;
    let currentRecommendedHabit = "";

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else userId = user.uid;
    });

    async function fetchApiKey() {
      const doc = await db.collection("system_config").doc("gemini_settings").get();
      return doc.exists ? doc.data().apiKey : null;
    }

    async function collectFormattedHistory() {
      let goal = "שיפור עצמי";
      const goalSnap = await db.collection("users").doc(userId).collection("goals").orderBy("createdAt", "desc").limit(1).get();
      if (!goalSnap.empty) goal = goalSnap.docs[0].data().text;

      // שליפת הרגלים קבועים
      const habitsSnap = await db.collection("users").doc(userId).collection("habits").get();
      const habitNames = habitsSnap.docs.map(doc => doc.data().text);

      // שליפת כל הסטטיסטיקות (Stats)
      const statsSnap = await db.collection("users").doc(userId).collection("stats").get();
      
      let historyString = "";
      statsSnap.forEach(doc => {
        const dateId = doc.id;
        const dailyData = doc.data();
        let daySummary = `תאריך ${dateId}: `;
        
        // מעבר על ההרגלים שבוצעו באותו יום
        const tasks = Object.entries(dailyData).map(([name, done]) => {
          return `${name} (${done ? 'בוצע ✅' : 'לא בוצע ❌'})`;
        });
        
        historyString += daySummary + tasks.join(", ") + "\n";
      });

      return { goal, historyString, habitsCount: habitsSnap.size, historyCount: statsSnap.size };
    }

    async function generateProAnalytics() {
      const btn = document.getElementById("analyzeBtn");
      const loader = document.getElementById("loadingArea");
      const errorArea = document.getElementById("errorArea");
      const resultArea = document.getElementById("resultArea");
      const textContent = document.getElementById("aiTextContent");
      const recBox = document.getElementById("recommendationBox");

      // Reset UI
      btn.disabled = true;
      errorArea.style.display = "none";
      resultArea.style.display = "none";
      loader.style.display = "block";

      try {
        const apiKey = await fetchApiKey();
        if (!apiKey) throw new Error("מפתח API לא נמצא במערכת");

        const data = await collectFormattedHistory();

        if (data.historyCount < 3) {
          throw new Error("צריך לפחות 3 ימי פעילות בהיסטוריה כדי לבצע ניתוח עומק.");
        }

        const prompt = `אתה מאמן ביצועים מומחה. 
          המטרה של המשתמש: "${data.goal}".
          להלן כל היסטוריית המעקב של המשתמש (משימות והרגלים שבוצעו):
          ${data.historyString}

          המשימה שלך:
          1. נתח דפוסים ארוכי טווח והקשר בין הפעולות למטרה.
          2. תן למשתמש תובנה אחת משמעותית על אופן הפעולה שלו.
          3. נסח הכל בפסקאות זורמות, מעוררות השראה וללא רשימות.
          4. בסוף, הצע הרגל קבוע אחד חדש (ממוקד ובקצרה) שיעזור לו להשיג את המטרה טוב יותר.
          
          את שם ההרגל בלבד כתוב בסוף אחרי המילה "HABIT:".`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();
        if (resData.error) throw new Error(resData.error.message);

        if (resData.candidates && resData.candidates[0].content) {
          let fullText = resData.candidates[0].content.parts[0].text;
          const parts = fullText.split("HABIT:");
          
          const feedback = parts[0].replace(/\*/g, '').trim();
          currentRecommendedHabit = parts[1] ? parts[1].trim() : "";

          textContent.innerHTML = feedback.split('\n').map(p => `<p>${p}</p>`).join('');
          
          if (currentRecommendedHabit) {
            document.getElementById("suggestedHabitText").textContent = currentRecommendedHabit;
            recBox.style.display = "block";
          }
          resultArea.style.display = "block";
        } else {
          throw new Error("ה-AI לא החזיר תשובה תקינה.");
        }

      } catch (err) {
        console.error(err);
        errorArea.textContent = "שגיאה: " + err.message;
        errorArea.style.display = "block";
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }

    async function addSuggestedHabit() {
      if (!currentRecommendedHabit || !userId) return;
      try {
        await db.collection("users").doc(userId).collection("habits").add({
          text: currentRecommendedHabit,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("ההרגל התווסף בהצלחה!");
        document.getElementById("addHabitBtn").disabled = true;
      } catch (e) {
        alert("שגיאה בשמירה");
      }
    }

    document.getElementById("analyzeBtn").addEventListener("click", generateProAnalytics);
    document.getElementById("addHabitBtn").addEventListener("click", addSuggestedHabit);
  </script>
</body>
</html>
