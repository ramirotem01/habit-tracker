<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אנליטיקת עומק פרו - Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .analytics-container { display: flex; flex-direction: column; gap: 20px; }
    .ai-response {
      background: white; padding: 25px; border-radius: 12px;
      line-height: 1.8; border-right: 6px solid #9b59b6;
      display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 1.1em; color: #2c3e50;
    }
    .loading-container { text-align: center; padding: 40px; display: none; }
    .loader {
      border: 4px solid #f3f3f3; border-top: 4px solid #9b59b6;
      border-radius: 50%; width: 45px; height: 45px;
      animation: spin 1s linear infinite; margin: 0 auto 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .action-btn-pro {
      background-color: #9b59b6; color: white; border: none; padding: 16px;
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.2em;
      width: 100%; transition: all 0.3s ease;
    }
    .action-btn-pro:hover { background-color: #8e44ad; transform: translateY(-2px); }
    .recommendation-box {
      margin-top: 25px; padding: 20px; background: #fbf9ff;
      border-radius: 10px; border: 2px dashed #9b59b6; text-align: center; display: none;
    }
    .suggested-habit-title { color: #8e44ad; font-weight: bold; margin-bottom: 5px; font-size: 1.2em; }
    .add-habit-btn {
      background-color: #2ecc71; color: white; border: none; padding: 12px 25px;
      border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>💎 ניתוח עומק PRO</h1>
    <div class="analytics-container">
      <section class="card">
        <h3 style="text-align: center;">תובנות היסטוריות כוללות</h3>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">המערכת תסרוק את כל נתוני המעקב שלך מאז ומתמיד כדי לזהות את המפתח להצלחה שלך.</p>
        <button id="analyzeBtn" class="action-btn-pro">🔍 בצע ניתוח עומק</button>
      </section>

      <div id="loadingArea" class="loading-container">
        <div class="loader"></div>
        <p>סורק היסטוריית ביצועים ומנתח מגמות ארוכות טווח... 🧬</p>
      </div>

      <div id="resultArea" class="ai-response">
        <div id="aiTextContent"></div>
        <div id="recommendationBox" class="recommendation-box">
          <div class="suggested-habit-title">🎯 ההרגל החדש שישנה לך את התמונה:</div>
          <p id="suggestedHabitText" style="font-weight: bold; font-size: 1.2em; color: #2c3e50;"></p>
          <button id="addHabitBtn" class="add-habit-btn">✅ אמץ את ההרגל הקבוע</button>
        </div>
      </div>

      <div class="actions">
        <button onclick="window.location.href='dashboard.html'" style="width: 100%; background-color: #34495e;">🏠 חזרה לדשבורד</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let userId = null;
    let currentRecommendedHabit = "";

    auth.onAuthStateChanged(user => {
      if (!user) window.location.href = "index.html";
      else userId = user.uid;
    });

    async function fetchApiKey() {
      const doc = await db.collection("system_config").doc("gemini_settings").get();
      return doc.exists ? doc.data().apiKey : null;
    }

    async function collectAllTimeData() {
      let goal = "שיפור עצמי";
      const goalSnap = await db.collection("users").doc(userId).collection("goals").orderBy("createdAt", "desc").limit(1).get();
      if (!goalSnap.empty) goal = goalSnap.docs[0].data().text;

      // איסוף כל הסטטיסטיקות הקיימות
      const statsSnap = await db.collection("users").doc(userId).collection("stats").get();
      const allHistory = [];
      statsSnap.forEach(doc => {
        allHistory.push({ date: doc.id, stats: doc.data() });
      });

      // איסוף שמות ההרגלים הקבועים
      const habitsSnap = await db.collection("users").doc(userId).collection("habits").get();
      const habitNames = habitsSnap.docs.map(doc => doc.data().text);

      return { goal, allHistory, habitNames };
    }

    async function generateProAnalytics() {
      const btn = document.getElementById("analyzeBtn");
      const loader = document.getElementById("loadingArea");
      const resultArea = document.getElementById("resultArea");
      const recBox = document.getElementById("recommendationBox");
      const textContent = document.getElementById("aiTextContent");

      btn.disabled = true;
      loader.style.display = "block";
      resultArea.style.display = "none";

      try {
        const apiKey = await fetchApiKey();
        const data = await collectAllTimeData();

        if (data.allHistory.length < 5) {
          textContent.innerHTML = `<p>ניתוח העומק דורש לפחות 5 ימי פעילות מצטברים בהיסטוריה שלך. המשך לעקוב אחר ההרגלים שלך וחזור לכאן בקרוב!</p>`;
          resultArea.style.display = "block";
          loader.style.display = "none";
          btn.disabled = false;
          return;
        }

        const prompt = `אתה אנליסט ביצועים בכיר ומאמן מנטלי.
          המטרה הגדולה של המשתמש: "${data.goal}".
          רשימת ההרגלים הקבועים הנוכחית: ${data.habitNames.join(", ")}.
          להלן כל היסטוריית הביצועים (תאריכים ומה בוצע/לא בוצע):
          ${JSON.stringify(data.allHistory)}

          המשימה שלך:
          1. זהה דפוסים ארוכי טווח: באילו ימים הוא חזק? איפה הוא נחלש? מה הקשר בין הרגלים מסוימים לאחרים?
          2. תן ניתוח עומק פסיכולוגי על הדרך שלו למטרה. אל תהיה שטחי.
          3. תן תובנה אחת משנת חיים המבוססת על המידע שנאסף.
          4. בסוף, הצע הרגל קבוע חדש (HABIT) שיתווסף לרשימה שלו. ההרגל חייב להיות קצר, ממוקד מאוד ובקשר ישיר למטרה שלו ולחולשות שעלו בניתוח.
          
          חשוב: את שם ההרגל המוצע בלבד כתוב בסוף התשובה אחרי המילה "HABIT:".`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const resData = await response.json();
        
        if (resData.candidates && resData.candidates[0].content) {
          let fullText = resData.candidates[0].content.parts[0].text;
          const parts = fullText.split("HABIT:");
          const feedback = parts[0].replace(/\*/g, '').trim();
          currentRecommendedHabit = parts[1] ? parts[1].trim() : "";

          textContent.innerHTML = feedback.split('\n').map(p => `<p>${p}</p>`).join('');
          
          if (currentRecommendedHabit) {
            document.getElementById("suggestedHabitText").textContent = currentRecommendedHabit;
            recBox.style.display = "block";
          }
          resultArea.style.display = "block";
        }
      } catch (err) {
        alert("שגיאה בניתוח: " + err.message);
      } finally {
        loader.style.display = "none";
        btn.disabled = false;
      }
    }

    async function addSuggestedHabit() {
      if (!currentRecommendedHabit || !userId) return;
      
      try {
        await db.collection("users").doc(userId).collection("habits").add({
          text: currentRecommendedHabit,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("ההרגל הקבוע התווסף בהצלחה לרשימה שלך!");
        document.getElementById("addHabitBtn").disabled = true;
      } catch (e) { alert("שגיאה בשמירה"); }
    }

    document.getElementById("analyzeBtn").addEventListener("click", generateProAnalytics);
    document.getElementById("addHabitBtn").addEventListener("click", addSuggestedHabit);
  </script>
</body>
</html>
