<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quest - האתגר היומי</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007aff;
            --accent: #ff2d55;
            --bg: #eef7ff;
            --card-white: #ffffff;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#d1e9ff 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
        }

        /* כותרת בסגנון Level Up */
        .level-up-title {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            text-shadow: 3px 3px 0px #fff, 6px 6px 0px rgba(0,122,255,0.2);
            margin-bottom: 5px;
        }

        .subtitle {
            font-weight: 400;
            color: #5580aa;
            margin-bottom: 30px;
        }

        /* חלון המשימה - עיצוב משחקי */
        .quest-card {
            background: var(--card-white);
            border-radius: 30px;
            padding: 40px 20px;
            box-shadow: 0 20px 0px #bcdffb, 0 30px 50px rgba(0,0,0,0.1);
            border: 4px solid var(--primary);
            position: relative;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* תגית "QUEST" בצד */
        .quest-tag {
            position: absolute;
            top: -15px;
            right: 20px;
            background: var(--accent);
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: 800;
            transform: rotate(5deg);
            box-shadow: 3px 3px 0px #800;
        }

        #challenge-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a2b3c;
            transition: opacity 0.3s;
        }

        /* כפתור הגרלה */
        .draw-btn {
            margin-top: 40px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.4rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0px #0056b3;
            transition: all 0.1s;
            width: 100%;
        }

        .draw-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0px #0056b3;
        }

        /* קריאה לפעולה */
        .cta-footer {
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.6);
            padding: 15px;
            border-radius: 20px;
            border: 2px dashed var(--primary);
        }

        .cta-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 800;
            display: block;
            margin-top: 5px;
        }

        /* אנימציות */
        .shake { animation: shakeAnim 0.4s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(0,0); }
            25% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            75% { transform: translate(2px, -2px); }
        }

        /* ניצוצות */
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 2px;
            animation: confettiFall 2s ease-out forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 class="level-up-title">LEVEL UP!</h1>
        <p class="subtitle">המשימה היומית שתקדם אותך להצלחה</p>

        <div class="quest-card" id="card">
            <div class="quest-tag">QUEST</div>
            <div id="challenge-text">מוכן לאתגר?</div>
        </div>

        <button class="draw-btn" onclick="startQuest()">הגרל משימה עכשיו</button>

        <div class="cta-footer">
            נהלו את המשימות וההרגלים שלכם באפליקציה שלנו
            <a href="https://pcs365.co.il/index.html">לחצו כאן למעבר לאפליקציה</a>
        </div>
    </div>

    <script>
        const quests = [
            "קרא/י 10 דפים בספר התפתחות אישית",
            "בצע/י אימון ספורט של 30 דקות",
            "כתוב/י 3 דברים שאת/ה מודה עליהם היום",
            "הקדש/י 10 דקות למדיטציה או נשימות",
            "צפה/י בהרצאת TED מעוררת השראה",
            "סדר/י את סביבת העבודה שלך למיקוד",
            "שתה/י 2 ליטר מים במהלך היום",
            "תכנן/י את 3 המשימות הכי חשובות למחר",
            "התנתק/י מהרשתות החברתיות לשעתיים",
            "פרגן/י לאדם קרוב במילה טובה"
        ];

        function startQuest() {
            const card = document.getElementById('card');
            const text = document.getElementById('challenge-text');
            
            card.classList.add('shake');
            text.style.opacity = "0.3";
            text.innerText = "מגריל...";

            setTimeout(() => {
                card.classList.remove('shake');
                const randomQuest = quests[Math.floor(Math.random() * quests.length)];
                text.innerText = randomQuest;
                text.style.opacity = "1";
                createConfetti();
            }, 1000);
        }

        function createConfetti() {
            for(let i=0; i<30; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + "%";
                c.style.top = "0";
                c.style.backgroundColor = ['#007aff','#ff2d55','#ffcc00','#4cd964'][Math.floor(Math.random()*4)];
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 2000);
            }
        }
    </script>
</body>
</html>
