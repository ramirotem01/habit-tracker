    <!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quest - האתגר היומי</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007aff;
            --accent: #ff2d55;
            --bg: #f0f9ff;
            --card-white: #ffffff;
            --text-main: #0c4a6e;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* כותרת LEVEL UP */
        .level-up-title {
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--primary);
            margin: 0;
            line-height: 1;
            text-shadow: 4px 4px 0px #fff;
            letter-spacing: -2px;
        }

        /* כותרת משנה משופרת - גדולה ובולטת */
        .subtitle {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0369a1;
            margin-top: 10px;
            margin-bottom: 35px;
            display: block;
        }

        /* חלון המשימה */
        .quest-card {
            background: var(--card-white);
            border-radius: 30px;
            padding: 50px 25px;
            box-shadow: 0 15px 35px rgba(0, 122, 255, 0.15);
            border: 3px solid var(--primary);
            position: relative;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            cursor: pointer;
        }

        /* אפקט תזוזה לכרטיס */
        .quest-card:hover {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 122, 255, 0.25);
        }

        .quest-tag {
            position: absolute;
            top: -15px;
            right: 25px;
            background: var(--accent);
            color: white;
            padding: 6px 18px;
            border-radius: 12px;
            font-weight: 900;
            transform: rotate(5deg);
            box-shadow: 3px 3px 0px #800;
            font-size: 0.9rem;
        }

        #challenge-text {
            font-size: 1.7rem;
            font-weight: 800;
            color: #1a2b3c;
            line-height: 1.4;
        }

        /* כפתור הגרלה משופר */
        .draw-btn {
            margin-top: 35px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.3);
            transition: all 0.3s ease;
            width: 90%;
        }

        .draw-btn:hover {
            transform: scale(1.05);
            background: #0063cc;
            box-shadow: 0 15px 25px rgba(0, 122, 255, 0.4);
        }

        .draw-btn:active {
            transform: scale(0.98);
        }

        /* חלק תחתון - החזרת העיצוב מהגרסה הקודמת */
        .cta-box {
            margin-top: 50px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(0, 122, 255, 0.1);
        }

        .cta-box p {
            margin: 0;
            color: #64748b;
            font-size: 1rem;
        }

        .cta-box strong {
            display: block;
            margin-top: 5px;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .cta-link {
            color: #ffffff;
            background-color: #0369a1;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            border-radius: 15px;
            transition: all 0.3s;
        }

        .cta-link:hover {
            background: #0c4a6e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(3, 105, 161, 0.3);
        }

        /* אנימציות */
        .shake { animation: shakeAnim 0.4s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(0,0); }
            25% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            75% { transform: translate(3px, -3px); }
        }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            border-radius: 2px;
            pointer-events: none;
            animation: confettiFall 2.5s ease-out forwards;
            z-index: 100;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(800px) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 class="level-up-title">LEVEL UP!</h1>
        <span class="subtitle">המשימה היומית שתקדם אותך להצלחה</span>

        <div class="quest-card" id="card" onclick="startQuest()">
            <div class="quest-tag">DAILY QUEST</div>
            <div id="challenge-text">מוכן לאתגר של היום?</div>
        </div>

        <button class="draw-btn" onclick="startQuest()" id="drawBtn">הגרל משימה עכשיו</button>

        <div class="cta-box">
            <p>רוצה לעקוב אחרי ההתקדמות שלך?</p>
            <strong>נהל את המשימות וההרגלים שלך באפליקציה</strong>
            <a href="https://pcs365.co.il/index.html" class="cta-link">לחץ כאן למעבר לאפליקציה</a>
        </div>
    </div>

    <script>
        // בנק המשימות - תוכל להוסיף כאן משימות חדשות בקלות
        const quests = [
            "קרא/י 10 דפים בספר התפתחות אישית",
            "בצע/י אימון ספורט של 30 דקות",
            "כתוב/י 3 דברים שאת/ה מודה עליהם היום",
            "הקדש/י 10 דקות למדיטציה או נשימות",
            "צפה/י בהרצאת TED מעוררת השראה",
            "סדר/י את סביבת העבודה שלך למיקוד",
            "שתה/י 2 ליטר מים במהלך היום",
            "תכנן/י את 3 המשימות הכי חשובות למחר",
            "התנתק/י מהרשתות החברתיות לשעתיים",
            "כתוב/י 3 דברים שאת/ה מודה עליהם היום",
            "צא/י להליכה של 20 דקות בלי מוזיקה ובלי טלפון",
            "פרגן/י לעצמך בקול על משהו שעשית טוב השבוע",
            "שתה/י כוס מים לפני הקפה הראשון",
            "סדר/י מגירה אחת בלבד – עד הסוף",
            "כתוב/י מטרה אחת קטנה לשבוע הקרוב",
            "נשום/י עמוק 5 פעמים לפני תגובה אימפולסיבית",
            "שלח/י הודעה לאדם שלא דיברת איתו זמן מה",
            "כבה/י התראות לא נחוצות בטלפון",
        "הקדש/י 10 דקות לקריאה שמעשירה אותך",
        "אמור/י ״לא״ למשהו שלא מתאים לך",
"קום/י 10 דקות מוקדם יותר מחר",
"כתוב/י מה מעסיק אותך ואז קרע/י את הדף",
"עשה/י משהו טוב למישהו בלי שיידע",
"הקשב/י לשיר אחד עד הסוף, בלי הסחות",
"ציין/י הצלחה קטנה שהייתה לך היום",
"נקה/י את שולחן העבודה שלך",
"כתוב/י משפט אחד שמייצג את הערך הכי חשוב לך",
"צא/י לשמש ל־5 דקות",
"הימנע/י מביקורת עצמית למשך שעה",
"נסה/י דבר חדש קטן שלא ניסית בעבר",
"כתוב/י רשימה של 5 דברים שעושים לך טוב",
"שתף/י מישהו במשהו שעובר עליך",
"צפה/י במשהו מעורר השראה במקום גלילה",
"השאר/י את הטלפון בחדר אחר בזמן ארוחה",
"כתוב/י לעצמך הודעה מעודדת",
"הזכר/י לעצמך שאת/ה בתהליך – לא במרוץ",
"סלח/י לעצמך על טעות קטנה",
"עשה/י הפסקה אמיתית של 10 דקות בלי מסך",
"כתוב/י מה את/ה רוצה יותר ממנו השנה",
"הקשב/י באמת למישהו בלי להפריע",
"סיים/י משימה אחת שדחית",
"אמור/י תודה למישהו פנים אל פנים",
"כתוב/י מה את/ה צריך/ה עכשיו",
"עשה/י מתיחה קלה לגוף",
"נשום/י רגע לפני השינה",
"שים/י לב למחשבה שלילית – ואל תאמין/י לה מיד",
"ציין/י דבר אחד שאת/ה גאה בו",
"עשה/י משהו בשביל עצמך בלי רגשות אשם",
"הפחת/י רעש סביבך למשך חצי שעה",
"כתוב/י מכתב קצר לעצמך בעוד שנה",
"צא/י מאזור הנוחות בצעד אחד קטן",
"החלף/י ביקורת עצמית בחמלה",
"התמקד/י במשימה אחת בלבד",
"שים/י גבול קטן ובריא",
"סיים/י את היום בלי השוואות לאחרים",
"הזכר/י לעצמך שלא הכול חייב להיסגר היום",
            "פרגן/י לאדם קרוב במילה טובה"
        ];

        function startQuest() {
            const card = document.getElementById('card');
            const text = document.getElementById('challenge-text');
            const btn = document.getElementById('drawBtn');
            
            if(btn.disabled) return;
            btn.disabled = true;

            card.classList.add('shake');
            text.innerText = "מגריל משימה...";

            setTimeout(() => {
                card.classList.remove('shake');
                const randomQuest = quests[Math.floor(Math.random() * quests.length)];
                text.innerText = randomQuest;
                btn.disabled = false;
                btn.innerText = "הגרל משימה חדשה";
                createConfetti();
            }, 1100);
        }

        function createConfetti() {
            for(let i=0; i<40; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + "vw";
                c.style.top = "-20px";
                c.style.backgroundColor = ['#007aff','#ff2d55','#ffcc00','#4cd964','#a855f7'][Math.floor(Math.random()*5)];
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 2500);
            }
        }
    </script>
</body>
</html>
