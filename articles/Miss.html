<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אתגר ההצלחה היומי</title>
    <style>
        :root {
            --primary: #0ea5e9; /* תכלת בהיר */
            --secondary: #38bdf8;
            --bg: #f0f9ff; /* רקע תכלכל בהיר מאוד */
            --card-bg: #ffffff;
            --text-main: #0c4a6e;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #0369a1;
            font-weight: 800;
        }

        p.subtitle {
            color: var(--text-sub);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        /* מכולת הקלף המעוצבת */
        .challenge-card {
            background: var(--card-bg);
            border: none;
            border-radius: 24px;
            padding: 40px 25px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 1px solid rgba(14, 165, 233, 0.1);
        }

        .challenge-card:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(14, 165, 233, 0.25);
        }

        #challenge-text {
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.5;
            color: #075985;
        }

        /* אנימציית ערבוב */
        .shaking {
            animation: shake 0.4s infinite;
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(1deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-1deg); }
            100% { transform: rotate(0deg); }
        }

        /* כפתור תכלת */
        .btn-draw {
            margin-top: 30px;
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            transition: all 0.2s;
        }

        .btn-draw:hover {
            background: #0284c7;
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
            transform: translateY(-2px);
        }

        .btn-draw:active {
            transform: translateY(0);
        }

        .btn-draw:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* קריאה לפעולה */
        .cta-box {
            margin-top: 50px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            font-size: 1rem;
        }

        .cta-link {
            color: #ffffff;
            background-color: #0369a1;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .cta-link:hover {
            background: #0c4a6e;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>היום שלי מתחיל!</h1>
        <p class="subtitle">הגרל משימה חדשה שתהפוך את היום שלך למוצלח יותר.</p>

        <div class="challenge-card" id="card" onclick="drawChallenge()">
            <div id="challenge-text">לחץ להגרלת המשימה היומית</div>
        </div>

        <button class="btn-draw" onclick="drawChallenge()" id="drawBtn">הגרל משימה</button>

        <div class="cta-box">
            <p>רוצה לעקוב אחרי ההתקדמות שלך?</p>
            <strong>נהל את המשימות וההרגלים שלך באפליקציה</strong><br>
            <a href="https://pcs365.co.il/index.html" class="cta-link">לחץ כאן למעבר לאפליקציה</a>
        </div>
    </div>

    <script>
        const challenges = [
            "קרא/י 10 דפים בספר התפתחות אישית",
            "בצע/י אימון ספורט קצר של 30 דקות",
            "כתוב/י 3 דברים שאת/ה מודה עליהם היום",
            "הקדש/י 10 דקות למדיטציה או נשימות",
            "צפה/י בהרצאת TED מעוררת השראה",
            "סדר/י את סביבת העבודה שלך למיקוד מקסימלי",
            "שתה/י 2 ליטר מים במהלך היום",
            "תכנן/י את 3 המשימות הכי חשובות למחר",
            "התנתק/י מהרשתות החברתיות לשעתיים רצופות",
            "פרגן/י לאדם קרוב במילה טובה או הודעה"
        ];

        function drawChallenge() {
            const card = document.getElementById('card');
            const text = document.getElementById('challenge-text');
            const btn = document.getElementById('drawBtn');
            
            if(btn.disabled) return;

            btn.disabled = true;
            card.classList.add('shaking');
            text.innerText = "בוחר משימה מעצימה...";

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * challenges.length);
                card.classList.remove('shaking');
                text.innerText = challenges[randomIndex];
                btn.disabled = false;
                btn.innerText = "הגרל משימה חדשה";
            }, 1000);
        }
    </script>
</body>
</html>
