<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>מחשבון ריבית דריבית – חישוב צמיחת החיסכון לאורך זמן</title>

<style>
:root {
    --primary-color: #3498db;
    --secondary-color: #2c3e50;
    --text-color: #333;
}

body {
    background-color: #f9f9f9;
    font-family: Arial, "Segoe UI", sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.8;
    color: var(--text-color);
}

.article-page-container {
    max-width: 850px;
    margin: 0 auto;
    padding: 40px 20px;
    background: #fff;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
    min-height: 100vh;
}

.back-to-blog {
    display: inline-block;
    margin-bottom: 30px;
    color: var(--primary-color);
    text-decoration: none;
    font-weight: bold;
}

.article-header {
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 20px;
    margin-bottom: 30px;
}

.article-header h1 {
    font-size: 2.2em;
    color: var(--secondary-color);
    margin: 10px 0;
}

.meta-info {
    color: #95a5a6;
    font-size: 0.9em;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.article-body {
    font-size: 1.05em;
}

.footer-cta {
    margin-top: 60px;
    padding: 30px;
    background: #f8f9fa;
    border-radius: 10px;
    text-align: center;
}

.btn-main {
    display: inline-block;
    background: var(--primary-color);
    color: white;
    padding: 12px 25px;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
}


/* =========================
   COMPOUND INTEREST
========================= */

#compound-interest-calculator {
    max-width: 850px;
    margin: 30px auto;
    font-family: Arial, sans-serif;
    color: #222;
}

#compound-interest-calculator .ci-box {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

#compound-interest-calculator h2 {
    margin: 0 0 8px;
    font-size: 30px;
    color: #1f2937;
}

#compound-interest-calculator .ci-subtitle {
    margin: 0 0 25px;
    color: #6b7280;
    font-size: 16px;
}

#compound-interest-calculator .ci-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

#compound-interest-calculator .ci-field {
    display: flex;
    flex-direction: column;
}

#compound-interest-calculator label {
    font-weight: bold;
    margin-bottom: 7px;
    color: #374151;
}

#compound-interest-calculator input,
#compound-interest-calculator select {
    width: 100%;
    box-sizing: border-box;
    padding: 13px 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: #fff;
    outline: none;
}

#compound-interest-calculator input:focus,
#compound-interest-calculator select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

#compound-interest-calculator .ci-button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#compound-interest-calculator .ci-button:hover {
    background: #1d4ed8;
}

#compound-interest-calculator .ci-results {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

#compound-interest-calculator .ci-result {
    background: #f8fafc;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    border: 1px solid #e5e7eb;
}

#compound-interest-calculator .ci-result-title {
    font-size: 14px;
    color: #6b7280;
    margin-bottom: 8px;
}

#compound-interest-calculator .ci-result-value {
    font-size: 25px;
    font-weight: bold;
    color: #111827;
}

#compound-interest-calculator .ci-profit {
    color: #15803d;
}

#compound-interest-calculator .ci-summary {
    margin-top: 20px;
    background: #eff6ff;
    border-radius: 14px;
    padding: 20px;
}

#compound-interest-calculator .ci-summary-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 9px 0;
    border-bottom: 1px solid rgba(0,0,0,0.08);
}

#compound-interest-calculator .ci-summary-row:last-child {
    border-bottom: 0;
}

#compound-interest-calculator .ci-summary-label {
    color: #4b5563;
}

#compound-interest-calculator .ci-summary-value {
    font-weight: bold;
}

#compound-interest-calculator .ci-note {
    margin-top: 20px;
    font-size: 13px;
    line-height: 1.6;
    color: #6b7280;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .article-page-container {
        padding: 25px 15px;
    }

    .article-header h1 {
        font-size: 1.7em;
    }

    #compound-interest-calculator .ci-grid {
        grid-template-columns: 1fr;
    }

    #compound-interest-calculator .ci-results {
        grid-template-columns: 1fr;
    }

    #compound-interest-calculator .ci-box {
        padding: 20px;
    }

    #compound-interest-calculator h2 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="article-page-container">

    <a href="../blog.html" class="back-to-blog" id="back-link"></a>

    <article>

        <header class="article-header">

            <div class="meta-info">
                <span id="meta-date"></span>
                <span id="meta-read-time"></span>
            </div>

            <h1 id="main-h1"></h1>

        </header>


        <div class="article-body">

            <!-- =========================
                 CALCULATOR
            ========================== -->

            <div id="compound-interest-calculator">

                <div class="ci-box">

                    <h2 id="calculator-title"></h2>

                    <p class="ci-subtitle" id="calculator-subtitle"></p>

                    <div class="ci-grid">

                        <div class="ci-field">

                            <label for="ci-initial" id="label-initial"></label>

                            <input
                                type="number"
                                id="ci-initial"
                                value="10000"
                                min="0"
                                step="100"
                            >

                        </div>


                        <div class="ci-field">

                            <label for="ci-monthly" id="label-monthly"></label>

                            <input
                                type="number"
                                id="ci-monthly"
                                value="500"
                                min="0"
                                step="50"
                            >

                        </div>


                        <div class="ci-field">

                            <label for="ci-rate" id="label-rate"></label>

                            <input
                                type="number"
                                id="ci-rate"
                                value="7"
                                min="0"
                                step="0.1"
                            >

                        </div>


                        <div class="ci-field">

                            <label for="ci-years" id="label-years"></label>

                            <input
                                type="number"
                                id="ci-years"
                                value="20"
                                min="1"
                                max="100"
                                step="1"
                            >

                        </div>


                        <div class="ci-field">

                            <label for="ci-frequency" id="label-frequency"></label>

                            <select id="ci-frequency">

                                <option value="1" id="frequency-1"></option>

                                <option value="2" id="frequency-2"></option>

                                <option value="4" id="frequency-4"></option>

                                <option value="12" id="frequency-12"></option>

                                <option value="365" id="frequency-365"></option>

                            </select>

                        </div>

                    </div>


                    <button
                        type="button"
                        class="ci-button"
                        id="ci-calculate">
                    </button>


                    <div class="ci-results">

                        <div class="ci-result">

                            <div
                                class="ci-result-title"
                                id="result-future-title">
                            </div>

                            <div
                                class="ci-result-value"
                                id="ci-future">
                                ₪0
                            </div>

                        </div>


                        <div class="ci-result">

                            <div
                                class="ci-result-title"
                                id="result-contributions-title">
                            </div>

                            <div
                                class="ci-result-value"
                                id="ci-contributions">
                                ₪0
                            </div>

                        </div>


                        <div class="ci-result">

                            <div
                                class="ci-result-title"
                                id="result-interest-title">
                            </div>

                            <div
                                class="ci-result-value ci-profit"
                                id="ci-interest">
                                ₪0
                            </div>

                        </div>

                    </div>


                    <div class="ci-summary">

                        <div class="ci-summary-row">

                            <span
                                class="ci-summary-label"
                                id="summary-initial-label">
                            </span>

                            <span
                                class="ci-summary-value"
                                id="ci-summary-initial">
                                ₪0
                            </span>

                        </div>


                        <div class="ci-summary-row">

                            <span
                                class="ci-summary-label"
                                id="summary-monthly-label">
                            </span>

                            <span
                                class="ci-summary-value"
                                id="ci-summary-monthly">
                                ₪0
                            </span>

                        </div>


                        <div class="ci-summary-row">

                            <span
                                class="ci-summary-label"
                                id="summary-rate-label">
                            </span>

                            <span
                                class="ci-summary-value"
                                id="ci-summary-rate">
                                0%
                            </span>

                        </div>


                        <div class="ci-summary-row">

                            <span
                                class="ci-summary-label"
                                id="summary-years-label">
                            </span>

                            <span
                                class="ci-summary-value"
                                id="ci-summary-years">
                            </span>

                        </div>

                    </div>


                    <div
                        class="ci-note"
                        id="calculator-note">
                    </div>

                </div>

            </div>

        </div>


        <div class="footer-cta">

            <h3 id="footer-h3"></h3>

            <a
                href="../index.html"
                class="btn-main"
                id="footer-btn">
            </a>

        </div>

    </article>

</div>


<script>
(function () {

    "use strict";


    /* =========================
       TRANSLATIONS
    ========================== */

    var translations = {

        he: {

            back: "← חזרה לבלוג",

            date: "20 בספטמבר 2026",

            readTime: "5 דקות קריאה",

            title:
                "מחשבון ריבית דריבית – חישוב צמיחת החיסכון לאורך זמן",

            calculatorTitle:
                "מחשבון ריבית דריבית",

            calculatorSubtitle:
                "גלו כיצד החיסכון שלכם יכול לצמוח לאורך זמן באמצעות ריבית דריבית.",

            initial:
                "סכום התחלתי (₪)",

            monthly:
                "הפקדה חודשית (₪)",

            rate:
                "ריבית שנתית (%)",

            years:
                "תקופת השקעה (שנים)",

            frequency:
                "תדירות חישוב הריבית",

            annually:
                "שנתית",

            semiAnnually:
                "חצי שנתית",

            quarterly:
                "רבעונית",

            monthlyFrequency:
                "חודשית",

            daily:
                "יומית",

            calculate:
                "חשבו את הסכום",

            futureValue:
                "הסכום העתידי",

            contributions:
                "סך ההפקדות",

            interest:
                "הריבית שנצברה",

            summaryInitial:
                "סכום התחלתי",

            summaryMonthly:
                "הפקדה חודשית",

            summaryRate:
                "ריבית שנתית",

            summaryYears:
                "תקופת השקעה",

            note:
                "המחשבון מספק הערכה בלבד על בסיס הנתונים שהוזנו. התוצאה בפועל עשויה להשתנות בהתאם לתשואה, עמלות, מיסוי, אינפלציה ושינויים בריבית.",

            footerTitle:
                "מוכנים להתחיל?",

            footerButton:
                "חזרה לאפליקציה"

        },


        en: {

            back: "Back to Blog →",

            date: "September 20, 2026",

            readTime: "5 min read",

            title:
                "Compound Interest Calculator – Calculate Your Investment Growth",

            calculatorTitle:
                "Compound Interest Calculator",

            calculatorSubtitle:
                "See how your money can grow over time with compound interest.",

            initial:
                "Initial Investment ($)",

            monthly:
                "Monthly Contribution ($)",

            rate:
                "Annual Interest Rate (%)",

            years:
                "Investment Period (Years)",

            frequency:
                "Compounding Frequency",

            annually:
                "Annually",

            semiAnnually:
                "Semi-annually",

            quarterly:
                "Quarterly",

            monthlyFrequency:
                "Monthly",

            daily:
                "Daily",

            calculate:
                "Calculate",

            futureValue:
                "Future Value",

            contributions:
                "Total Contributions",

            interest:
                "Interest Earned",

            summaryInitial:
                "Initial Investment",

            summaryMonthly:
                "Monthly Contribution",

            summaryRate:
                "Annual Interest Rate",

            summaryYears:
                "Investment Period",

            note:
                "This calculator provides an estimate based on the information entered. Actual investment returns may vary. It does not account for taxes, fees, inflation, or changes in interest rates.",

            footerTitle:
                "Ready to Start?",

            footerButton:
                "Back to App"

        }

    };


    /* =========================
       DETECT LANGUAGE
    ========================== */

    var userLang =
        navigator.language &&
        navigator.language.toLowerCase().indexOf("he") === 0
            ? "he"
            : "en";

    var t = translations[userLang];


    /* =========================
       PAGE DIRECTION
    ========================== */

    document.documentElement.lang = userLang;

    document.documentElement.dir =
        userLang === "he" ? "rtl" : "ltr";


    /* =========================
       PAGE TEXT
    ========================== */

    document.title = t.title;

    document.getElementById("back-link").textContent =
        t.back;

    document.getElementById("meta-date").textContent =
        t.date;

    document.getElementById("meta-read-time").textContent =
        t.readTime;

    document.getElementById("main-h1").textContent =
        t.title;


    /* =========================
       CALCULATOR TEXT
    ========================== */

    document.getElementById("calculator-title").textContent =
        t.calculatorTitle;

    document.getElementById("calculator-subtitle").textContent =
        t.calculatorSubtitle;

    document.getElementById("label-initial").textContent =
        t.initial;

    document.getElementById("label-monthly").textContent =
        t.monthly;

    document.getElementById("label-rate").textContent =
        t.rate;

    document.getElementById("label-years").textContent =
        t.years;

    document.getElementById("label-frequency").textContent =
        t.frequency;


    document.getElementById("frequency-1").textContent =
        t.annually;

    document.getElementById("frequency-2").textContent =
        t.semiAnnually;

    document.getElementById("frequency-4").textContent =
        t.quarterly;

    document.getElementById("frequency-12").textContent =
        t.monthlyFrequency;

    document.getElementById("frequency-365").textContent =
        t.daily;


    document.getElementById("ci-calculate").textContent =
        t.calculate;


    document.getElementById("result-future-title").textContent =
        t.futureValue;

    document.getElementById("result-contributions-title").textContent =
        t.contributions;

    document.getElementById("result-interest-title").textContent =
        t.interest;


    document.getElementById("summary-initial-label").textContent =
        t.summaryInitial;

    document.getElementById("summary-monthly-label").textContent =
        t.summaryMonthly;

    document.getElementById("summary-rate-label").textContent =
        t.summaryRate;

    document.getElementById("summary-years-label").textContent =
        t.summaryYears;


    document.getElementById("calculator-note").textContent =
        t.note;


    document.getElementById("footer-h3").textContent =
        t.footerTitle;

    document.getElementById("footer-btn").textContent =
        t.footerButton;


    /* =========================
       DEFAULT VALUES
    ========================== */

    if (userLang === "he") {

        document.getElementById("ci-initial").value = 10000;

        document.getElementById("ci-monthly").value = 500;

        document.getElementById("ci-rate").value = 7;

        document.getElementById("ci-years").value = 20;

    } else {

        document.getElementById("ci-initial").value = 10000;

        document.getElementById("ci-monthly").value = 200;

        document.getElementById("ci-rate").value = 7;

        document.getElementById("ci-years").value = 20;

    }


    /* =========================
       MONEY FORMAT
    ========================== */

    function formatMoney(value) {

        if (!isFinite(value)) {
            value = 0;
        }

        return new Intl.NumberFormat(
            userLang === "he" ? "he-IL" : "en-US",
            {
                style: "currency",
                currency: userLang === "he" ? "ILS" : "USD",
                maximumFractionDigits: 0
            }
        ).format(value);
    }


    /* =========================
       CALCULATE
    ========================== */

    function calculateCompoundInterest() {

        var initial =
            parseFloat(
                document.getElementById("ci-initial").value
            ) || 0;


        var monthly =
            parseFloat(
                document.getElementById("ci-monthly").value
            ) || 0;


        var annualRate =
            parseFloat(
                document.getElementById("ci-rate").value
            ) || 0;


        var years =
            parseInt(
                document.getElementById("ci-years").value,
                10
            ) || 1;


        var frequency =
            parseInt(
                document.getElementById("ci-frequency").value,
                10
            ) || 12;


        /* Validation */

        if (initial < 0) initial = 0;

        if (monthly < 0) monthly = 0;

        if (annualRate < 0) annualRate = 0;

        if (years < 1) years = 1;

        if (years > 100) years = 100;


        /* 
           Effective monthly rate based
           on the selected compounding frequency.
        */

        var periodicRate =
            annualRate / 100 / frequency;


        var monthlyRate =
            Math.pow(
                1 + periodicRate,
                frequency / 12
            ) - 1;


        var totalMonths =
            years * 12;


        var balance =
            initial;


        /*
         * Calculate month by month.
         * Monthly contribution is added
         * after the interest calculation.
         */

        for (
            var month = 1;
            month <= totalMonths;
            month++
        ) {

            balance =
                balance * (1 + monthlyRate);

            balance =
                balance + monthly;
        }


        var totalContributions =
            initial +
            (monthly * totalMonths);


        var interestEarned =
            balance -
            totalContributions;


        if (interestEarned < 0) {
            interestEarned = 0;
        }


        /* =========================
           DISPLAY RESULTS
        ========================== */

        document.getElementById("ci-future").textContent =
            formatMoney(balance);


        document.getElementById("ci-contributions").textContent =
            formatMoney(totalContributions);


        document.getElementById("ci-interest").textContent =
            formatMoney(interestEarned);


        document.getElementById("ci-summary-initial").textContent =
            formatMoney(initial);


        document.getElementById("ci-summary-monthly").textContent =
            formatMoney(monthly);


        document.getElementById("ci-summary-rate").textContent =
            annualRate.toFixed(2) + "%";


        document.getElementById("ci-summary-years").textContent =
            userLang === "he"
                ? (
                    years === 1
                        ? "שנה אחת"
                        : years + " שנים"
                )
                : (
                    years === 1
                        ? "1 year"
                        : years + " years"
                );

    }


    /* =========================
       EVENTS
    ========================== */

    document
        .getElementById("ci-calculate")
        .addEventListener(
            "click",
            calculateCompoundInterest
        );


    var calculatorInputs =
        document.querySelectorAll(
            "#compound-interest-calculator input, #compound-interest-calculator select"
        );


    calculatorInputs.forEach(function (element) {

        element.addEventListener(
            "input",
            calculateCompoundInterest
        );

        element.addEventListener(
            "change",
            calculateCompoundInterest
        );

    });


    /* =========================
       INITIAL CALCULATION
    ========================== */

    calculateCompoundInterest();


})();
</script>

</body>
</html>
