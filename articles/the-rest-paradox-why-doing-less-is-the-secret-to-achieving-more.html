        const translations = {

                body: `<p>בעולם המודרני, אנחנו מקדשים את ה"עומס". אנחנו חושבים שאם הלו"ז שלנו ב-PCS365 מלא מקצה לקצה, אנחנו פרודוקטיביים. אבל המציאות הפוכה: עבודה ללא הפסקות יזומות יוצרת "זמן מתח" – מצב שבו המוח עובד על פול גז, אבל היעילות שואפת לאפס.</p>

<h2>1. חוק התפוקה השולית הפוחתת</h2>
<p>המוח האנושי יכול להישאר בריכוז שיא למשך 60 עד 90 דקות בלבד. לאחר מכן, רמת הריכוז צונחת. אם תמשיכו לעבוד בכוח, המשימה שתיקח לכם בדרך כלל חצי שעה, תימרח על פני שעה וחצי. משימת מנוחה של 10 דקות היא לא "הפסד זמן", היא השקעה שמחזירה לכם את הריכוז לקראת המשימה הבאה.</p>

<h2>2. מהו "זמן מתח" ואיך הוא פוגע בכם?</h2>
<p>זמן מתח הוא המצב שבו אתם לא באמת עובדים, אבל אתם גם לא נחים (למשל: גלילה אינסופית בטלפון בזמן העבודה). זהו זמן שבו רמות הקורטיזול (הורמון הסטרס) נשארות גבוהות, מה שמוביל לשחיקה מהירה. הכנסת משימות מנוחה יזומות – כמו נשימות, הליכה קצרה או פשוט בהייה בנוף – מורידה את רמת המתח ומאפשרת למערכת העצבית להירגע.</p>

<h2>3. שילוב משימות מנוחה ב-PCS365</h2>
<p>אל תסתכלו על מנוחה כעל "משהו שעושים כשמסיימים". הפכו אותה למשימה רשמית במערכת:</p>
<ul>
    <li><strong>משימות עוגן:</strong> הגדירו משימה של 15 דקות "ניתוק מסכים" לאחר כל שעתיים של עבודה מרוכזת.</li>
    <li><strong>משימת נשימה:</strong> הכניסו משימה יומית של 5 דקות תרגול נשימות. זה נראה קטן, אבל הניתוח השבועי שלכם יראה קשר ישיר בין ימים עם "הפסקות רשומות" לבין הספק גבוה יותר במשימות המורכבות.</li>
</ul>

<h2>4. המנוחה בונה את השריר</h2>
<p>כמו בספורט, השריר לא גדל בזמן האימון אלא בזמן המנוחה שאחריו. כך גם המוח. הרעיונות הטובים ביותר והתובנות העמוקות (Deep Insights) שמופיעים בניתוח ה-AI שלכם, מגיעים לעיתים קרובות ברגעים שבהם המוח היה ב"מצב מנוחה" (Default Mode Network).</p>

<p><strong>הטיפ שלנו:</strong> בסוף היום, כשאתם עוברים על רשימת המשימות, סמנו V על המנוחה בגאווה בדיוק כמו שסימנתם על פגישה חשובה. מנוחה היא לא פרס על עבודה קשה – היא התנאי לעבודה טובה.</p>`, 
                footerH3: "מוכנים להתחיל?", 
                footerBtn: "חזרה לאפליקציה" 
            },
            en: { 
                back: "Back to Blog →",

                body: `<p>In the modern world, we worship "busyness." We think that if our PCS365 schedule is packed from edge to edge, we are productive. But the reality is the opposite: working without intentional breaks creates "Stress Time"—a state where the brain is revving at full speed, but efficiency is near zero.</p>

<h2>1. The Law of Diminishing Returns</h2>
<p>The human brain can stay in peak focus for only 60 to 90 minutes. After that, concentration plummets. If you push through by force, a task that usually takes 30 minutes will stretch to 90. A 10-minute rest task isn't "lost time"; it's an investment that restores your focus for the next challenge.</p>

<h2>2. What is "Stress Time" and How Does it Hurt You?</h2>
<p>Stress time is when you aren't truly working, but you aren't resting either (e.g., mindlessly scrolling on your phone while at your desk). During this time, cortisol levels remain high, leading to rapid burnout. Inserting intentional rest tasks—like deep breathing, a short walk, or simply staring out the window—lowers stress and allows the nervous system to reset.</p>

<h2>3. Integrating Rest into PCS365</h2>
<p>Don't view rest as "something you do when you're finished." Make it an official task in the system:</p>
<ul>
    <li><strong>Anchor Tasks:</strong> Define a 15-minute "Screen Disconnect" task after every two hours of deep work.</li>
    <li><strong>Breathing Tasks:</strong> Add a daily 5-minute breathing exercise. It seems small, but your Weekly Analysis will show a direct link between days with "scheduled breaks" and higher output on complex tasks.</li>
</ul>

<h2>4. Rest Builds the Muscle</h2>
<p>Just like in sports, muscles don't grow during the workout; they grow during the recovery that follows. The brain is no different. Your best ideas and the Deep Insights provided by our AI often emerge when the brain is in "Default Mode"—the resting state.</p>

<p><strong>Our Tip:</strong> At the end of the day, when reviewing your checklist, check off your rest tasks with the same pride as a major meeting. Rest isn't a reward for hard work—it's the requirement for good work.</p>`,
