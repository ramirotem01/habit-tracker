<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מחשבון משכנתא חינם – חישוב החזר חודשי ועלות המשכנתא</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --text-color: #333;
        }

        body {
            background-color: #f9f9f9;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            color: var(--text-color);
        }

        .article-page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            min-height: 100vh;
        }

        .back-to-blog {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .article-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .article-header h1 {
            font-size: 2.2em;
            color: var(--secondary-color);
            margin: 10px 0;
        }

        .meta-info {
            color: #95a5a6;
            font-size: 0.9em;
            display: flex;
            gap: 15px;
        }

        .article-body {
            font-size: 1.05em;
        }

        .footer-cta {
            margin-top: 60px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
        }

        .btn-main {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Mortgage Calculator */

        .mortgage-box {
            max-width: 920px;
            margin: 30px auto;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
        }

        .mortgage-card {
            background: #f5f7fb;
            border: 1px solid #e2e7ef;
            border-radius: 18px;
            padding: 28px;
        }

        .mortgage-title {
            text-align: center;
            margin: 0 0 8px;
            font-size: 30px;
            color: #14213d;
        }

        .mortgage-subtitle {
            text-align: center;
            color: #667085;
            margin: 0 0 28px;
            font-size: 15px;
            line-height: 1.6;
        }

        .mortgage-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .mortgage-field {
            background: #fff;
            border: 1px solid #e1e6ee;
            border-radius: 12px;
            padding: 15px;
        }

        .mortgage-field label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 8px;
            color: #344054;
        }

        .mortgage-field input,
        .mortgage-field select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cfd6e1;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
            outline: none;
        }

        .mortgage-field input:focus,
        .mortgage-field select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }

        .mortgage-hint {
            font-size: 12px;
            color: #667085;
            margin-top: 6px;
            line-height: 1.5;
        }

        .mortgage-button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .mortgage-button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .mortgage-results {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .mortgage-result {
            background: #fff;
            border: 1px solid #e1e6ee;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .mortgage-result.primary {
            background: #eaf2ff;
            border-color: #bfdbfe;
        }

        .mortgage-result span {
            display: block;
            color: #667085;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .mortgage-result strong {
            font-size: 21px;
            color: #14213d;
        }

        .mortgage-breakdown {
            margin-top: 22px;
            background: #fff;
            border: 1px solid #e1e6ee;
            border-radius: 12px;
            padding: 20px;
        }

        .mortgage-breakdown-title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #14213d;
        }

        .mortgage-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #edf0f5;
            font-size: 14px;
        }

        .mortgage-row:last-child {
            border-bottom: 0;
        }

        .mortgage-row strong {
            white-space: nowrap;
        }

        .mortgage-chart-wrap {
            margin-top: 22px;
            background: #fff;
            border: 1px solid #e1e6ee;
            border-radius: 12px;
            padding: 20px;
        }

        .mortgage-chart-title {
            font-weight: 700;
            margin-bottom: 15px;
            color: #14213d;
        }

        .mortgage-chart {
            width: 100%;
            height: 270px;
            display: block;
        }

        .mortgage-warning {
            display: none;
            margin-top: 16px;
            padding: 12px 15px;
            border-radius: 9px;
            background: #fff4e5;
            border: 1px solid #f4c98b;
            color: #8a4b08;
            font-size: 13px;
            line-height: 1.6;
        }

        .mortgage-note {
            font-size: 12px;
            line-height: 1.7;
            color: #667085;
            margin-top: 18px;
        }

        @media(max-width:700px) {
            .article-page-container {
                padding: 25px 15px;
            }

            .article-header h1 {
                font-size: 1.7em;
            }

            .mortgage-card {
                padding: 18px;
            }

            .mortgage-title {
                font-size: 24px;
            }

            .mortgage-grid,
            .mortgage-results {
                grid-template-columns: 1fr;
            }

            .mortgage-result strong {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="article-page-container">

    <a href="../blog.html" class="back-to-blog" id="back-link"></a>

    <article>

        <header class="article-header">

            <div class="meta-info">

                        <div class="mortgage-field">
                            <label for="homePrice" id="label-home-price"></label>
                            <input id="homePrice" type="number" min="0" step="1000">

                        </div>

                        <div class="mortgage-field">
                            <label for="downPayment" id="label-down-payment"></label>

                            <div class="mortgage-hint" id="hint-down-payment"></div>
                        </div>

                        <div class="mortgage-field">

                            <input id="interestRate" type="number" min="0" max="30" step="0.01">
                            <div class="mortgage-hint" id="hint-interest"></div>
                        </div>

                        <div class="mortgage-field">
                            <label for="loanTerm" id="label-term"></label>

                            <select id="loanTerm">
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="25">25</option>
                                <option value="30">30</option>
                            </select>

                            <div class="mortgage-hint" id="hint-term"></div>
                        </div>

                        <div class="mortgage-field">
                            <label for="propertyTax" id="label-tax"></label>
                            <input id="propertyTax" type="number" min="0" max="10" step="0.01">
                            <div class="mortgage-hint" id="hint-tax"></div>
                        </div>

                        <div class="mortgage-field">
                            <label for="insurance" id="label-insurance"></label>
                            <input id="insurance" type="number" min="0" step="100">
                            <div class="mortgage-hint" id="hint-insurance"></div>
                        </div>

                        <div class="mortgage-field">
                            <label for="hoa" id="label-hoa"></label>
                            <input id="hoa" type="number" min="0" step="10">
                            <div class="mortgage-hint" id="hint-hoa"></div>
                        </div>

                        <div class="mortgage-field">
                            <label for="pmi" id="label-pmi"></label>
                            <input id="pmi" type="number" min="0" step="10">
                            <div class="mortgage-hint" id="hint-pmi"></div>
                        </div>

                    </div>

                    <button class="mortgage-button" id="calculate-button"></button>

                    <div class="mortgage-warning" id="mortgage-warning"></div>

                    <div class="mortgage-results">

                        <div class="mortgage-result primary">
                            <span id="result-monthly-label"></span>
                            <strong id="monthlyPayment">$0</strong>
                        </div>

                        <div class="mortgage-result">
                            <span id="result-pi-label"></span>
                            <strong id="principalInterest">$0</strong>
                        </div>

                        <div class="mortgage-result">
                            <span id="result-interest-label"></span>
                            <strong id="totalInterest">$0</strong>
                        </div>

                        <div class="mortgage-result">
                            <span id="result-cost-label"></span>
                            <strong id="totalMortgageCost">$0</strong>
                        </div>

                    </div>

                    <div class="mortgage-breakdown">

                        <div class="mortgage-breakdown-title" id="breakdown-title"></div>

                        <div class="mortgage-row">
                            <span id="row-home"></span>
                            <strong id="resultHomePrice">$0</strong>
                        </div>

                        <div class="mortgage-row">
                            <span id="row-down"></span>
                            <strong id="resultDownPayment">$0</strong>
                        </div>

                        <div class="mortgage-row">
                            <span id="row-loan"></span>
                            <strong id="loanAmount">$0</strong>
                        </div>

                        <div class="mortgage-row">
                            <span id="row-pi"></span>
                            <strong id="resultPI">$0</strong>
                        </div>

                        <div class="mortgage-row">
                            <span id="row-tax"></span>
                            <strong id="monthlyTax">$0</strong>
                        </div>

                        <div class="mortgage-row">
                            <span id="row-insurance"></span>
                            <strong id="monthlyInsurance">$0</strong>
                        </div>

                        <div class="mortgage-row">
                            <span id="row-hoa"></span>
                            <strong id="resultHOA">$0</strong>
                        </div>

                        <div class="mortgage-row">
                            <span id="row-pmi"></span>
                            <strong id="resultPMI">$0</strong>
                        </div>

                    </div>

                    <div class="mortgage-chart-wrap">

                        <div class="mortgage-chart-title" id="chart-title"></div>

                        <canvas
                            class="mortgage-chart"
                            id="mortgageChart">
                        </canvas>

                    </div>

                    <div class="mortgage-note" id="mortgage-note"></div>

                </div>

            </div>

        </div>

        <div class="footer-cta">

            <h3 id="footer-h3"></h3>

            <a
                href="../index.html"
                class="btn-main"
                id="footer-btn">
            </a>

        </div>

    </article>

</div>


<script>

            home:

            pmiRow:

            chart:

            warning:

            footer:

        },

        en: {

            back:

            date:

            readTime:

            title:
                'US Mortgage Calculator – Calculate Your Monthly Payment and Total Cost',

            calculatorTitle:
                'US Mortgage Calculator',

            calculatorSubtitle:
                'Estimate your monthly mortgage payment, interest cost and total homeownership cost.',

            homePrice:
                'Home Price ($)',

            homePriceHint:
                'Purchase price of the home',

            downPayment:
                'Down Payment ($)',

            downPaymentHint:
                'Amount you plan to pay upfront',

            interest:
                'Mortgage Interest Rate (%)',

            interestHint:

            term:

            breakdown:

            home:

            loan:

            warning:

            noLoan:

            note:
                '<strong>Disclaimer:</strong> This calculator provides an estimate for educational purposes only. Actual mortgage payments may vary based on loan type, lender, interest rate, credit profile, property taxes, insurance, PMI, HOA fees, closing costs and other factors. This calculator is not financial advice.',

            footer:

    const t = translations[lang];

    document.documentElement.lang = lang;
    document.documentElement.dir =
        lang === 'he' ? 'rtl' : 'ltr';

    document.title = t.title;


    function setText(id, text) {
        const element = document.getElementById(id);

        if (element) {
            element.textContent = text;
        }
    }


    setText('back-link', t.back);
    setText('meta-date', t.date);
    setText('meta-read-time', t.readTime);
    setText('main-h1', t.title);

    setText('calculator-title', t.calculatorTitle);
    setText('calculator-subtitle', t.calculatorSubtitle);

    setText('label-home-price', t.homePrice);
    setText('hint-home-price', t.homePriceHint);

    setText('label-down-payment', t.downPayment);
    setText('hint-down-payment', t.downPaymentHint);

    setText('label-interest', t.interest);

    setText('label-term', t.term);

    setText('row-hoa', t.hoaRow);
    setText('row-pmi', t.pmiRow);

    setText('chart-title', t.chart);

    document.getElementById('mortgage-note').innerHTML =
        t.note;

    setText('footer-h3', t.footer);
    setText('footer-btn', t.footerButton);


    /* Default values */

    if (lang === 'en') {

        document.getElementById('homePrice').value = 400000;
        document.getElementById('downPayment').value = 80000;
        document.getElementById('interestRate').value = 6.5;
        document.getElementById('loanTerm').value = 30;
        document.getElementById('propertyTax').value = 1.1;
        document.getElementById('insurance').value = 1800;
        document.getElementById('hoa').value = 0;
        document.getElementById('pmi').value = 0;

    } else {

        document.getElementById('homePrice').value = 2000000;
        document.getElementById('downPayment').value = 500000;
        document.getElementById('interestRate').value = 4.5;
        document.getElementById('loanTerm').value = 30;
        document.getElementById('propertyTax').value = 0;
        document.getElementById('insurance').value = 150;
        document.getElementById('hoa').value = 0;
        document.getElementById('pmi').value = 0;

    }


    function getNumber(id) {

        const value =
            parseFloat(document.getElementById(id).value);

        return isFinite(value) && value >= 0
            ? value
            : 0;
    }


    function money(value) {

        if (!isFinite(value)) {
            value = 0;
        }

        return new Intl.NumberFormat(
            lang === 'he' ? 'he-IL' : 'en-US',
            {
                style: 'currency',
                currency: t.currency,
                maximumFractionDigits: 0
            }
        ).format(value);
    }


    function calculateMortgage() {

        const homePrice =
            getNumber('homePrice');

        let downPayment =
            getNumber('downPayment');

        if (downPayment > homePrice) {

            downPayment = homePrice;

            document.getElementById(
                'downPayment'
            ).value = homePrice;
        }


        const interestRate =
            getNumber('interestRate');

        const years =
            Math.max(
                1,
                parseInt(
                    document.getElementById('loanTerm').value
                ) || 30
            );

        const propertyTaxRate =
            getNumber('propertyTax');

        const insurance =
            getNumber('insurance');

        const hoa =
            getNumber('hoa');

        const pmi =
            getNumber('pmi');


        const loanAmount =
            Math.max(
                0,
                homePrice - downPayment
            );

        const months =
            years * 12;

        const monthlyRate =
            interestRate / 100 / 12;


        let principalInterest = 0;


        if (loanAmount > 0) {

            if (monthlyRate > 0) {

                const factor =
                    Math.pow(
                        1 + monthlyRate,
                        months
                    );

                principalInterest =
                    loanAmount *
                    (
                        monthlyRate * factor
                    ) /
                    (
                        factor - 1
                    );

            } else {

                principalInterest =
                    loanAmount / months;
            }
        }


        const monthlyPropertyTax =
            homePrice *
            (propertyTaxRate / 100) /
            12;


        const monthlyInsurance =
            lang === 'en'
                ? insurance / 12
                : insurance;


        const monthlyPayment =
            principalInterest +
            monthlyPropertyTax +
            monthlyInsurance +
            hoa +
            pmi;


        const totalPrincipalInterest =
            principalInterest * months;


        const totalInterest =
            Math.max(
                0,
                totalPrincipalInterest -
                loanAmount
            );


        const totalInsurance =
            monthlyInsurance * months;


        const totalTax =
            monthlyPropertyTax * months;


        const totalHoa =
            hoa * months;


        const totalPmi =
            pmi * months;


        const totalCost =
            downPayment +
            totalPrincipalInterest +
            totalInsurance +
            totalTax +
            totalHoa +
            totalPmi;


        document.getElementById(
            'monthlyPayment'
        ).textContent =
            money(monthlyPayment);


        document.getElementById(
            'principalInterest'
        ).textContent =
            money(principalInterest);


        document.getElementById(
            'totalInterest'
        ).textContent =
            money(totalInterest);


        document.getElementById(
            'totalMortgageCost'
        ).textContent =
            money(totalCost);


        document.getElementById(
            'resultHomePrice'
        ).textContent =
            money(homePrice);


        document.getElementById(
            'resultDownPayment'
        ).textContent =
            money(downPayment);


        document.getElementById(
            'loanAmount'
        ).textContent =
            money(loanAmount);


        document.getElementById(
            'resultPI'
        ).textContent =
            money(principalInterest);


        document.getElementById(
            'monthlyTax'
        ).textContent =
            money(monthlyPropertyTax);


        document.getElementById(
            'monthlyInsurance'
        ).textContent =
            money(monthlyInsurance);


        document.getElementById(
            'resultHOA'
        ).textContent =
            money(hoa);


        document.getElementById(
            'resultPMI'
        ).textContent =
            money(pmi);


        const warning =
            document.getElementById(
                'mortgage-warning'
            );


        if (loanAmount === 0) {

            warning.style.display =
                'block';

            warning.textContent =
                t.noLoan;

        } else if (
            homePrice > 0 &&
            downPayment / homePrice < 0.20
        ) {

            warning.style.display =
                'block';

            warning.textContent =
                t.warning;

        } else {

            warning.style.display =
                'none';
        }


        drawChart(
            loanAmount,
            monthlyRate,
            principalInterest,
            months
        );
    }


    function drawChart(
        principal,
        monthlyRate,
        payment,
        months
    ) {

        const canvas =
            document.getElementById(
                'mortgageChart'
            );

        if (!canvas) {
            return;
        }


        const ctx =
            canvas.getContext('2d');


        const width =
            canvas.clientWidth ||
            750;

        const height =
            270;


        const dpr =
            window.devicePixelRatio || 1;


        canvas.width =
            width * dpr;

        canvas.height =
            height * dpr;


        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );


        ctx.clearRect(
            0,
            0,
            width,
            height
        );


        if (
            principal <= 0 ||
            months <= 0
        ) {

            return;
        }


        const left =
            lang === 'he' ? 70 : 60;

        const right = 25;
        const top = 20;
        const bottom = 42;


        const chartWidth =
            width - left - right;

        const chartHeight =
            height - top - bottom;


        let balance =
            principal;


        const points = [];


        const interval =
            Math.max(
                1,
                Math.ceil(months / 60)
            );


        for (
            let month = 0;
            month <= months;
            month++
        ) {

            if (
                month % interval === 0 ||
                month === months
            ) {

                points.push({
                    month: month,
                    balance: Math.max(
                        0,
                        balance
                    )
                });
            }


            if (month < months) {

                let interest =
                    balance *
                    monthlyRate;


                let principalPaid =
                    payment -
                    interest;


                if (principalPaid < 0) {
                    principalPaid = 0;
                }


                balance =
                    Math.max(
                        0,
                        balance -
                        principalPaid
                    );
            }
        }


        const maxBalance =
            Math.max(
                principal,
                1
            );


        /* Grid */

        ctx.strokeStyle =
            '#d9dee8';

        ctx.lineWidth = 1;


        for (
            let i = 0;
            i <= 4;
            i++
        ) {

            const y =
                top +
                chartHeight *
                i / 4;


            ctx.beginPath();

            ctx.moveTo(
                left,
                y
            );

            ctx.lineTo(
                width - right,
                y
            );

            ctx.stroke();


            const value =
                maxBalance *
                (1 - i / 4);


            ctx.fillStyle =
                '#667085';

            ctx.font =
                '11px Arial';


            ctx.textAlign =
                lang === 'he'
                    ? 'right'
                    : 'right';


            ctx.fillText(
                money(value),
                left - 8,
                y + 4
            );
        }


        /* Chart line */

        ctx.beginPath();


        points.forEach(
            function(point, index) {

                const x =
                    left +
                    (
                        point.month /
                        months
                    ) *
                    chartWidth;


                const y =
                    top +
                    chartHeight -
                    (
                        point.balance /
                        maxBalance
                    ) *
                    chartHeight;


                if (index === 0) {

                    ctx.moveTo(
                        x,
                        y
                    );

                } else {

                    ctx.lineTo(
                        x,
                        y
                    );
                }
            }
        );


        ctx.strokeStyle =
            '#2563eb';

        ctx.lineWidth = 3;

        ctx.stroke();


        /* Labels */

        ctx.fillStyle =
            '#667085';

        ctx.font =
            '11px Arial';

        ctx.textAlign =
            'center';


        ctx.fillText(
            t.chartStart,
            left,
            height - 12
        );


        ctx.fillText(
            t.chartEnd,
            width - right,
            height - 12
        );
    }


    document
        .getElementById('calculate-button')
        .addEventListener(
            'click',
            calculateMortgage
        );


    [
        'homePrice',
        'downPayment',
        'interestRate',
        'loanTerm',
        'propertyTax',
        'insurance',
        'hoa',
        'pmi'
    ].forEach(function(id) {

        const element =
            document.getElementById(id);

        element.addEventListener(
            'input',
            calculateMortgage
        );

        element.addEventListener(
            'change',
            calculateMortgage
        );
    });


    window.addEventListener(
        'resize',
        calculateMortgage
    );


    calculateMortgage();

})();

</script>

</html>
