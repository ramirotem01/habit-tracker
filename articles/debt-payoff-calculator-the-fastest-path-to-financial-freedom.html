const userLang =
    navigator.language &&
    navigator.language.toLowerCase().startsWith("he")

let debtCounter = 0;


/* הוספת חוב */

function debtCalculatorAddDebt(
    balance = "",
    apr = "",
    minimum = ""
) {

    debtCounter++;

    const container =
        document.getElementById("debts");

    if (!container) return;

    const row =
        document.createElement("div");

    row.id =
        "debt-" + debtCounter;

    row.style.cssText =
        "display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #edf0f3;";


    const defaultName =
        balance !== ""
            ? (userLang === "he"
                ? "כרטיס אשראי " + debtCounter
                : "Credit Card " + debtCounter)
            : "";


    row.innerHTML = `

        <div>

            <label style="display:block;font-size:13px;font-weight:bold;margin-bottom:5px;">
                ${userLang === "he" ? "שם החוב" : "Debt Name"}
            </label>

            <input class="debt-name"
                   type="text"
                   value="${defaultName}"
                   placeholder="${userLang === "he" ? "לדוגמה: כרטיס ויזה" : "e.g. Visa Card"}"
                   style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5df;border-radius:6px;">

        </div>


        <div>

            <label style="display:block;font-size:13px;font-weight:bold;margin-bottom:5px;">
                ${userLang === "he" ? "יתרה ($)" : "Balance ($)"}
            </label>

            <input class="debt-balance"
                   type="number"
                   min="0"
                   step="0.01"
                   value="${balance}"
                   placeholder="5000"
                   style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5df;border-radius:6px;">

        </div>


        <div>

            <label style="display:block;font-size:13px;font-weight:bold;margin-bottom:5px;">
                ${userLang === "he" ? "ריבית שנתית (%)" : "APR (%)"}
            </label>

            <input class="debt-apr"
                   type="number"
                   min="0"
                   step="0.01"
                   value="${apr}"
                   placeholder="24.99"
                   style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5df;border-radius:6px;">

        </div>


        <div>

            <label style="display:block;font-size:13px;font-weight:bold;margin-bottom:5px;">
                ${userLang === "he" ? "תשלום מינימום ($)" : "Minimum ($)"}
            </label>

            <input class="debt-minimum"
                   type="number"
                   min="0"
                   step="0.01"
                   value="${minimum}"
                   placeholder="150"
                   style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5df;border-radius:6px;">

        </div>


        <button type="button"
                onclick="debtCalculatorRemoveDebt(${debtCounter})"
                style="background:#fff;color:#c0392b;border:1px solid #e0b5b0;border-radius:6px;padding:9px;cursor:pointer;">

            ${userLang === "he" ? "הסרה" : "Remove"}

        </button>

    `;


    container.appendChild(row);

}


/* הסרת חוב */

function debtCalculatorRemoveDebt(id) {

    const element =
        document.getElementById("debt-" + id);

    if (element) {
        element.remove();
    }

}


/* קריאת חובות */

function debtCalculatorGetDebts() {

    const rows =
        document.querySelectorAll("#debts > div");

    const debts = [];

    rows.forEach((row,index) => {

        const name =
            row.querySelector(".debt-name")
                .value
                .trim()
            ||
            (userLang === "he"
                ? "חוב " + (index + 1)
                : "Debt " + (index + 1));


        const balance =
            parseFloat(
                row.querySelector(".debt-balance").value
            ) || 0;


        const apr =
            parseFloat(
                row.querySelector(".debt-apr").value
            ) || 0;


        const minimum =
            parseFloat(
                row.querySelector(".debt-minimum").value
            ) || 0;


        if (balance > 0) {

            debts.push({
                name:name,
                balance:balance,
                apr:apr,
                minimum:minimum
            });

        }

    });

    return debts;

}

    originalDebts,
    strategy,
    extraPayment
) {

    let debts =
        originalDebts.map(d => ({
            name:d.name,
            balance:d.balance,
            apr:d.apr,
            minimum:d.minimum
        }));


    let month = 0;

    let totalInterest = 0;

    let totalPaid = 0;

    const schedule = [];

    const maxMonths = 1200;


    while (
        debts.some(d => d.balance > 0.005) &&
        month < maxMonths
    ) {

        month++;


        let monthlyInterest = 0;


        /* ריבית */

        debts.forEach(d => {

            if (d.balance > 0) {

                const interest =
                    d.balance *
                    (d.apr / 100 / 12);

                d.balance += interest;

                monthlyInterest += interest;

            }

        });


        totalInterest += monthlyInterest;


        /* תשלומי מינימום */

        let paymentsThisMonth = 0;


        debts.forEach(d => {

            if (d.balance > 0) {

                const payment =
                    Math.min(
                        d.minimum,
                        d.balance
                    );

                d.balance -= payment;

                paymentsThisMonth += payment;

            }

        });


        /* קביעת חוב יעד */

        let activeDebts =
            debts.filter(
                d => d.balance > 0.005
            );


        activeDebts.sort((a,b) => {

            if (strategy === "snowball") {

                return a.balance - b.balance;

            }

            return b.apr - a.apr;

        });


        /* תשלום נוסף */

        let remainingExtra =
            extraPayment;


        for (let d of activeDebts) {

            if (remainingExtra <= 0) {
                break;
            }


            const payment =
                Math.min(
                    remainingExtra,
                    d.balance
                );


            d.balance -= payment;

            remainingExtra -= payment;

            paymentsThisMonth += payment;

        }


        totalPaid += paymentsThisMonth;


        schedule.push({

            month:month,

            balance:debts.reduce(
                (sum,d) =>
                    sum + Math.max(0,d.balance),
                0
            ),

            interest:monthlyInterest

        });

    }


    return {

        months:month,

        interest:totalInterest,

        totalPaid:totalPaid,

        schedule:schedule

    };

}
