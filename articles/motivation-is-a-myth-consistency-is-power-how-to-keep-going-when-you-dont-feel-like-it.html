    <script>
        const translations = {
            he: { 
                back: "← חזרה לבלוג",

                title: "מוטיבציה היא שקר, עקביות היא כוח: איך להמשיך כשנגמר ה"חשק"",
                body: `<p>כולנו מכירים את זה: אנחנו קמים בבוקר עם אנרגיה שיא, נחושים לכבוש את העולם. אבל יומיים לאחר מכן, הגשם יורד, הילדים לא נרדמו, ואנחנו פשוט "לא במוד". כאן בדיוק נופל רוב הציבור – הם מחכים שהמוטיבציה תחזור. הסוד של האנשים המצליחים ביותר הוא שהם הפסיקו לסמוך על מוטיבציה מזמן.</p>

<h2>1. הבעיה עם מוטיבציה: היא רגש, לא תוכנית</h2>
<p>מוטיבציה היא מצב רגשי חולף, כמו שמחה או כעס. לבנות את העתיד שלכם על מוטיבציה זה כמו לבנות בית על חול טובעני. עקביות, לעומת זאת, היא החלטה לוגית. כשאתם עקביים, אתם פועלים כי "זה מה שאני עושה", ולא כי "זה מה שבא לי לעשות".</p>

<h2>2. חוק ה-2 דקות: איך לנצח את חוסר החשק</h2>
<p>כשאין לכם מצב רוח למשימה גדולה, בצעו רק את ה-2 דקות הראשונות שלה. אל תתאמנו שעה – רק תנעלו נעלי ריצה ותצאו החוצה. ברוב המקרים, הקושי הוא להתחיל. ברגע שהתחלתם, העקביות משתלטת והמומנטום עושה את שלו.</p>

<h2>3. בנו מערכת, לא מטרה</h2>
<p>במקום לומר "אני רוצה להוריד 10 קילו" (מטרה שדורשת מוטיבציה), אמרו "אני אדם שמסמן משימת תזונה ב-PCS365 בכל ערב" (מערכת). המערכת שלכם לא צריכה מצב רוח טוב כדי לעבוד; היא צריכה רק שתלחצו על הכפתור.</p>

<h2>4. אל תשברו את השרשרת (Don't Break the Chain)</h2>
<p>הכוח הסודי של עקביות הוא הוויזואליזציה. כשאתם רואים רצף של ימים שבהם ביצעתם את ההרגל, נוצר במוח דחף פסיכולוגי לא "להרוס" את הרצף. המעקב הגרפי במערכת הופך את העקביות למשחק (Gamification), וזה חזק יותר מכל נאום מוטיבציה.</p>

<h2>5. סליחה עצמית ככלי לעקביות</h2>
<p>עקביות היא לא מושלמות. יום אחד התפקשש? לא נורא. הכלל של המקצוענים הוא: "לעולם לא לפספס פעמיים ברצף". פספוס אחד הוא טעות, פספוס שני הוא כבר התחלה של הרגל חדש (וגרוע). חזרו למסלול מיד, גם אם זה ב-50% יכולת.</p>

<p><strong>השורה התחתונה:</strong> מוטיבציה מביאה אתכם לקו הזינוק, אבל רק העקביות תביא אתכם לקו הסיום. אל תחכו ל"חשק" – פשוט תעשו.</p>`, 
                footerH3: "מוכנים להתחיל?", 
                footerBtn: "חזרה לאפליקציה" 
            },
            en: { 
                back: "Back to Blog →", 
                date: "May 4, 2026", 
                readTime: "⏱️ 5 min read",
                title: "Motivation is a Myth, Consistency is Power: How to Keep Going When You Don't Feel Like It",
                body: `<p>We've all been there: waking up with peak energy, determined to conquer the world. But two days later, it's raining, the kids didn't sleep, and you're just "not in the mood." This is where most people fail—they wait for motivation to return. The secret of the most successful people is that they stopped relying on motivation long ago.</p>

<h2>1. The Problem with Motivation: It's a Feeling, Not a Plan</h2>
<p>Motivation is a fleeting emotional state, like happiness or anger. Building your future on motivation is like building a house on quicksand. Consistency, however, is a logical decision. When you are consistent, you act because "this is what I do," not because "this is what I feel like doing."</p>

<h2>2. The 2-Minute Rule: Defeating "Not Feeling Like It"</h2>
<p>When you lack the mood for a big task, do just the first 2 minutes. Don't workout for an hour—just put on your running shoes and step outside. In most cases, the hardest part is starting. Once you begin, consistency takes over and momentum does the rest.</p>

<h2>3. Build a System, Not a Goal</h2>
<p>Instead of saying "I want to lose 10kg" (a goal requiring motivation), say "I am a person who logs a nutrition task in PCS365 every evening" (a system). Your system doesn't need a good mood to function; it just needs you to click the button.</p>

<h2>4. Don't Break the Chain</h2>
<p>The secret power of consistency is visualization. When you see a streak of days where you performed a habit, your brain develops a psychological urge not to "ruin" the sequence. The graphic tracking in the system turns consistency into a game (Gamification), which is stronger than any motivational speech.</p>

<h2>5. Self-Forgiveness as a Consistency Tool</h2>
<p>Consistency is not perfection. Messed up one day? It's okay. The pro rule is: "Never miss twice." One miss is a mistake; two misses is the start of a new (bad) habit. Get back on track immediately, even at 50% capacity.</p>

<p><strong>Bottom Line:</strong> Motivation gets you to the starting line, but only consistency gets you to the finish line. Don't wait for the "mood"—just act.</p>`,
