<style>
    :root {
        --primary-color: #3498db;
        --secondary-color: #2c3e50;
        --text-color: #333;
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background-color: #f9f9f9;
        font-family: "Segoe UI", system-ui, Arial, sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.8;
        color: var(--text-color);
    }

    .article-page-container {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
        background: #fff;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        min-height: 100vh;
    }

    .back-to-blog {
        display: inline-block;
        margin-bottom: 30px;
        color: var(--primary-color);
        text-decoration: none;
        font-weight: bold;
    }

    .back-to-blog:hover {
        text-decoration: underline;
    }

    .article-header {
        border-bottom: 2px solid #f0f0f0;
        padding-bottom: 20px;
        margin-bottom: 30px;
    }

    .article-header h1 {
        font-size: 2.2em;
        line-height: 1.3;
        color: var(--secondary-color);
        margin: 10px 0;
    }

    .meta-info {
        color: #95a5a6;
        font-size: 0.9em;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .article-body {
        width: 100%;
        font-size: 1.08em;
    }

    .article-body img {
        max-width: 100%;
        height: auto;
    }

    .article-body table {
        max-width: 100%;
    }

    .footer-cta {
        margin-top: 60px;
        padding: 30px;
        background: #f8f9fa;
        border-radius: 10px;
        text-align: center;
    }

    .btn-main {
        display: inline-block;
        background: var(--primary-color);
        color: white;
        padding: 12px 25px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
        transition: opacity 0.2s ease;
    }

    .btn-main:hover {
        opacity: 0.9;
    }

    /* RTL */
    html[dir="rtl"] .meta-info {
        flex-direction: row;
    }

    /* Mobile */
    @media (max-width: 768px) {
        .article-page-container {
            padding: 25px 15px;
        }

        .article-header h1 {
            font-size: 1.8em;
        }

        .article-body {
            font-size: 1em;
        }

        .article-body h2 {
            font-size: 24px !important;
        }

        .article-body h3 {
            font-size: 20px !important;
        }

        .article-body table {
            font-size: 14px;
        }
    }
</style>
