    <script>
        const translations = {
            he: { 
                back: "← חזרה לבלוג",

                body: `<p>חיפוש עבודה יכול להיות רכבת הרים רגשית. יום אחד אתם אופטימיים, וביום השני השקט מהמעסיקים שובר אתכם. המפתח לשמור על שפיות ועל תוצאות הוא להפסיק לסמוך על "מוטיבציה" ולעבור לניהול מבוסס הרגלים.</p>

<h2>1. הרגל ה-"Deep Work" היומי</h2>
<p>אל תחפשו עבודה לאורך כל היום – זה מתכון לשחיקה. קבעו "בלוק" של שעתיים בבוקר שבו אתם מרוכזים ב-100% רק בחיפוש. בזמן הזה אין רשתות חברתיות, רק שליחת קורות חיים מותאמים אישית ומחקר על חברות.</p>

<h2>2. חוק ה-5 פניות ביום</h2>
<p>במקום לשלוח 50 קורות חיים גנריים בבת אחת, אמצו הרגל של איכות: 5 פניות ביום, אבל כאלו שכוללות הודעה מותאמת אישית למגייס או לעובד בחברה ב-LinkedIn. העקביות הזו בונה "צנרת" של הזדמנויות לאורך זמן.</p>

<h2>3. הרגל הנטוורקינג היזום</h2>
<p>העבודות הטובות באמת נמצאות ב-"שוק הסמוי". הגדירו הרגל שבועי: שיחה אחת או פגישת קפה אחת עם מישהו מהתחום שלכם. המטרה היא לא לבקש עבודה, אלא לבקש עצות ולייצר נוכחות בראש של אנשים.</p>

<h2>4. ניהול ומעקב (CRM אישי)</h2>
<p>אל תסתמכו על הזיכרון. הפכו לניהול רישום של כל פנייה להרגל. מתי פניתם? מי איש הקשר? מתי צריך לבצע Follow-up? שימוש במערכת ניהול משימות הופך אתכם ממחפשים פסיביים למנהלי פרויקט של הקריירה שלכם.</p>

<h2>5. הרגל ה"התנתקות" המתוכננת</h2>
<p>כדי להישאר חדים בראיונות, אתם חייבים זמן שבו אתם לא מחפשים עבודה. הגדירו שעה ביום שבה המחשב נסגר ואתם מתמקדים בתחביב או בפעילות גופנית. הנטען המנטלי הזה קריטי כדי להגיע לראיונות עם אנרגיה גבוהה.</p>

<p><strong>לסיכום:</strong> העבודה הבאה שלכם לא תגיע בגלל מזל, היא תגיע בגלל המערכת שבניתם כדי למצוא אותה.</p>`, 
                footerH3: "מוכנים להתחיל?", 
                footerBtn: "חזרה לאפליקציה" 
            },
            en: { 
                back: "Back to Blog →", 
                date: "April 22, 2026", 
                readTime: "⏱️ 5 min read",
                title: "How to Find a Job Through the Right Habits: The Proactive Search Guide",
                body: `<p>Job hunting can be an emotional rollercoaster. One day you're optimistic, the next, the silence from employers breaks you. The key to maintaining sanity and results is to stop relying on "motivation" and switch to habit-based management.</p>

<h2>1. The Daily "Deep Work" Block</h2>
<p>Don't search for a job all day long—it's a recipe for burnout. Set a 2-hour block in the morning where you are 100% focused only on searching. During this time, no social media—just sending tailored CVs and researching companies.</p>

<h2>2. The Rule of 5 per Day</h2>
<p>Instead of sending 50 generic CVs at once, adopt a quality habit: 5 applications per day, but each including a personalized message to a recruiter or an employee at the company via LinkedIn. This consistency builds a "pipeline" of opportunities over time.</p>

<h2>3. Proactive Networking Habit</h2>
<p>The best jobs are often in the "hidden market." Set a weekly habit: one call or one coffee meeting with someone in your field. The goal isn't to ask for a job, but to ask for advice and create presence in people's minds.</p>

<h2>4. Tracking and Follow-up</h2>
<p>Don't rely on your memory. Make it a habit to log every application. When did you apply? Who is the contact person? When should you follow up? Using a task management system turns you from a passive seeker into a project manager of your career.</p>

<h2>5. The Planned "Disconnection" Habit</h2>
<p>To stay sharp in interviews, you must have time where you are NOT searching. Define an hour each day when the computer closes and you focus on a hobby or exercise. This mental recharge is critical for arriving at interviews with high energy.</p>

<p><strong>Summary:</strong> Your next job won't come because of luck; it will come because of the system you built to find it.</p>`,

            }
