                body: `<p>בסביבת העבודה התחרותית של ימינו, המשאב היקר ביותר שנמצא במחסור תמידי אינו תקציב או כוח אדם, אלא רוחב הפס המנטלי שלנו. מנהלים, בעלי עסקים ועובדי הייטק מוצפים מדי יום במאות פניות, מיילים ומשימות דחופות, ומוצאים את עצמם שורפים שעות יקרות על כיבוי שריפות במקום על קידום מטרות הליבה. הניסיון לפתור את האתגר הזה באמצעות מוטיבציה חולפת או עבודה אל תוך הלילה הוא באג ניהולי חמור המוביל לשחיקה כרונית (Burnout). מנהלים מצליחים מבינים ששיפור דרמטי של פרודוקטיביות וניהול זמן אינו פועל יוצא של שינויים דרסטיים, אלא תוצאה של הנדסת הרגלים אטומיים קטנים. כשמפרקים את יום העבודה לתהליכים מכניים ומסלקים את החיכוך, מייצרים חוק ריבית דריבית של זמן. הנה 15 הרגלים קטנים שישדרגו את רוטינות עבודה שלכם ויחסכו לכם שעות בכל שבוע.</p>
