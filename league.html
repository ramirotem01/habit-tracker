<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS365 - League Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Assistant', sans-serif; background: #f1f5f9; }
        .league-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .league-card:hover { transform: translateY(-4px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .tab-active { border-bottom: 3px solid #10b981; color: #10b981; }
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); 
            z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
        .badge-count { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <nav class="glass sticky top-0 z-50 border-b p-4">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="text-slate-500 font-bold flex items-center gap-1 hover:text-slate-800 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                דשבורד
            </a>
            <div class="font-black text-2xl italic tracking-tighter">PCS<span class="text-green-600">365</span></div>
            <div id="leagueCountBadge" class="bg-blue-100 text-blue-700 text-xs font-black px-3 py-1 rounded-full badge-count">0/5 ליגות</div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-4">
        
        <header class="mb-8 mt-6">
            <h1 class="text-3xl font-black text-slate-800">הזירה הקהילתית</h1>
            <p class="text-slate-500 font-medium">הצטרף לקרב על ההרגלים או פתח ליגה משלך</p>
        </header>

        <div class="flex gap-8 mb-6 border-b border-slate-200">
            <button onclick="switchTab('explore')" id="tab-explore" class="tab-active pb-3 font-extrabold transition-all">גלה ליגות</button>
            <button onclick="switchTab('myLeagues')" id="tab-myLeagues" class="pb-3 font-extrabold text-slate-400 hover:text-slate-600 transition-all">הליגות שלי</button>
        </div>

        <div class="flex gap-2 mb-8">
            <div class="relative flex-1">
                <input type="text" id="leagueSearch" oninput="renderLeagues()" placeholder="חפש ליגה (למשל: בוקר, ריצה...)" 
                       class="w-full p-4 pr-12 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-green-500 text-lg">
                <svg class="w-6 h-6 absolute right-4 top-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <button onclick="openCreateModal()" class="bg-slate-900 text-white p-4 rounded-2xl shadow-lg hover:bg-slate-800 transition-all transform active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            </button>
        </div>

        <div id="leaguesList" class="grid gap-4">
            <div class="flex flex-col items-center justify-center p-20 text-slate-400">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-500 mb-4"></div>
                <p>מחפש ליגות חמות...</p>
            </div>
        </div>

    </main>

    <div id="createModal" class="modal p-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-slate-800">ליגה חדשה</h2>
                <button onclick="closeCreateModal()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 px-1">שם הקבוצה</label>
                    <input type="text" id="newLeagueName" placeholder="למשל: אריות הבוקר" 
                           class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-green-500 focus:bg-white transition-all outline-none">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 px-1">מה ההרגל? (המשימה)</label>
                    <input type="text" id="newLeagueTask" placeholder="למשל: לקום ב-05:30" 
                           class="w-full p-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-green-500 focus:bg-white transition-all outline-none">
                </div>
                
                <div class="pt-4">
                    <button onclick="handleCreateLeague()" id="createBtn" class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl shadow-xl shadow-green-200 hover:bg-green-700 transition-all flex items-center justify-center gap-2">
                        <span>פתח ליגה והצטרף</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="firebase.js"></script>

    <script>
        let currentUser = null;
        let allLeagues = [];
        let currentTab = 'explore';

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "index.html"; return; }
            currentUser = user;
            listenToLeagues();
        });

        function listenToLeagues() {
            // מאזין לכל הליגות בזמן אמת
            db.collection("leagues").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                allLeagues = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderLeagues();
            });
        }

        function renderLeagues() {
            const list = document.getElementById('leaguesList');
            const searchTerm = document.getElementById('leagueSearch').value.toLowerCase();
            
            // סינון ליגות שהמשתמש חבר בהן
            const myLeagues = allLeagues.filter(l => l.members?.some(m => m.uid === currentUser.uid));
            document.getElementById('leagueCountBadge').innerText = `${myLeagues.length}/5 ליגות`;

            // קביעת הרשימה לתצוגה לפי הטאב והחיפוש
            let filtered = currentTab === 'explore' ? allLeagues : myLeagues;
            
            if (searchTerm) {
                filtered = filtered.filter(l => 
                    l.name.toLowerCase().includes(searchTerm) || 
                    l.habitTask.toLowerCase().includes(searchTerm)
                );
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-16 px-4 bg-white rounded-[2rem] border-2 border-dashed border-slate-200">
                        <div class="text-4xl mb-3">🔭</div>
                        <p class="text-slate-500 font-bold">לא מצאנו ליגות שתואמות לחיפוש...</p>
                    </div>`;
                return;
            }

            list.innerHTML = filtered.map(league => {
                const isMember = league.members?.some(m => m.uid === currentUser.uid);
                const memberCount = league.members?.length || 0;
                
                return `
                    <div onclick="goToLeague('${league.id}', ${isMember})" class="league-card bg-white p-6 rounded-[2rem] shadow-sm border border-white flex justify-between items-center">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="bg-amber-100 text-amber-700 text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-tighter">Gold League</span>
                                ${isMember ? '<span class="bg-blue-100 text-blue-600 text-[10px] font-black px-2 py-0.5 rounded-md uppercase">רשום</span>' : ''}
                            </div>
                            <h3 class="text-xl font-black text-slate-800">${league.name}</h3>
                            <p class="text-slate-500 text-sm font-medium flex items-center gap-1 mt-1">
                                <span class="text-green-600">🎯</span> ${league.habitTask}
                            </p>
                        </div>
                        
                        <div class="text-left flex flex-col items-end gap-2">
                            <div class="flex -space-x-2 rtl:space-x-reverse">
                                <div class="w-8 h-8 rounded-full bg-slate-100 border-2 border-white flex items-center justify-center text-[10px] font-bold text-slate-400">
                                    ${memberCount > 9 ? '+9' : memberCount}
                                </div>
                            </div>
                            <span class="text-[10px] font-bold text-slate-300 uppercase">${memberCount} משתתפים</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function handleCreateLeague() {
            const name = document.getElementById('newLeagueName').value.trim();
            const task = document.getElementById('newLeagueTask').value.trim();
            const btn = document.getElementById('createBtn');
            
            const myLeagues = allLeagues.filter(l => l.members?.some(m => m.uid === currentUser.uid));
            
            if (myLeagues.length >= 5) {
                alert("אופס! הגעת למקסימום (5 ליגות). צא מליגה אחת כדי לפתוח חדשה.");
                return;
            }

            if (!name || !task) return alert("צריך שם ומשימה כדי להתחיל!");

            btn.disabled = true;
            btn.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>';

            try {
                const newLeagueRef = await db.collection("leagues").add({
                    name: name,
                    habitTask: task,
                    createdBy: currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    members: [] // המשתמש יצורף אוטומטית דרך הפונקציה joinLeague
                });

                // הצטרפות אוטומטית לליגה שנוצרה
                if (window.joinLeague) {
                    await window.joinLeague(newLeagueRef.id);
                }

                closeCreateModal();
                window.location.href = `league-battle.html?id=${newLeagueRef.id}`;
            } catch (e) {
                console.error(e);
                alert("משהו השתבש ביצירה...");
                btn.disabled = false;
                btn.innerText = "צור ליגה";
            }
        }

        function goToLeague(id, isMember) {
            if (isMember) {
                window.location.href = `league-battle.html?id=${id}`;
            } else {
                // אם הוא לא חבר, נשלח אותו לדף הקרב והוא יוכל להצטרף שם
                window.location.href = `league-battle.html?id=${id}`;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-explore').className = tab === 'explore' ? 'tab-active pb-3 font-extrabold transition-all' : 'pb-3 font-extrabold text-slate-400 hover:text-slate-600 transition-all';
            document.getElementById('tab-myLeagues').className = tab === 'myLeagues' ? 'tab-active pb-3 font-extrabold transition-all' : 'pb-3 font-extrabold text-slate-400 hover:text-slate-600 transition-all';
            renderLeagues();
        }

        function openCreateModal() { document.getElementById('createModal').classList.add('active'); }
        function closeCreateModal() { 
            document.getElementById('createModal').classList.remove('active');
            document.getElementById('newLeagueName').value = "";
            document.getElementById('newLeagueTask').value = "";
        }
    </script>
</body>
</html>
