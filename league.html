<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS365 - Habit Battles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .crown { position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-15deg); font-size: 24px; z-index: 10; }
        .rank-1 { background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px solid #f59e0b; }
        .battle-card { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-900">

    <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="font-bold text-xl cursor-pointer" onclick="window.location.href='dashboard.html'">
            PCS<span class="text-green-600">365</span> <span class="text-sm font-normal text-gray-500">| Battles</span>
        </div>
        <div id="userStatus" class="text-xs font-medium text-gray-400">מתחבר...</div>
    </nav>

    <main class="max-w-md mx-auto p-4 pb-20">
        <section id="leagueHeader" class="bg-white rounded-2xl p-6 shadow-sm mb-6 text-center border border-gray-100">
            <h1 class="text-xl font-bold">טוען נתוני ליגה...</h1>
        </section>

        <section>
            <div class="flex justify-between items-center mb-4 px-2">
                <h2 class="font-bold text-gray-700 flex items-center">Leaderboard 🔥</h2>
                <span id="memberCount" class="text-xs text-gray-500"></span>
            </div>
            <div id="leaderboardList" class="space-y-3">
                </div>
        </section>

        <section class="mt-8 bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-6 text-white shadow-lg">
            <h3 class="font-bold text-lg">הזמן חברים לקרב! 😈</h3>
            <button onclick="shareLeague()" class="mt-4 bg-white text-indigo-700 font-bold py-2.5 px-6 rounded-xl w-full">
                העתק לינק להזמנה
            </button>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <script src="firebase.js"></script>

    <script>
        const LEAGUE_ID = "global_morning_league";

        // הפעלה ברגע שה-Auth מוכן
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }

            document.getElementById('userStatus').textContent = user.displayName || user.email;

            try {
                // 1. בדיקה/יצירה של הליגה
                const leagueRef = db.collection("leagues").doc(LEAGUE_ID);
                let leagueDoc = await leagueRef.get();

                if (!leagueDoc.exists) {
                    await leagueRef.set({
                        name: "ליגת הבוקר של PCS",
                        habitTask: "קימה ב-06:00",
                        type: "ליגת זהב",
                        members: [
                            { uid: "bot1", name: "גיא המקצוען", score: 85, streak: 6 },
                            { uid: "bot2", name: "מיכל לוי", score: 45, streak: 2 }
                        ]
                    });
                    leagueDoc = await leagueRef.get();
                }

                // 2. הצטרפות אוטומטית אם המשתמש לא רשום
                if (window.joinLeague) {
                    await window.joinLeague(LEAGUE_ID);
                }

                // 3. האזנה לשינויים בזמן אמת
                leagueRef.onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        updateUI(data, user.uid);
                    }
                });

            } catch (err) {
                console.error("League Error:", err);
                document.getElementById('leagueHeader').innerHTML = "שגיאה בטעינת הנתונים";
            }
        });

        function updateUI(data, currentUid) {
            // עדכון כותרת
            document.getElementById('leagueHeader').innerHTML = `
                <span class="bg-blue-50 text-blue-600 text-[10px] font-bold px-3 py-1 rounded-full border border-blue-100 uppercase">${data.type}</span>
                <h1 class="text-2xl font-black mt-3 text-gray-800">${data.name}</h1>
                <p class="text-gray-400 text-sm mt-1">משימה: <span class="text-gray-600 font-bold">${data.habitTask}</span></p>
            `;

            // עדכון רשימה
            const members = data.members || [];
            document.getElementById('memberCount').textContent = `${members.length} משתתפים`;

            const sorted = [...members].sort((a, b) => b.score - a.score);
            const listHtml = sorted.map((m, index) => {
                const isFirst = index === 0;
                const isMe = m.uid === currentUid;
                return `
                    <div class="battle-card ${isFirst ? 'rank-1' : 'bg-white'} ${isMe ? 'ring-2 ring-blue-400' : ''} relative p-4 rounded-2xl flex items-center shadow-sm border border-gray-100">
                        ${isFirst ? '<div class="crown">👑</div>' : ''}
                        <div class="w-8 h-8 ${isFirst ? 'bg-yellow-500 text-white' : 'bg-gray-100 text-gray-400'} rounded-full flex items-center justify-center font-bold text-sm">
                            ${index + 1}
                        </div>
                        <div class="mr-4 flex-1 text-right">
                            <div class="font-bold ${isMe ? 'text-blue-700' : 'text-gray-800'}">${m.name} ${isMe ? '(אתה)' : ''}</div>
                            <div class="text-[11px] opacity-70">רצף: ${m.streak || 0} ימים 🔥</div>
                        </div>
                        <div class="text-left">
                            <div class="font-black text-xl">${m.score || 0}</div>
                            <div class="text-[9px] uppercase font-bold opacity-50">Points</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('leaderboardList').innerHTML = listHtml;
        }

        function shareLeague() {
            const link = window.location.href;
            navigator.clipboard.writeText(link);
            alert("הלינק הועתק! 🚀");
        }
    </script>
</body>
</html>
